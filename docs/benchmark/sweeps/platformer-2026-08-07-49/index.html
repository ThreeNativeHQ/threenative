<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <title>Skybound Grove</title>
  </head>
  <body>
    <main id="app">
      <section id="hud" aria-live="polite">
        <div class="hud-topline">
          <div>
            <p class="eyebrow">SKYBOUND GROVE</p>
            <h1>Trailblazer Run</h1>
          </div>
          <div class="badge"><span class="star-icon">★</span><span id="coins">0</span><span class="muted">/ <span id="total">11</span></span></div>
        </div>
        <p id="status">Collect the stars and reach the flag</p>
        <div class="progress"><span id="progress-fill"></span></div>
        <div class="hud-bottom">
          <span><kbd>←</kbd> <kbd>→</kbd> run</span>
          <span><kbd>SPACE</kbd> jump</span>
          <span><kbd>R</kbd> restart</span>
          <span class="attempts">falls <strong id="deaths">0</strong></span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
