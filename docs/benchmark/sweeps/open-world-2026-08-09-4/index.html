<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Sunmeadow Range</title>
    <style>
      :root { color: #f7f1dc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #75bce6; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 5px #183621cc; }
      .brand { position: absolute; top: 24px; left: 28px; letter-spacing: .18em; font-size: 12px; font-weight: 800; }
      .brand strong { display: block; margin-top: 5px; letter-spacing: .04em; font: 700 27px/1 Georgia, serif; }
      .objective { position: absolute; top: 24px; right: 28px; width: 236px; padding: 14px 16px; border-left: 2px solid #f5ce69; background: linear-gradient(90deg, #102c1ecc, #102c1e33); font-size: 12px; letter-spacing: .08em; }
      .objective strong { display: block; margin-top: 5px; color: #ffe8a0; font-size: 15px; letter-spacing: 0; }
      .guide { position: absolute; left: 50%; bottom: 27px; transform: translateX(-50%); padding: 9px 15px; border: 1px solid #fff7; border-radius: 999px; background: #163821a8; font-size: 12px; letter-spacing: .08em; transition: opacity .5s; }
      .guide kbd { margin: 0 3px; padding: 2px 6px; color: #17331e; border-radius: 4px; background: #f8efd5; font: 800 11px/1.2 inherit; text-shadow: none; }
      .distance { position: absolute; right: 28px; bottom: 27px; color: #f7e7ae; font: 700 12px/1.4 ui-monospace, monospace; text-align: right; }
      .reticle { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border: 1px solid #fff9; border-radius: 50%; transform: translate(-50%, -50%); }
      .vignette { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, transparent 55%, #15351b42 110%); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud">
      <div class="vignette"></div>
      <div class="brand">OPEN TRAIL 03<strong>Sunmeadow Range</strong></div>
      <div class="objective">NEXT LANDMARK<strong id="objective">Old Shepherd's Arch · 145 m</strong></div>
      <div class="guide" id="guide"><kbd>←</kbd><kbd>→</kbd> trail&nbsp;&nbsp; <kbd>↑</kbd><kbd>↓</kbd> sidestep</div>
      <div class="distance" id="distance">0 m TRAVELLED<br>CHUNK 0 · 0</div>
      <div class="reticle"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
