<!doctype html>
<meta charset="utf-8">
<title>WebGPURenderer per-object cost</title>
<style>body{margin:0;background:#111;color:#eee;font:14px monospace}#out{position:fixed;top:8px;left:8px}</style>
<div id="out">measuring…</div>
<script type="importmap">
{ "imports": { "three": "./three.webgpu.js", "three/webgpu": "./three.webgpu.js", "three/tsl": "./three.tsl.js" } }
</script>
<script type="module">
import * as THREE from "three";

// Plain three.js. No framework. N separate Meshes sharing ONE material and ONE geometry,
// each moving every frame, rendered with WebGPURenderer. Reports CPU frame interval.
const N = Number(new URLSearchParams(location.search).get("n") ?? 4096);
const MODE = new URLSearchParams(location.search).get("mode") ?? "mesh"; // mesh | instanced
const BACKEND = new URLSearchParams(location.search).get("backend") ?? "webgpu"; // webgpu | webgl

const renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL: BACKEND === "webgl" });
renderer.setPixelRatio(1);
renderer.setSize(1280, 720);
renderer.setAnimationLoop(null);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1280 / 720, 0.1, 2000);
const material = new THREE.MeshStandardMaterial({ color: 0xb8c4cc, metalness: 0, roughness: 0.75 });
const geometry = new THREE.BoxGeometry(1, 1, 1);
const light = new THREE.DirectionalLight(0xffffff, 2.4);
light.position.set(40, 80, 25);
scene.add(light);

// Deterministic placement, same LCG as the original benchmark.
let seed = 1337;
const rand = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
const side = Math.ceil(Math.sqrt(N));
const placements = [];
for (let i = 0; i < N; i++) {
  placements.push({ x: (i % side - side / 2) * 2.5 + rand(), y: rand() * 2, z: (Math.floor(i / side) - side / 2) * 2.5 + rand() });
}

const meshes = [];
let instanced = null;
if (MODE === "instanced") {
  instanced = new THREE.InstancedMesh(geometry, material, N);
  scene.add(instanced);
} else {
  for (const p of placements) {
    const m = new THREE.Mesh(geometry, material);
    m.position.set(p.x, p.y, p.z);
    scene.add(m);
    meshes.push(m);
  }
}

const dummy = new THREE.Object3D();
function step(frame) {
  const t = frame * 0.016;
  if (instanced) {
    for (let i = 0; i < N; i++) {
      const p = placements[i];
      dummy.position.set(p.x, p.y + Math.sin(t + i) * 0.5, p.z);
      dummy.rotation.set(t, t * 0.5, 0);
      dummy.updateMatrix();
      instanced.setMatrixAt(i, dummy.matrix);
    }
    instanced.instanceMatrix.needsUpdate = true;
  } else {
    for (let i = 0; i < N; i++) {
      const m = meshes[i], p = placements[i];
      m.position.y = p.y + Math.sin(t + i) * 0.5;
      m.rotation.set(t, t * 0.5, 0);
    }
  }
  const r = side * 1.6;
  camera.position.set(Math.cos(t * 0.1) * r, r * 0.5, Math.sin(t * 0.1) * r);
  camera.lookAt(0, 0, 0);
}

await renderer.init();
const WARMUP = 60, FRAMES = 200;
const samples = [];
let frame = 0, prev = performance.now();
async function loop() {
  step(frame);
  await renderer.renderAsync(scene, camera);
  const now = performance.now();
  if (frame >= WARMUP) samples.push(now - prev);
  prev = now;
  frame++;
  if (frame < WARMUP + FRAMES) return requestAnimationFrame(loop);
  const v = samples.sort((a, b) => a - b);
  const p = (q) => v[Math.max(0, Math.floor(v.length * q) - 1)].toFixed(2);
  const result = { backend: BACKEND, mode: MODE, n: N, p50: p(0.5), p95: p(0.95), drawsPerFrame: Math.round(renderer.info.render.drawCalls / (WARMUP + FRAMES)) };
  document.getElementById("out").textContent = JSON.stringify(result);
  console.log("REPRO_RESULT:" + JSON.stringify(result));
}
renderer.info.autoReset = false;
requestAnimationFrame(loop);
</script>
