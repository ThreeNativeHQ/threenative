name: Resolve PR 222 conflicts

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/resolve-pr-222.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Build verified merge objects for the authorized final write
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected_conflicts='packages/runtime-native/tests/native-platform-workflow.test.mjs'
          if [ "$merge_status" -ne 0 ] && [ -z "$conflicts" ]; then
            echo "merge failed without ordinary file conflicts" >&2
            exit "$merge_status"
          fi
          if [ "$conflicts" != "$expected_conflicts" ]; then
            echo "unexpected conflict set:" >&2
            printf '%s\n' "$conflicts" >&2
            exit 1
          fi

          git checkout --ours -- packages/runtime-native/tests/native-platform-workflow.test.mjs

          python3 <<'PY'
          from pathlib import Path

          path = Path('packages/runtime-native/tests/native-platform-workflow.test.mjs')
          text = path.read_text()

          start_marker = "test('the protected build context requires scope and workspace evidence, not the native matrix', () => {"
          next_marker = "\ntest('Android V8 source is produced once and consumed as a verified artifact', () => {"
          if text.count(start_marker) != 1:
              raise SystemExit(f"expected exactly one protected-build test, found {text.count(start_marker)}")
          start = text.index(start_marker)
          end = text.index(next_marker, start)
          block = text[start:end]

          old_statuses = "['failure', 'cancelled', 'skipped', '']"
          new_statuses = "['failure', 'cancelled', 'skipped', 'neutral', 'timed_out', '']"
          if block.count(old_statuses) != 1:
              raise SystemExit(f"expected exactly one protected-build status list, found {block.count(old_statuses)}")
          block = block.replace(old_statuses, new_statuses, 1)

          closing = "\n});\n"
          if not block.endswith(closing):
              raise SystemExit('protected-build test did not end where expected')
          required_assertion = """  // The native matrix is still required for the exact candidate, just not by this join: the
          // release lane consumes the `native-platforms` rows, so a native failure cannot pass unnoticed.
          const required = ciWorkflow.match(
            /\\n\\x20{2}ci-required:\\n[\\s\\S]*?(?=\\n\\x20{2}[a-z0-9-]+:|\\s*$)/u,
          )?.[0] ?? '';
          expect(required).toContain('native-platforms');
          """
          block = block[:-len(closing)] + "\n" + required_assertion + "});\n"

          desktop_guard = """
          test('the desktop parity job keeps the name the release gate requires', () => {
            // The release gate matches CI job names exactly. When this job lost its `name:` the run
            // reported `native-platforms / desktop-parity`, so PRD-078's main route could never resolve
            // its `native-platforms / Desktop web/native parity` row.
            const job = workflow.match(
              /\\n\\x20{2}desktop-parity:\\n[\\s\\S]*?(?=\\n\\x20{2}[a-z0-9-]+:|\\s*$)/u,
            )?.[0] ?? '';
            expect(job).toContain('name: Desktop web/native parity');
          });
          """
          if "test('the desktop parity job keeps the name the release gate requires'" in text:
              raise SystemExit('desktop parity guard unexpectedly already present')

          path.write_text(text[:start] + block + desktop_guard + text[end:])
          PY

          git add packages/runtime-native/tests/native-platform-workflow.test.mjs
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          node --check packages/runtime-native/tests/native-platform-workflow.test.mjs
          grep -Fq 'name: Desktop web/native parity' .github/workflows/native-platforms.yml
          grep -Fq "expect(required).toContain('native-platforms');" packages/runtime-native/tests/native-platform-workflow.test.mjs
          grep -Fq "'neutral', 'timed_out'" packages/runtime-native/tests/native-platform-workflow.test.mjs
          grep -Fq 'TN_ANDROID_EXPECTED_PAGE_SIZE' .github/workflows/native-platforms.yml
          grep -Fq 'assertObservedPageSize' packages/runtime-native/tests/native-platform-workflow.test.mjs

          mkdir -p "$RUNNER_TEMP/pr222-resolved"
          cp .github/workflows/native-platforms.yml "$RUNNER_TEMP/pr222-resolved/native-platforms.yml"
          cp packages/runtime-native/tests/native-platform-workflow.test.mjs "$RUNNER_TEMP/pr222-resolved/native-platform-workflow.test.mjs"

          # Upload the verified blobs on an unprotected scratch ref without changing any workflow
          # path. The final two-parent merge commit is created through the authorized GitHub app.
          git merge --abort
          git switch -C tmp/pr222-merge-objects
          mkdir -p .pr222-merge
          cp "$RUNNER_TEMP/pr222-resolved/native-platforms.yml" .pr222-merge/native-platforms.yml
          cp "$RUNNER_TEMP/pr222-resolved/native-platform-workflow.test.mjs" .pr222-merge/native-platform-workflow.test.mjs
          git add .pr222-merge
          git commit -m "chore: stage verified PR #222 merge objects"
          git push -f origin HEAD:refs/heads/tmp/pr222-merge-objects
