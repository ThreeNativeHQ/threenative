name: Integration native asset fallback
on:
  pull_request:
    paths:
      - 'packages/create-threenative/src/build.ts'
      - 'packages/create-threenative/src/buildReport.ts'
      - 'packages/create-threenative/__tests__/vq-native-*.spec.ts'
      - 'packages/assets/src/**'
      - 'packages/core/src/assets.ts'
      - 'packages/runtime-native/scripts/bundle.mjs'
      - 'packages/runtime-native/scripts/package-desktop.mjs'
      - 'packages/runtime-native/scripts/native-build.mjs'
      - 'packages/runtime-native/scripts/download-deps.mjs'
      - 'examples/abyss-framework/vq-assets/**'
      - 'examples/abyss-framework/playtests/vq-native-asset-capabilities.playtest.json'
      - 'scripts/verify-native-asset-capabilities.ts'
      - 'scripts/native-asset-capture-proof.ts'
      - 'scripts/__tests__/native-asset-capture-proof.spec.ts'
      - '.github/workflows/integration-native-assets.yml'
permissions:
  contents: read
concurrency:
  group: integration-native-assets-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  packaged-quickjs:
    # Match native-platforms starter-linux: this architecture selects QuickJS/wgpu without
    # changing any runtime default. Native dependencies use the repository's locked provisioner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TN_PLAYTEST_ALLOW_SOFTWARE: '1'
      TN_PLAYTEST_NATIVE_SCREENSHOT_TIMEOUT_MS: '30000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Build this commit's JavaScript packages
        uses: ./.github/actions/workspace-dist
        with:
          save-bundles: 'false'
          pack-archives: 'false'
      - name: Validate real compressed-source normalization and capture guards
        run: >-
          pnpm exec vitest run --maxWorkers=1
          packages/create-threenative/__tests__/vq-native-asset-capabilities.spec.ts
          packages/create-threenative/__tests__/vq-native-fixture.spec.ts
          scripts/__tests__/native-asset-capture-proof.spec.ts
      - name: Restore checksum-provisioned native dependencies
        uses: actions/cache/restore@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Install the existing native lane's system prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb zlib1g-dev
      - name: Build the same QuickJS host the normal ARM desktop lane ships
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Build the real fixture and capture its packaged native executable
        env:
          THREENATIVE_RUNTIME_BINARY: ${{ github.workspace }}/packages/runtime-native/build/tn-linux/mystral
        run: node --import tsx scripts/verify-native-asset-capabilities.ts
      - name: Retain raw native captures, artifact identities and decoded payload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vq01-native-assets-${{ github.event.pull_request.head.sha }}
          path: artifacts/vq01-native-assets/
          retention-days: 30
          if-no-files-found: warn
