name: PR 278 CI corrections
on:
  push:
    branches: [fix/native-perf-followups-clean]
    paths: [.github/workflows/pr-278-ci-corrections.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install native coverage dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools zlib1g-dev
      - name: Fix optional report assertions and regenerate native coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = 32ae22a3b2b0fb8c5c698f01b7ae294a2137cc25
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/playtest/__tests__/desktop-playtest.spec.ts')
          text = path.read_text()
          old = '''    expect(report.observations.performanceSeries?.length ?? 0).toBeGreaterThan(0);\n    const performance = report.assertionResults.find(({ id }) => id === "performance.minFps");\n'''
          new = '''    expect(report.observations?.performanceSeries?.length ?? 0).toBeGreaterThan(0);\n    const performance = (report.assertionResults ?? []).find(({ id }) => id === "performance.minFps");\n'''
          if text.count(old) != 1:
              raise SystemExit(f'desktop-playtest optional-field anchor changed: {text.count(old)} matches')
          path.write_text(text.replace(old, new, 1))
          PY
          # The coverage builder configures the real host and needs the same vendored source tree as
          # native:build. The first correction attempt proved system packages alone are insufficient.
          node packages/runtime-native/scripts/download-deps.mjs
          pnpm --filter @threenative/runtime-native native:coverage
          changed="$(git diff --name-only | sort)"
          expected=$'docs/verification/native-coverage-2026-08-28.md\npackages/playtest/__tests__/desktop-playtest.spec.ts'
          test "$changed" = "$expected" || { echo "unexpected generated changes:"; printf '%s\n' "$changed"; exit 1; }
          git diff --check
      - uses: ./.github/actions/workspace-dist
        with:
          pack-archives: "false"
      - name: Verify typecheck and budget gates
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm budgets
      - name: Commit only verified corrections and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/native-perf-followups-clean | cut -f1)" = "$GITHUB_SHA"
          git add packages/playtest/__tests__/desktop-playtest.spec.ts docs/verification/native-coverage-2026-08-28.md
          git rm .github/workflows/pr-278-ci-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(native): refresh coverage after async decode changes' -m 'Narrow optional desktop playtest report assertions for the existing report type, regenerate committed native coverage evidence for the changed C++ sources, and prove full typecheck plus budget gates on the corrected tree.'
          git push origin HEAD:refs/heads/fix/native-perf-followups-clean
