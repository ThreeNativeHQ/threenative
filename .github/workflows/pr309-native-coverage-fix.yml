name: PR309 native coverage regeneration
on:
  push:
    branches: [perf/prd-447-distributable-size]
    paths: [.github/workflows/pr309-native-coverage-fix.yml]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @threenative/runtime-native native:coverage
      - run: pnpm budgets
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr309-native-coverage-report
          path: docs/verification/native-coverage-2026-08-28.md
          retention-days: 3
