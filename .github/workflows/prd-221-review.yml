name: PRD-221 reviewed merge objects
# Temporary branch-only merge verification; removed from the final tree. Never pushes a ref.
on:
  push:
    branches: [codex/prd-221-android-v8-16kb]
    paths: [.github/workflows/prd-221-review.yml]
permissions:
  contents: write
jobs:
  merge-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 128
      - name: Reproduce the tested merge without pushing a branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/prd-221-android-v8-16kb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=128 origin 2950765d4cf892f1a910e5ff91fa0ce037417c19
          if ! git merge --no-commit --no-ff 2950765d4cf892f1a910e5ff91fa0ce037417c19; then
            test "$(git diff --name-only --diff-filter=U)" = "$(printf '%s\n' docs/benchmark/SCREENSHOT-RETENTION.md docs/verification/native-coverage-2026-08-28.md)"
          fi
          git checkout 2950765d4cf892f1a910e5ff91fa0ce037417c19 -- docs/verification/native-coverage-2026-08-28.md
          git checkout HEAD -- docs/benchmark/SCREENSHOT-RETENTION.md
          cat > "$RUNNER_TEMP/resolution.patch" <<'PATCH'
          diff --git a/docs/benchmark/SCREENSHOT-RETENTION.md b/docs/benchmark/SCREENSHOT-RETENTION.md
          index 4e3efdf..21bb4de 100644
          --- a/docs/benchmark/SCREENSHOT-RETENTION.md
          +++ b/docs/benchmark/SCREENSHOT-RETENTION.md
          @@ -14,9 +14,9 @@ An artifact the scanner cannot read or place fails the gate rather than defaulti
           | Tree | Tracked files | Bytes | Uncited |
           |---|---:|---:|---:|
           | `docs/benchmark` | 1583 | 109397932 | 0 |
          -| `docs/verification` | 822 | 66568580 | 72 |
          +| `docs/verification` | 824 | 66581297 | 73 |
           
          -**72 artifact(s) are uncited.** Deletion is decided by citation and runs only in PRD-323's owner-checkpointed phases; nothing here removes anything.
          +**73 artifact(s) are uncited.** Deletion is decided by citation and runs only in PRD-323's owner-checkpointed phases; nothing here removes anything.
           
           ## `docs/benchmark` archive directories
           
          @@ -76,7 +76,7 @@ An artifact the scanner cannot read or place fails the gate rather than defaulti
           | `docs/verification/prd-196-readiness-phase-1-2026-09-09.md` | 3095 |
           | `docs/verification/prd-219-menu-flow-merged-tree-2026-08-27.md` | 3525 |
           | `docs/verification/prd-221-2026-08-25.md` | 4928 |
          -| `docs/verification/prd-221-readiness-phase-1-2026-09-10.md` | 8247 |
          +| `docs/verification/prd-221-readiness-phase-1-2026-09-10.md` | 14725 |
           | `docs/verification/prd-243-starter-pixel-after-2026-08-30.png` | 171532 |
           | `docs/verification/prd-354-manifest-import-closure-2026-09-07.md` | 16852 |
           | `docs/verification/prd-359-task2b-send-2026-09-05.md` | 11167 |
          @@ -86,4 +86,4 @@ An artifact the scanner cannot read or place fails the gate rather than defaulti
           | `docs/verification/prd-360-device-2026-09-07/evaluation-b.json` | 2930 |
           | `docs/verification/prd-360-device-2026-09-07/evaluation-c.json` | 2932 |
           | `docs/verification/prd-360-device-2026-09-07/qualified-a.json` | 2898 |
          -| …and 22 more | |
          +| …and 23 more | |
          diff --git a/docs/verification/prd-221-readiness-phase-1-2026-09-10.md b/docs/verification/prd-221-readiness-phase-1-2026-09-10.md
          index 9058e34..785ed3b 100644
          --- a/docs/verification/prd-221-readiness-phase-1-2026-09-10.md
          +++ b/docs/verification/prd-221-readiness-phase-1-2026-09-10.md
          @@ -14,6 +14,12 @@ checks against candidate `190bbe31a0e034aca903a36bac8b84a0d00c6fa5` in
           The review integrates main `4fa8e773609a69fa3077be462e45f893c928324e`; the MCP test conflict
           keeps main's per-operation timeout behavior instead of the older blanket timeout.
           
          +Main advanced during review to `2950765d4cf892f1a910e5ff91fa0ce037417c19`. The final
          +consolidation also integrates that commit: its wgpu pipeline-cache provisioning stays intact,
          +its newer native coverage measurement is retained without restamping, and the screenshot
          +retention index is regenerated from the combined tree. The temporary delta-export workflow
          +is removed; #167 remains the sole resume point.
          +
           ### Review fixes and controls
           
           The engine/native-dependency layer owns these fixes. Four new tests execute the actual
          PATCH
          git apply --check --index "$RUNNER_TEMP/resolution.patch"
          git apply --index "$RUNNER_TEMP/resolution.patch"
          git rm .github/workflows/prd-221-review.yml
          test "$(git write-tree)" = c6d3b6877ff4efda90967d3565aa55de8b8196a8
          git diff --cached --check 2950765d4cf892f1a910e5ff91fa0ce037417c19
          node --check packages/runtime-native/scripts/download-deps.mjs
      - name: Store only the three locally verified merge-result blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          expected = {
            'packages/runtime-native/scripts/download-deps.mjs': '347cfe00bcb69993ffd8cdaafc1cc8b276a97ee3',
            'docs/benchmark/SCREENSHOT-RETENTION.md': '21bb4dea8b47118a671c13a1ee56df2dee8cfcb6',
            'docs/verification/prd-221-readiness-phase-1-2026-09-10.md': '785ed3b924bd24f205136fc779dd796280833bd9',
          }
          for path, sha in expected.items():
            assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha
            payload = json.dumps({'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode(), 'encoding': 'base64'})
            result = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/ThreeNativeHQ/threenative/git/blobs', '--input', '-'], input=payload, text=True))
            assert result['sha'] == sha
            print(path, sha)
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prd221-merge'
          target.mkdir()
          (target / 'verified-blobs.json').write_text(json.dumps(expected, indent=2) + '\n')
          (target / 'tree.txt').write_text(subprocess.check_output(['git', 'write-tree'], text=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: prd221-reviewed-merge-objects
          path: ${{ runner.temp }}/prd221-merge
          if-no-files-found: error
          retention-days: 2
