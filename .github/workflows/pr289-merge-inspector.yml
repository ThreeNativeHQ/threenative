name: PR 289 merge inspector

on:
  push:
    branches:
      - perf/prd-400-ac1
    paths:
      - .github/workflows/pr289-merge-inspector.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inspect merge against develop
        shell: bash
        run: |
          set +e
          git config user.name "ThreeNative PR Watch"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin develop
          git merge --no-commit --no-ff origin/develop
          rc=$?
          echo "merge_rc=$rc"
          echo "=== unresolved paths ==="
          git diff --name-only --diff-filter=U
          echo "=== conflict marker context ==="
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "--- $f ---"
            grep -n -C 14 -E '^(<<<<<<<|=======|>>>>>>>)' -- "$f" || true
          done < <(git diff --name-only --diff-filter=U)
          echo "=== status ==="
          git status --short
          exit 0
