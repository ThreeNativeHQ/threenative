name: Temporary PR repair diagnostics
on:
  push:
    branches: [plan/threejs-csg-cook]
    paths: [.github/workflows/pr-repair-diagnostics.yml]
permissions:
  contents: read
concurrency:
  group: temporary-pr-repair-diagnostics
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: csg
            ref: 3ed147769bbae23f087557615e5ee2fe13f63da6
          - name: ik
            ref: 38fbddc8feed8bb760202de8b72adf987e9e4050
          - name: vegetation
            ref: a49b06eba90f821d6217188c24e0ae84af5fb892
          - name: skinning
            ref: 87e1f37c348553024e3cd5b3d8de8cd4bdbaaaf7
          - name: perception
            ref: a899a82ea304b6eacdd074ff2318233fc09feaa0
          - name: vrm
            ref: 4d70e2d528ea1f57d137132629f33a339fe82a75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact formatter and example dependencies
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/repair-tools" --ignore-scripts --no-audit --no-fund @biomejs/biome@1.9.4
          npm install --prefix "examples/integrations/${{ matrix.name }}" --ignore-scripts --no-audit --no-fund
      - name: Test unchanged source and collect formatter repair
        shell: bash
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/repair-${{ matrix.name }}"
          mkdir -p "$out" || exit 1
          git rev-parse HEAD > "$out/head.txt" || exit 1
          npm --prefix "examples/integrations/${{ matrix.name }}" test > "$out/test.log" 2>&1
          test_status=$?
          cat "$out/test.log"
          printf '%s\n' "$test_status" > "$out/test-exit.txt"
          "$RUNNER_TEMP/repair-tools/node_modules/.bin/biome" check --write --diagnostic-level=error "examples/integrations/${{ matrix.name }}" > "$out/biome.log" 2>&1
          biome_status=$?
          cat "$out/biome.log"
          printf '%s\n' "$biome_status" > "$out/biome-exit.txt"
          git diff --binary -- "examples/integrations/${{ matrix.name }}" > "$out/repair.patch" || exit 1
          tar -czf "$out/repro.tgz" biome.json AGENTS.md docs/PRDs/AGENTS.md docs/PRDs/threejs-integrations "examples/integrations/${{ matrix.name }}" || exit 1
          if [ '${{ matrix.name }}' = csg ]; then
            tar -czf "$out/formatter.tgz" -C "$RUNNER_TEMP/repair-tools" node_modules package-lock.json || exit 1
          fi
          # A repaired worktree is not a passing original candidate.
          test "$test_status" -eq 0 && test "$biome_status" -eq 0 && git diff --exit-code -- "examples/integrations/${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-repair-${{ matrix.name }}
          path: ${{ runner.temp }}/repair-${{ matrix.name }}/
          retention-days: 1
          if-no-files-found: error
