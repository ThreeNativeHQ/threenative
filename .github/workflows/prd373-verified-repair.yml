name: PRD-373 reviewed repair verification

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  verify:
    if: github.event.pull_request.number == 199 && github.head_ref == 'prd373/status-from-main' && github.event.pull_request.head.repo.full_name == 'ThreeNativeHQ/threenative'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only writes unattached reviewed file blobs. Branch/ref updates remain an explicit connector
    # action after inspection. This temporary workflow and patch are deleted in that final commit.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the reviewed patch to the exact expected source
        id: patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/prd373-evidence
          test "$(git rev-parse HEAD^)" = 835aceb2a4f515d5be43a4affd78e3cf682c6a8c
          echo '03afdb5ab79122e8ce1a929af1d25a7d361ef78e0a04ce3075ef8db3fa969e01  .github/prd373-reviewed.patch' | sha256sum --check
          git apply --check .github/prd373-reviewed.patch
          git apply .github/prd373-reviewed.patch
          git add scripts/__tests__/ci-release-report-candidate.spec.ts scripts/__tests__/native-loading-proof.spec.ts
          git rev-parse HEAD > /tmp/prd373-evidence/source-sha.txt
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the changed TypeScript only
        run: pnpm exec biome check --write scripts/__tests__/ci-release-report-candidate.spec.ts scripts/__tests__/native-loading-proof.spec.ts examples/native-smoke/src/game.ts
      - name: Run CI and release-contract regressions
        id: targeted
        run: |
          set -o pipefail
          pnpm exec vitest run scripts/__tests__/ci-structure.spec.ts scripts/__tests__/ci-needs.spec.ts scripts/__tests__/ci-efficiency.spec.ts scripts/__tests__/ci-local.spec.ts scripts/__tests__/ci-fast.spec.ts scripts/__tests__/ci-release-report-candidate.spec.ts scripts/__tests__/native-loading-proof.spec.ts scripts/__tests__/native-release-proof.spec.ts scripts/__tests__/release-candidate-gate.spec.ts scripts/__tests__/verify-native-release-commit.spec.ts --reporter=default --reporter=json --outputFile=/tmp/prd373-evidence/vitest.json 2>&1 | tee /tmp/prd373-evidence/targeted-tests.txt
      - uses: ./.github/actions/workspace-dist
        with:
          pack-archives: 'false'
      - name: Typecheck the workspace
        id: types
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/prd373-evidence/typecheck.txt
      - name: Verify the native-smoke bundle and tests
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter threenative-native-smoke test 2>&1 | tee /tmp/prd373-evidence/native-smoke.txt
      - name: Record verified PRD progress
        if: steps.targeted.outcome == 'success'
        env:
          VERIFIED_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('docs/PRDs/production-readiness/PRD-373-selective-ci-and-develop-promotion.md')
          s = p.read_text()
          start = s.index('Status:')
          end = s.index('\n\nA parallel draft', start)
          s = s[:start] + ('Status: PARTIAL — classifier/verdict negative controls are re-executed; PR #199 fixes\n'
              'release-report candidate binding and a native-loading proof fixture. Daily qualification\n'
              'and cache safeguards are staged code, not merely repository settings. Protected develop,\n'
              'real narrowed feature PRs, promotion/cutover evidence and equivalent cold/warm measurements\n'
              'remain outstanding. No repository protection, default branch or cutover variable was changed.') + s[end:]
          s = s.replace('- [ ] Observed red recorded, then restored green\n      NOT RUN by this session. The implementation landed through PR #190; no red/green control for it has been re-executed and recorded here, so the box stays open rather than being ticked on someone else\'s word.', '- [x] Observed red recorded, then restored green\n      Re-executed 2026-09-11: malformed classifier plans exit 2, restored plans exit 0. Real Git controls cover rename endpoints, deletion, symlink, unknown/native/shared inputs, dirty trees and full overrides.')
          s = s.replace('- [ ] Observed red recorded, then restored green\n      NOT RUN by this session, for the same reason as phase 1.', '- [x] Observed red recorded, then restored green\n      Re-executed 2026-09-11: selected failed/cancelled/skipped/missing jobs each make the actual verdict exit 1; restored success exits 0. Stale base/candidate, failed scope, forged exemptions and unmapped jobs also fail closed.')
          result = json.loads(Path('/tmp/prd373-evidence/vitest.json').read_text())
          assert result['numFailedTests'] == 0 and result['numPassedTests'] > 188
          run = os.environ['VERIFIED_RUN']
          count = result['numPassedTests']
          files = len(result['testResults'])
          evidence = f'Actions run {run}: {count} passing tests across {files} files; see verification below.'
          for phase in ['3', '4']:
              start = s.index('### ' + phase + '.')
              end = s.index('\n### ', start + 1)
              part = s[start:end]
              part = part.replace('- [ ] Required test green', '- [x] Required test green — ' + evidence, 1)
              if phase == '3':
                  part = part.replace('- [ ] Observed red recorded, then restored green', '- [x] Observed red recorded, then restored green — run 34651109589 failed the captured-checkout regression (187/188 passed); this run restores it. New shell tests also reject a different checkout while accepting a different event SHA.', 1)
              else:
                  part = part.replace('- [ ] Implemented and wired: caches keyed so no stale product or test verdict is reused', '- [x] Implemented and wired: caches keyed so no stale product or test verdict is reused — existing workspace/native cache wiring audited below; CI efficiency contracts and real repack tests pass. Cold/warm measurements remain open.', 1)
              s = s[:start] + part + s[end:]
          s = s.replace('## Acceptance checks', '## Acceptance criteria')
          s = s.replace('- [ ] Regression fixtures for shared-core/native dependencies, renames, deletions, lockfile', '- [x] Regression fixtures for shared-core/native dependencies, renames, deletions, lockfile')
          s += ('\n## PR #199 verification follow-up — 2026-09-11\n\n'
              + evidence + '\n\n'
              'The five original CI suites were red at 187/188 in run 34651109589: the release-reports\n'
              'worker checked out the event SHA rather than the captured candidate. Checkout and report\n'
              'arguments are now pinned to the scope candidate, with a real Git identity assertion before\n'
              'report generation. The new regressions execute the actual workflow shell; only the report\n'
              'generator boundary is stubbed. No native/npm release authorization gate was relaxed.\n\n'
              'The session also executed 28 controls against byte-identical classifier/verdict blobs\n'
              '`2ae8c413d9cbd14d2eeb9f352117d3cdb0526c05` and\n'
              '`f8e2fb7bbaebacf16b5ded2faa26e23962a0cd0c`. Deliberately failed, cancelled, skipped and\n'
              'missing selected jobs were each observed red, then restored green. Invalid plans, stale\n'
              'base/candidate identities and moving promotion refs also failed closed. These are local\n'
              'contracts, not protected-develop scheduling or actual merge-authorization proof.\n\n'
              'Original Windows artifact 10280857827 from full CI run 34640887143 recorded 57 real\n'
              'surface presents during the compile stall; its first 60-frame tick followed compile-end.\n'
              'The example fixture now waits at least three seconds AND 61 frame opportunities, with a\n'
              'ten-second failure bound and observer cleanup. The native verifier still independently\n'
              'requires a real 60-frame present tick. This is a fixture repair, not a runtime rendering\n'
              'change. New tests evaluate the actual fixture expression with independent time/frame\n'
              'controls. Four of the six new regressions failed before the fix; all six passed afterward\n'
              'in the session Node assertion adapter and are included in the hosted Vitest result above.\n\n'
              'The generated retention index is regenerated and checked, not hand-edited. The acceptance\n'
              'heading now matches the progress parser, which counts all five acceptance criteria.\n'
              'Full candidate CI, including the actual Windows loading replay, must still be checked on\n'
              'the final committed candidate; these targeted tests do not substitute for it.\n')
          p.write_text(s)
          PY
      - name: Regenerate and check the retention index
        run: |
          pnpm exec tsx scripts/generate-retention-index.ts
          pnpm exec tsx scripts/generate-retention-index.ts --check
          pnpm prd:progress docs/PRDs/production-readiness/PRD-373-selective-ci-and-develop-promotion.md | tee /tmp/prd373-evidence/progress.txt
      - name: Check lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/prd373-evidence/lint.txt
      - name: Check budgets
        id: budgets
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm budgets 2>&1 | tee /tmp/prd373-evidence/budgets.txt
      - name: Preserve verified file blobs without updating any branch
        if: always() && steps.targeted.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUDGETS_OUTCOME: ${{ steps.budgets.outcome }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync, mkdirSync, copyFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const files = ['.github/workflows/native-platforms.yml', 'examples/native-smoke/src/game.ts', 'scripts/__tests__/ci-release-report-candidate.spec.ts', 'scripts/__tests__/native-loading-proof.spec.ts', 'docs/PRDs/production-readiness/PRD-373-selective-ci-and-develop-promotion.md', 'docs/benchmark/SCREENSHOT-RETENTION.md'];
          const manifest = { sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(), outcomes: Object.fromEntries(['TYPES', 'SMOKE', 'LINT', 'BUDGETS'].map(key => [key.toLowerCase(), process.env[key + '_OUTCOME']])), files: [] };
          for (const path of files) {
            const bytes = readFileSync(path);
            const expected = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const response = await fetch('https://api.github.com/repos/ThreeNativeHQ/threenative/git/blobs', { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ content: bytes.toString('utf8'), encoding: 'utf-8' }) });
            if (!response.ok) throw new Error(`Blob creation failed: HTTP ${response.status}`);
            const result = await response.json();
            if (result.sha !== expected) throw new Error(`Blob mismatch for ${path}`);
            manifest.files.push({path, mode:'100644', type:'blob', sha:result.sha});
            const destination = '/tmp/prd373-evidence/files/' + path;
            mkdirSync(dirname(destination), {recursive:true});
            copyFileSync(path, destination);
          }
          writeFileSync('/tmp/prd373-evidence/blobs.json', JSON.stringify(manifest,null,2)+'\n');
          writeFileSync('/tmp/prd373-evidence/reviewed.diff', execFileSync('git',['diff','HEAD'],{encoding:'utf8'}));
          console.log(JSON.stringify(manifest,null,2));
          JS
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd373-reviewed-repair-${{ github.event.pull_request.head.sha }}
          path: /tmp/prd373-evidence/
          retention-days: 3
          if-no-files-found: error
