# The npm release lane runs on a `v*` tag push only. A publish is irreversible — a version can be
# deprecated but never recalled — so this must not be reachable from an ordinary commit.
#
# `pnpm publish`, never `npm publish`: the workspace declares dependencies as `catalog:` and
# `workspace:*`, and only pnpm rewrites those to resolved versions on pack. A raw `npm publish`
# ships manifests that fail to install on every machine that is not this one.
name: npm release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack every package and run the preflight without publishing
        type: boolean
        default: true

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # check-publish-state counts commits to a package's source since its published
          # version went up, which a shallow clone cannot see.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # CI already ran the generic gates on this exact tree. Query that immutable result instead of
      # rebuilding the workspace and running the same typecheck, lint and unit suite a second time.
      # A manual dry run remains useful before a commit reaches main, so only a publishing run
      # requires the completed push result.
      - name: Require a green CI run for this commit
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json status,conclusion,event,headBranch --jq '[.[] | select(.status == "completed" and .conclusion == "success" and .event == "push" and .headBranch == "main")] | length')"
          test "$successful_runs" -gt 0 || {
            echo "No completed successful CI push run on main found for $GITHUB_SHA." >&2
            exit 1
          }
      - name: Refuse a stale or incomplete publish set
        # The release is the only caller allowed to admit exact pins for packages published in this
        # coordinated set. Ordinary `pnpm publish:check` remains fail-closed for those pins.
        run: pnpm publish:check --allow-current-publish-set-pins
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Prepare the exact candidate cohort without publishing
        run: pnpm release --prepare --skip-gates

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install native desktop runtime dependencies for the guarded verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Install the pinned Blender used by the registry verifier
        env:
          BLENDER_VERSION: 5.2.0
        run: |
          archive="${RUNNER_TEMP}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          checksums="${RUNNER_TEMP}/blender-${BLENDER_VERSION}.sha256"
          install_root="${RUNNER_TEMP}/blender-${BLENDER_VERSION}-linux-x64"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output "$archive"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}.sha256" \
            --output "$checksums"
          test -s "$archive"
          (
            cd "$RUNNER_TEMP"
            sha256sum --ignore-missing --check "$(basename "$checksums")"
          )
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          blender="${install_root}/blender"
          test -x "$blender"
          actual_version="$("$blender" --version | awk 'NR == 1 { print $2 }')"
          test "$actual_version" = "$BLENDER_VERSION" || {
            echo "Expected Blender ${BLENDER_VERSION}, received ${actual_version}." >&2
            exit 1
          }
          echo "THREENATIVE_BLENDER_PATH=${blender}" >> "$GITHUB_ENV"
      # The publish set, named one package per line so `pnpm publish:check` can assert that no
      # publishable package is missing from it. A package that exists, is not private, and is
      # absent here would be omitted from the release.
      #
      - name: Require the matching native runtime release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          native_version="$(node -p 'JSON.parse(require("fs").readFileSync("packages/runtime-native/package.json", "utf8")).version')"
          native_tag="runtime-native-v${native_version}"
          release_state="$(gh release view "runtime-native-v${native_version}" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq 'if .isDraft == false and .isPrerelease == false then "ready" else "not-ready" end')"
          if [[ "${release_state}" != "ready" ]]; then
            echo "Matching native runtime release is draft or prerelease; refusing npm publish."
            exit 1
          fi
          # Require the native tag and the candidate SHA to identify the same commit.
          pnpm tsx scripts/verify-native-release-commit.ts "$native_tag"
      # BEGIN GENERATED WORKSPACE PUBLISH SET
      #   @threenative/assets
      #   @threenative/core
      #   @threenative/physics
      #   @threenative/playtest
      #   @threenative/raw-unreal
      #   @threenative/runtime-native
      #   @threenative/ueformat
      #   @threenative/ui
      #   create-threenative
      #   threenative-blender-mcp
      #   threenative-engine-mcp
      # END GENERATED WORKSPACE PUBLISH SET
      - name: Run the single guarded release path
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            pnpm tsx scripts/release.ts --skip-gates
          else
            # The gates job already required the exact commit's successful CI run, including the
            # separately provisioned native contract job. Do not rerun pnpm test here: this runner
            # has no native host executable, and the release's own build/preflight still run below.
            pnpm tsx scripts/release.ts --yes --skip-gates
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  clean-room:
    needs: publish
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install native desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Install the pinned Blender used by the MCP conversion proof
        env:
          BLENDER_VERSION: 5.2.0
        run: |
          archive="${RUNNER_TEMP}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          checksums="${RUNNER_TEMP}/blender-${BLENDER_VERSION}.sha256"
          install_root="${RUNNER_TEMP}/blender-${BLENDER_VERSION}-linux-x64"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output "$archive"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}.sha256" \
            --output "$checksums"
          test -s "$archive"
          (
            cd "$RUNNER_TEMP"
            sha256sum --ignore-missing --check "$(basename "$checksums")"
          )
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          blender="${install_root}/blender"
          test -x "$blender"
          actual_version="$("$blender" --version | awk 'NR == 1 { print $2 }')"
          test "$actual_version" = "$BLENDER_VERSION" || {
            echo "Expected Blender ${BLENDER_VERSION}, received ${actual_version}." >&2
            exit 1
          }
          echo "THREENATIVE_BLENDER_PATH=${blender}" >> "$GITHUB_ENV"
      # Proves the registry path, which no other gate in this repository exercises: the sandbox,
      # the sweeps and verify-golden-path all resolve `file:` tarballs by design.
      - name: Install from the registry in a directory with no workspace above it
        run: pnpm tsx scripts/verify-registry-install.ts
