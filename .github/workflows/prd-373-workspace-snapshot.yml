name: PRD-373 workspace snapshot
on:
  push:
    branches: [work/prd-373-selective-ci]
    paths: [.github/workflows/prd-373-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export source and installed dependencies for offline regression tests
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/source.bundle" --all
          tar --exclude='./.git' --exclude='./.cache' -czf "$RUNNER_TEMP/workspace.tar.gz" .
          split -b 200M "$RUNNER_TEMP/workspace.tar.gz" "$RUNNER_TEMP/workspace.part-"
          pnpm_root="$(dirname "$(dirname "$(readlink -f "$(command -v pnpm)")")")"
          tar -czf "$RUNNER_TEMP/pnpm.tar.gz" -C "$pnpm_root" .
          ls -lh "$RUNNER_TEMP"/workspace.part-* "$RUNNER_TEMP/source.bundle" "$RUNNER_TEMP/pnpm.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: prd-373-source
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/pnpm.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: prd-373-workspace-aa
          path: ${{ runner.temp }}/workspace.part-aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: prd-373-workspace-ab
          path: ${{ runner.temp }}/workspace.part-ab
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: prd-373-workspace-ac
          path: ${{ runner.temp }}/workspace.part-ac
          retention-days: 1
          compression-level: 0
