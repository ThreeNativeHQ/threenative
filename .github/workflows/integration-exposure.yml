name: Integration exposure
on:
  pull_request:
    paths:
      - 'packages/create-threenative/template-assets/autoExposure.ts'
      - 'packages/create-threenative/template-assets/exposure.ts'
      - 'packages/create-threenative/__tests__/auto-exposure*.spec.ts'
      - 'packages/create-threenative/__tests__/fixtures/auto-exposure/**'
      - '.github/workflows/integration-exposure.yml'
  push:
    branches: ['feat/prd-339-auto-exposure']
permissions:
  contents: read
concurrency:
  group: integration-exposure-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
        with:
          pack-archives: 'false'
          save-bundles: 'false'
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm exec vitest run --maxWorkers=1 packages/create-threenative/__tests__/auto-exposure.spec.ts packages/create-threenative/__tests__/auto-exposure-node.spec.ts
      - name: Capture the real exposure graph
        run: node --import tsx packages/create-threenative/__tests__/fixtures/auto-exposure/verify.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd339-exposure-${{ github.sha }}
          path: artifacts/prd339-exposure
          if-no-files-found: error
