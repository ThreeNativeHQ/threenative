name: Build owned quiche dependency

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - packages/runtime-native/scripts/build-quiche-owned.py
      - packages/runtime-native/scripts/test-build-quiche-owned.py
      - packages/runtime-native/scripts/validate-quiche-release.py
      - packages/runtime-native/scripts/test-validate-quiche-release.py
      - packages/runtime-native/scripts/test-quiche-workflow.py
      - packages/runtime-native/patches/quiche-*.patch
      - .gitattributes
      - .github/workflows/build-quiche-owned.yml
  push:
    tags:
      - quiche-owned-v1
    branches:
      - main
    paths:
      - packages/runtime-native/scripts/build-quiche-owned.py
      - packages/runtime-native/scripts/test-build-quiche-owned.py
      - packages/runtime-native/scripts/validate-quiche-release.py
      - packages/runtime-native/scripts/test-validate-quiche-release.py
      - packages/runtime-native/scripts/test-quiche-workflow.py
      - packages/runtime-native/patches/quiche-*.patch
      - .gitattributes
      - .github/workflows/build-quiche-owned.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: win-x64
            os: windows-2022
          - target: mac-arm64
            os: macos-15
            sdk: macosx
          - target: mac-x86_64
            os: macos-13
            sdk: macosx
          - target: android-arm64
            os: ubuntu-24.04
          - target: android-armv7
            os: ubuntu-24.04
          - target: android-x64
            os: ubuntu-24.04
          - target: ios-arm64
            os: macos-15
            sdk: iphoneos
          - target: ios-sim-x64
            os: macos-15
            sdk: iphonesimulator
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out engine
        uses: actions/checkout@v7
        with:
          path: engine
      - name: Check out pinned quiche upstream
        uses: actions/checkout@v7
        with:
          repository: cloudflare/quiche
          ref: 020a43a0a5eed76f57dd3ce5012149aa576c594d
          submodules: recursive
          path: quiche-upstream
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned CMake and workflow test dependency
        run: python -m pip install "cmake==4.4.2" "PyYAML==6.0.3"
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Set up Go 1.26.3
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
      # Windows MSVC: VsDevCmd -arch=x64 -host_arch=x64 puts cl/link/lib
      # on PATH and exports INCLUDE+LIB; producer refuses /MD* and /MTd.
      - name: Set up MSVC dev shell via VsDevCmd (win-x64)
        if: matrix.target == 'win-x64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          host_arch: x64
          vsversion: "2022"
      # macOS/iOS Xcode: xcrun --sdk <macosx|iphoneos|iphonesimulator>
      # resolves clang/ar/ranlib; producer exports CC/AR/SDKROOT and
      # IPHONEOS_DEPLOYMENT_TARGET=14.0. Cross-target ip_san is
      # compile+package evidence only (skipped, never passed).
      - name: Select Xcode (macOS/iOS)
        if: startsWith(matrix.target, 'mac-') || startsWith(matrix.target, 'ios-')
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Probe Apple SDKs (macOS/iOS)
        if: startsWith(matrix.target, 'mac-') || startsWith(matrix.target, 'ios-')
        env:
          APPLE_SDK: ${{ matrix.sdk }}
        run: |
          test -n "$APPLE_SDK"
          xcrun --sdk "$APPLE_SDK" --show-sdk-path
          xcrun --sdk "$APPLE_SDK" -f clang
          xcrun --sdk "$APPLE_SDK" -f ar
      # Android NDK r27 pin 27.1.12297006, API 21. Producer reads
      # ANDROID_NDK_HOME, binds CC_<triple>/CARGO_TARGET_<TRIPLE>_LINKER,
      # CMAKE_ANDROID_NDK and CMAKE_ANDROID_ARCH_ABI.
      - name: Set up Android NDK r27 (android-*)
        if: startsWith(matrix.target, 'android-')
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          # nttld/setup-ndk consumes the Android release archive name;
          # the builder verifies its exact Pkg.Revision below.
          ndk-version: r27b
          add-to-path: false
      - name: Probe NDK drivers (android-*)
        if: startsWith(matrix.target, 'android-')
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          test -f "$ANDROID_NDK_HOME/source.properties"
          grep "Pkg.Revision = 27.1.12297006" "$ANDROID_NDK_HOME/source.properties"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt"/*/bin/aarch64-linux-android21-clang
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt"/*/bin/armv7a-linux-androideabi21-clang
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt"/*/bin/x86_64-linux-android21-clang
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt"/*/bin/llvm-ar
      - name: Validate release tag before build
        run: >-
          python3 engine/packages/runtime-native/scripts/build-quiche-owned.py
          --check-release-tag quiche-owned-v1
      - name: Run builder self-tests
        run: python3 engine/packages/runtime-native/scripts/test-build-quiche-owned.py
      - name: Run release-gate tests
        run: python3 engine/packages/runtime-native/scripts/test-validate-quiche-release.py
      - name: Run workflow-shape tests
        run: python3 engine/packages/runtime-native/scripts/test-quiche-workflow.py
      - name: Build owned ${{ matrix.target }} archive (ip_san inside)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/quiche-target
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: >-
          python3 engine/packages/runtime-native/scripts/build-quiche-owned.py
          ${{ matrix.target }}
          --source-dir quiche-upstream
          --patch-dir engine/packages/runtime-native/patches
          --out dist-quiche/${{ matrix.target }}
          --release-tag quiche-owned-v1 -j 4
      - uses: actions/upload-artifact@v4
        with:
          name: quiche-owned-${{ matrix.target }}
          path: |
            dist-quiche/${{ matrix.target }}/quiche-0.24.6-tn1-${{ matrix.target }}.zip
            dist-quiche/${{ matrix.target }}/manifest-${{ matrix.target }}.json
          if-no-files-found: error

  publish:
    # Fail-closed 9-target gate: exact tag only; validator requires ALL 9
    # targets. Partial CI exits 1 naming the missing targets.
    if: github.ref == 'refs/tags/quiche-owned-v1'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: engine
      - uses: actions/download-artifact@v4
        with:
          pattern: quiche-owned-*
          path: dist-quiche
      - name: Validate release tag before publish
        run: >-
          python3 engine/packages/runtime-native/scripts/build-quiche-owned.py
          --check-release-tag "${GITHUB_REF_NAME}"
      - name: Fail closed until all 9 targets verify
        run: >-
          python3 engine/packages/runtime-native/scripts/validate-quiche-release.py
          --dist dist-quiche --tag "${GITHUB_REF_NAME}"
          --builder engine/packages/runtime-native/scripts/build-quiche-owned.py
          --emit validated-assets.txt
      - name: Publish immutable dependency release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ASSETS < validated-assets.txt
          test "${#ASSETS[@]}" -eq 18
          for f in "${ASSETS[@]}"; do test -s "$f"; done
          gh release create "${{ github.ref_name }}" "${ASSETS[@]}" \
            --repo "${{ github.repository }}" \
            --verify-tag --title "Owned quiche ${{ github.ref_name }}" \
            --generate-notes
