name: Native coverage regeneration (temporary)

on:
  push:
    branches:
      - fix/dev-release

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop build dependencies and LLVM coverage tools
        run: >-
          sudo apt-get update && sudo apt-get install -y llvm
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools zlib1g-dev
      - name: Ensure native dependencies are present
        run: node packages/runtime-native/scripts/download-deps.mjs
      - name: Regenerate committed native coverage evidence
        run: pnpm --filter @threenative/runtime-native native:coverage
      - name: Upload regenerated coverage record
        uses: actions/upload-artifact@v7
        with:
          name: native-coverage-regenerated
          path: docs/verification/native-coverage-2026-08-28.md
          if-no-files-found: error
