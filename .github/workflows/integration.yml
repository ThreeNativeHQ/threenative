  fluid-collision-native:
    name: Linux native fluid correctness
    if: ${{ needs.paths.outputs.fluid-native == 'true' && !github.event.pull_request.draft }}
    needs: paths
    # Established native-platforms ARM QuickJS/wgpu route; no default backend change.
    runs-on: ubuntu-24.04-arm
