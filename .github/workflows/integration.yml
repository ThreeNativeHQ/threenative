name: Integration lanes

# One workflow, one job per feature. A per-feature workflow file means a per-feature set of
# triggers, permissions, concurrency groups and review surface, none of which any of these lanes
# needs of its own: each job below keeps its own paths gate, its own draft guard, its own runner and
# its own artifact names, so what a pull request runs is unchanged.
on:
  pull_request:
    # `ready_for_review` is what makes the draft guards below safe: without it the workflow never
    # fires on the event that un-skips a job, and the lanes go quiet instead of cheap.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# `pull_request` alone, never `pull_request` plus `push`: one commit pushed to a branch reaches both
# triggers, so the pair ran the identical proof twice for the same tree. A per-branch `push` filter is
# the other shape that outlives its pull request — `integration-decals` carried
# `fix/vq11-decal-material-lifetime` for a merged pull request #394 and kept a 30-minute lane alive
# for as long as the branch existed.
#
# The supersession `integration-csg` and `integration-decals` declared, kept once for the set: a newer
# commit on the pull request's head cancels the integration run it replaces.
concurrency:
  group: integration-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # The per-lane trigger filters these lane files used to carry, as one gate: the pull request's own
  # changed paths decide which lanes run, and a lane this commit does not touch is skipped rather than
  # spending a runner. Lane-local workflow edits select that lane; shared scheduling edits
  # fail closed to every lane. Source filters remain independent of workflow-only selection.
  paths:
    name: lanes this pull request touches
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER_LIGHT) && 'ubuntu-24.04' || vars.TN_RUNNER_LIGHT }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      animation: ${{ steps.filter.outputs.animation }}
      exposure: ${{ steps.filter.outputs.exposure }}
      cold-boot: ${{ steps.filter.outputs.cold-boot }}
      csg: ${{ steps.filter.outputs.csg }}
      decals: ${{ steps.filter.outputs.decals }}
      fog: ${{ steps.filter.outputs.fog }}
      fluid-particles: ${{ steps.filter.outputs.fluid-particles }}
      fluid-native: ${{ steps.filter.outputs.fluid-native }}
      ik: ${{ steps.filter.outputs.ik }}
      native-assets: ${{ steps.filter.outputs.native-assets }}
      tone: ${{ steps.filter.outputs.tone }}
      vegetation: ${{ steps.filter.outputs.vegetation }}
      world-capture: ${{ steps.filter.outputs.world-capture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: filter
        env:
          TN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Exact source filters; workflow-only changes compare each job and filter separately.
          TN_LANE_FILTERS: |
            animation ^packages/core/src/animation\.ts$|^packages/core/__tests__/animation[^/]*\.spec\.ts$|^examples/abyss-framework/src/render/animation-reversal[^/]*\.ts$|^examples/abyss-framework/src/animation-reversal-main\.ts$|^examples/abyss-framework/animation-reversal\.html$|^examples/abyss-framework/playtests/animation-reversal\.playtest\.json$|^scripts/verify-animation-reversal\.ts$|^packages/core/__tests__/vq-locomotion-blend-spaces\.spec\.ts$|^examples/abyss-framework/src/render/locomotion-[^/]*\.ts$|^examples/abyss-framework/src/render/vq-locomotion-[^/]*\.ts$|^examples/abyss-framework/src/vq-locomotion-main\.ts$|^examples/abyss-framework/playtests/vq-locomotion-blend-spaces\.playtest\.json$|^examples/abyss-framework/assets/mannequin\.glb$|^scripts/verify-vq-locomotion\.ts$
            cold-boot ^packages/create-threenative/(template-assets|templates/[^/]+/src/render)/(autoExposure|exposure|exposureGraph|exposureReadback|worldEnvironment)\.ts$|^packages/create-threenative/__tests__/auto-exposure[^/]*\.spec\.ts$|^packages/create-threenative/__tests__/fixtures/auto-exposure/.*$|^packages/core/src/.*$|^packages/core/patches/.*$|^packages/playtest/.*$|^packages/runtime-native/.*$|^pnpm-lock\.yaml$|^scripts/xvfb\.sh$|^\.github/actions/(workspace-dist|pnpm|playwright-chromium)/.*$
            exposure ^packages/create-threenative/(template-assets|templates/[^/]+/src/render)/(autoExposure|exposure|exposureGraph|exposureReadback|worldEnvironment)\.ts$|^packages/create-threenative/__tests__/auto-exposure[^/]*\.spec\.ts$|^packages/create-threenative/__tests__/fixtures/auto-exposure/.*$|^packages/core/src/.*$|^packages/core/patches/.*$|^packages/playtest/.*$|^packages/runtime-native/.*$|^pnpm-lock\.yaml$|^scripts/xvfb\.sh$|^\.github/actions/(workspace-dist|pnpm|playwright-chromium)/.*$
            csg ^examples/integrations/csg/.*$
            decals ^packages/playtest/.*$|^packages/create-threenative/templates/shooter/src/render/decals\.ts$|^packages/create-threenative/templates/shooter/src/scenes/Play\.ts$|^packages/create-threenative/__tests__/shooter-decals[^/]*\.spec\.ts$|^packages/create-threenative/__tests__/fixtures/bounded-decals/.*$|^packages/runtime-native/.*$|^scripts/xvfb\.sh$|^\.github/actions/workspace-dist/.*$|^\.github/actions/pnpm/.*$|^\.github/actions/playwright-chromium/.*$|^pnpm-lock\.yaml$
            fluid-particles ^packages/core/(src|__tests__)/(fluid|gpu-readback|particles)[^/]*$|^packages/(physics|playtest)/.*$|^examples/prd476-fluid-particles/.*$|^scripts/fluid-collision-proof\.ts$|^scripts/__tests__/fluid-collision-(proof|view)\.spec\.ts$|^package\.json$|^pnpm-(lock|workspace)\.yaml$|^tsconfig[^/]*\.json$|^patches/.*$|^\.github/actions/pnpm/.*$|^scripts/workspace-packages\.ts$|^scripts/verify-fluid-(collision|consumers)\.ts$|^\.github/actions/playwright-chromium/.*$|^scripts/xvfb\.sh$|^scripts/observe-fluid-ci\.mjs$|^scripts/__tests__/observe-fluid-ci\.spec\.ts$
            fluid-native ^packages/core/(src|__tests__)/(fluid|gpu-readback|particles)[^/]*$|^packages/(physics|playtest)/.*$|^examples/prd476-fluid-particles/.*$|^scripts/fluid-collision-proof\.ts$|^scripts/__tests__/fluid-collision-(proof|view)\.spec\.ts$|^package\.json$|^pnpm-(lock|workspace)\.yaml$|^tsconfig[^/]*\.json$|^patches/.*$|^\.github/actions/pnpm/.*$|^scripts/workspace-packages\.ts$|^packages/runtime-native/.*$|^scripts/verify-fluid-collision-native\.ts$|^scripts/__tests__/fluid-collision-native-proof\.spec\.ts$|^\.github/actions/workspace-dist/.*$
            fog ^packages/create-threenative/templates/starter/src/render/volumetricFog[A-Za-z]*\.ts$|^packages/create-threenative/templates/starter/src/render/postprocessing\.ts$|^packages/create-threenative/templates/starter/src/scenes/Play\.ts$|^packages/create-threenative/template-assets/worldEnvironment\.ts$|^packages/create-threenative/__tests__/vq-(volumetric-fog|fog-fixture)\.spec\.ts$|^packages/core/src/renderer\.ts$|^packages/core/src/render/chain\.ts$|^examples/abyss-framework/vq-fog/.*$|^examples/abyss-framework/playtests/vq-volumetric-fog\.playtest\.json$|^scripts/verify-volumetric-fog\.ts$|^scripts/__tests__/(verify-volumetric-fog|vq-fog-native-proof)\.spec\.ts$|^packages/runtime-native/include/mystral/webgpu_compat\.h$|^packages/runtime-native/src/webgpu/bindings_presentation\.cpp$|^packages/runtime-native/tests/surface_texture_status_test\.cpp$|^packages/runtime-native/tests/canvas_presentation_test\.cpp$
            ik ^examples/integrations/ik/.*$
            native-assets ^packages/create-threenative/src/build\.ts$|^packages/create-threenative/src/buildReport\.ts$|^packages/create-threenative/__tests__/vq-native-[^/]*\.spec\.ts$|^packages/assets/src/(compile|report)\.ts$|^packages/core/src/assets\.ts$|^packages/runtime-native/scripts/bundle\.mjs$|^packages/runtime-native/scripts/package-desktop\.mjs$|^packages/runtime-native/scripts/native-build\.mjs$|^packages/runtime-native/scripts/download-deps\.mjs$|^examples/abyss-framework/vq-assets/.*$|^examples/abyss-framework/playtests/vq-native-asset-capabilities\.playtest\.json$|^scripts/verify-native-asset-capabilities\.ts$|^scripts/native-asset-capture-proof\.ts$|^scripts/__tests__/native-asset-capture-proof\.spec\.ts$
            tone ^scripts/xvfb\.sh$|^packages/playtest/.*$|^examples/abyss-framework/src/render/toneCalibration\.ts$|^examples/abyss-framework/src/tone-main\.ts$|^examples/abyss-framework/tone\.html$|^examples/abyss-framework/tone\.vite\.config\.ts$|^examples/abyss-framework/playtests/tone\.playtest\.json$|^examples/abyss-framework/package\.json$|^scripts/verify-tone-exposure\.ts$|^scripts/tone-capture-proof\.ts$|^scripts/__tests__/tone-capture-proof\.spec\.ts$|^scripts/non-visual-scenarios\.mjs$|^package\.json$|^pnpm-lock\.yaml$|^\.github/actions/pnpm/.*$|^\.github/actions/playwright-chromium/.*$|^packages/create-threenative/(template-assets|templates/[^/]+/src/render)/(autoExposure|exposure|exposureGraph|exposureReadback|exposureSettings|worldEnvironment)\.ts$
            vegetation ^examples/integrations/vegetation/.*$
            world-capture ^packages/core/src/world[^/]*\.ts$|^packages/core/__tests__/world-capture-fixture\.spec\.ts$|^packages/playtest/.*$|^packages/assets/.*$|^examples/abyss-framework/src/scenes/WorldProbe\.ts$|^examples/abyss-framework/src/world-main\.ts$|^examples/abyss-framework/src/style\.css$|^examples/abyss-framework/assets/world/.*$|^examples/abyss-framework/index\.html$|^examples/abyss-framework/vite\.config\.ts$|^examples/abyss-framework/threenative\.config\.ts$|^examples/abyss-framework/playtests/phase477-world-capture\.playtest\.json$|^examples/abyss-framework/package\.json$|^scripts/verify-world-capture\.ts$|^scripts/world-capture-manifest\.ts$|^scripts/world-visual-gate\.ts$|^scripts/capture-guard\.ts$|^scripts/__tests__/verify-world-capture\.spec\.ts$|^scripts/__tests__/world-capture-manifest\.spec\.ts$|^scripts/__tests__/world-visual-gate\.spec\.ts$|^package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^\.github/actions/pnpm/.*$|^\.github/actions/playwright-chromium/.*$
        run: node scripts/ci-integration-scope.mjs

  csg:
    name: csg
    if: ${{ needs.paths.outputs.csg == 'true' && !github.event.pull_request.draft }}
    needs: paths
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/integrations/csg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - id: build
        run: npm run build
      - run: npm run test:contracts
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:integration

  ik:
    name: ik
    if: ${{ needs.paths.outputs.ik == 'true' && !github.event.pull_request.draft }}
    needs: paths
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/integrations/ik
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  vegetation:
    name: vegetation
    if: ${{ needs.paths.outputs.vegetation == 'true' && !github.event.pull_request.draft }}
    needs: paths
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/integrations/vegetation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  decals:
    name: decals
    if: ${{ needs.paths.outputs.decals == 'true' && !github.event.pull_request.draft }}
    needs: paths
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
        with:
          pack-archives: 'false'
          save-bundles: 'false'
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm exec vitest run --maxWorkers=1 packages/create-threenative/__tests__/shooter-decals-projection.spec.ts packages/create-threenative/__tests__/shooter-decals-fixture.spec.ts packages/create-threenative/__tests__/shooter-decals-lifetime.spec.ts packages/create-threenative/__tests__/template-runtime-cost.spec.ts
      - name: Capture actual receiver projection, motion, removal and restart
        run: node --import tsx packages/create-threenative/__tests__/fixtures/bounded-decals/verify.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vq11-decals-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/vq11-decals
          if-no-files-found: error

  decals-native:
    name: Linux native decal correctness
    needs: [decals]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TN_PLAYTEST_ALLOW_SOFTWARE: '1'
      TN_PLAYTEST_NATIVE_SCREENSHOT_TIMEOUT_MS: '30000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Build this source's public JavaScript packages
        uses: ./.github/actions/workspace-dist
        with:
          save-bundles: 'false'
          pack-archives: 'false'
      - name: Verify native preflight and capture rejection controls
        run: pnpm exec vitest run packages/create-threenative/__tests__/shooter-decals-native.spec.ts --maxWorkers=1
      - name: Restore checksum-provisioned native dependencies
        uses: actions/cache/restore@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Install the existing native lane's system prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb zlib1g-dev
      - name: Build the ordinary ARM desktop host
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Run the same packaged decal scenarios and unchanged pixel gates
        env:
          THREENATIVE_RUNTIME_BINARY: ${{ github.workspace }}/packages/runtime-native/build/tn-linux/mystral
        run: node --import tsx packages/create-threenative/__tests__/fixtures/bounded-decals/verify-native.ts
      - name: Retain native screenshots, host console and executable identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vq11-decals-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/vq11-decals-native/
            !artifacts/vq11-decals-native/variants/**
          retention-days: 30
          if-no-files-found: warn

  tone:
    name: exposure
    if: ${{ needs.paths.outputs.tone == 'true' && !github.event.pull_request.draft }}
    needs: paths
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - name: Build this commit's standalone bridge and runner
        run: pnpm --filter @threenative/playtest build
      - name: Validate histogram and fail-closed assertion paths
        run: pnpm exec vitest run --maxWorkers=1 packages/playtest/__tests__/capture.spec.ts packages/playtest/__tests__/tone.spec.ts packages/playtest/__tests__/tone-runner.spec.ts scripts/__tests__/tone-capture-proof.spec.ts
      - name: Render underexposed and restored scene through the real runner
        run: pnpm test:tone
      - name: Retain runtime screenshots and exact adapter evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tone-exposure-${{ github.event.pull_request.head.sha }}
          path: artifacts/tone-exposure
          if-no-files-found: error

  animation:
    name: animation
    if: ${{ needs.paths.outputs.animation == 'true' && !github.event.pull_request.draft }}
    needs: paths
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
        with:
          pack-archives: 'false'
          save-bundles: 'false'
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm exec vitest run --maxWorkers=1 packages/core/__tests__/animation.spec.ts packages/core/__tests__/animation-reversal-fixture.spec.ts packages/core/__tests__/animation-weighted.spec.ts packages/core/__tests__/vq-locomotion-blend-spaces.spec.ts
      - name: Capture real mannequin gait reversals on headed WebGPU
        run: node --import tsx scripts/verify-animation-reversal.ts
      - name: Capture the two-rig locomotion blend spaces on headed WebGPU
        run: node --import tsx scripts/verify-vq-locomotion.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vq04-animation-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/vq04-animation
          if-no-files-found: error

  fog:
    name: fog capture
    if: ${{ needs.paths.outputs.fog == 'true' && !github.event.pull_request.draft }}
    needs: paths
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm --filter @threenative/playtest build
      - run: pnpm --filter abyss-framework exec vite build --config vq-fog/vite.config.ts
      - run: node --import tsx scripts/verify-volumetric-fog.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: volumetric-fog-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/volumetric-fog/
          retention-days: 30
          if-no-files-found: error

  fog-native:
    name: Linux native fog correctness
    needs: [fog]
    # Reuse the proven native-platforms / native-assets ARM QuickJS route without changing defaults.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TN_PLAYTEST_ALLOW_SOFTWARE: '1'
      TN_PLAYTEST_NATIVE_SCREENSHOT_TIMEOUT_MS: '30000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Build this source's public JavaScript packages
        uses: ./.github/actions/workspace-dist
        with:
          save-bundles: 'false'
          pack-archives: 'false'
      - name: Verify native preflight and capture rejection controls
        run: pnpm exec vitest run scripts/__tests__/vq-fog-native-proof.spec.ts --maxWorkers=1
      - name: Restore checksum-provisioned native dependencies
        uses: actions/cache/restore@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Install the existing native lane's system prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb zlib1g-dev
      - name: Build the ordinary ARM desktop host
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Verify the compiled surface acquisition status contract
        run: |
          cmake --build packages/runtime-native/build/tn-linux --target threenative-surface-texture-status-test --parallel 2
          packages/runtime-native/build/tn-linux/threenative-surface-texture-status-test
      - name: Verify rendered presentation destination pixels
        run: |
          cmake --build packages/runtime-native/build/tn-linux --target threenative-canvas-presentation-test --parallel 2
          packages/runtime-native/build/tn-linux/threenative-canvas-presentation-test
      - name: Isolate native resize with no fog allocation
        id: resize-control
        # Preserve the original fog sequence even when this diagnostic reproduces the abort.
        # The final step below still fails the job if this control fails.
        continue-on-error: true
        env:
          VQ_FOG_RESIZE_CONTROL: '1'
          THREENATIVE_RUNTIME_BINARY: ${{ github.workspace }}/packages/runtime-native/build/tn-linux/mystral
        run: node --import tsx scripts/verify-volumetric-fog.ts
      - name: Run the same authored fog and pixel gates on the native host
        env:
          THREENATIVE_RUNTIME_BINARY: ${{ github.workspace }}/packages/runtime-native/build/tn-linux/mystral
        run: node --import tsx scripts/verify-volumetric-fog.ts
      - name: Require the no-fog resize control
        if: always() && steps.resize-control.outcome != 'success'
        run: exit 1
      - name: Retain native screenshots, host console and executable identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: volumetric-fog-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/volumetric-fog-native/
            artifacts/volumetric-fog-native-resize-control/
          retention-days: 30
          if-no-files-found: warn

  capture:
