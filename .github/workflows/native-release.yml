name: Native runtime release

on:
  push:
    tags:
      - "runtime-native-v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Match the tag to the runtime package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("packages/runtime-native/package.json", "utf8"));
          const expected = `runtime-native-v${manifest.version}`;
          if (process.env.RELEASE_TAG !== expected) {
            throw new Error(`Expected tag ${expected}, received ${process.env.RELEASE_TAG}.`);
          }
          NODE

  gates:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # `gh run list` infers the repository from the checkout, and this job has none, so it died
      # on `failed to determine base repo: fatal: not a git repository` before it could ask the
      # question. The gate has therefore never once evaluated: this workflow runs only on a
      # `runtime-native-v*` tag, and no such tag had ever been pushed. Pass the repository
      # explicitly rather than adding a checkout the job otherwise does not need.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json status,conclusion,event,headBranch --jq '[.[] | select(.status == "completed" and .conclusion == "success" and .event == "push" and .headBranch == "main")] | length')"
          test "$successful_runs" -gt 0 || {
            echo "No completed successful CI push run on main found for $GITHUB_SHA." >&2
            exit 1
          }

  build:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            runner: ubuntu-24.04
            preset: tn-linux
            executable: mystral
            asset: threenative-runtime-linux-x64
          - key: darwin-arm64
            runner: macos-15
            preset: tn-macos
            executable: mystral
            asset: threenative-runtime-darwin-arm64
          - key: win32-x64
            runner: windows-2025
            preset: tn-windows
            executable: mystral.exe
            asset: threenative-runtime-win32-x64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Build native-smoke workspace dependencies
        shell: bash
        run: |
          while IFS=$'\t' read -r package_name _; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
          done < <(pnpm tsx scripts/workspace-packages.ts --archives)
      - run: pnpm --filter threenative-native-smoke build
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev
          libvulkan1 mesa-vulkan-drivers vulkan-tools zlib1g-dev
      - name: Install Windows HTTP build dependencies
        if: runner.os == 'Windows'
        run: >-
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install
          "curl:x64-windows-static" "zlib:x64-windows-static"
      - name: Build native runtime with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "CC=cl"
          set "CXX=cl"
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          where cl
          pnpm --filter @threenative/runtime-native native:build
      - if: runner.os != 'Windows'
        run: pnpm --filter @threenative/runtime-native native:build
      # `VsDevCmd.bat` configures the process it runs in, and a `cmd` step's environment dies with
      # the step. So this ran without INCLUDE, LIB or a usable `cl`, and the first thing inside it
      # that *configures* a build directory — the physics contract lane — got "the C compiler is
      # not able to compile a simple test program". The runtime itself had already built fine one
      # step earlier, which is why it looked like a code failure rather than a missing environment.
      #
      # Enter the developer environment here too, rather than exporting it through GITHUB_ENV: that
      # would put a Windows-style PATH in front of every later step, including the bash ones.
      - name: Verify the desktop runtime with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "CC=cl"
          set "CXX=cl"
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          pnpm --filter @threenative/runtime-native native:verify:desktop
      - if: runner.os != 'Windows'
        run: pnpm --filter @threenative/runtime-native native:verify:desktop
      - name: Stage the verified runtime
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset }}
          EXECUTABLE_NAME: ${{ matrix.executable }}
          PRESET: ${{ matrix.preset }}
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, mkdirSync, statSync } from "node:fs";
          import { join } from "node:path";
          const source = join("packages", "runtime-native", "build", process.env.PRESET, process.env.EXECUTABLE_NAME);
          const output = join("release", process.env.ASSET_NAME);
          mkdirSync("release", { recursive: true });
          copyFileSync(source, output);
          if (statSync(output).size === 0) throw new Error(`${output} is empty.`);
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.key }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-desktop-${{ matrix.key }}
          path: packages/runtime-native/artifacts/
          if-no-files-found: error

  build-android:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: pnpm install --frozen-lockfile
      - name: Build Android proof workspace dependencies
        run: |
          while IFS=$'\t' read -r package_name _; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
          done < <(pnpm tsx scripts/workspace-packages.ts --archives)
      - run: node packages/runtime-native/scripts/download-deps.mjs --android
      - run: node packages/runtime-native/scripts/download-deps.mjs --only stb
      - run: node packages/runtime-native/scripts/download-deps.mjs --only quickjs
      - run: node packages/runtime-native/scripts/build-android-physics-proof.mjs
      # Both engines are published, because the prebuilt path can select either and a release that
      # ships only one makes the other unreachable to anyone without an NDK. QuickJS first, then V8
      # last so the V8 outputs are the ones left in the build directory.
      - name: Build both Android release ABIs (QuickJS)
        working-directory: packages/runtime-native/android
        run: sh ./gradlew assembleRelease -PthreenativeJsEngine=quickjs -x buildAndroidFirstProofBundle --no-daemon
      - name: Stage the QuickJS Android runtimes
        run: |
          mkdir -p release
          cp packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/arm64-v8a/libmystral-runtime.so release/threenative-runtime-android-arm64-v8a.so
          cp packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/x86_64/libmystral-runtime.so release/threenative-runtime-android-x86_64.so
      - name: Build both Android release ABIs (V8, the default)
        working-directory: packages/runtime-native/android
        run: sh ./gradlew assembleRelease -x buildAndroidFirstProofBundle --no-daemon
      - name: Stage Android runtime payloads
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, mkdirSync, statSync } from "node:fs";
          const assets = {
            "packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/arm64-v8a/libmystral-runtime.so": "release/threenative-runtime-android-arm64-v8a-v8.so",
            "packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/arm64-v8a/libv8android.so": "release/threenative-v8-android-arm64-v8a.so",
            "packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/arm64-v8a/libc++_shared.so": "release/threenative-libcxx-android-arm64-v8a.so",
            "packages/runtime-native/android/app/build/generated/threenative/assets/v8/arm64-v8a/snapshot_blob.bin": "release/threenative-v8-snapshot-android-arm64-v8a.bin",
            "packages/runtime-native/android/app/build/generated/threenative/assets/v8/x86_64/snapshot_blob.bin": "release/threenative-v8-snapshot-android-x86_64.bin",
            "packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/x86_64/libv8android.so": "release/threenative-v8-android-x86_64.so",
            "packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/x86_64/libc++_shared.so": "release/threenative-libcxx-android-x86_64.so",
            "packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/arm64-v8a/libSDL3.so": "release/threenative-sdl3-android-arm64-v8a.so",
            "packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/x86_64/libmystral-runtime.so": "release/threenative-runtime-android-x86_64-v8.so",
            "packages/runtime-native/android/app/build/intermediates/stripped_native_libs/release/out/lib/x86_64/libSDL3.so": "release/threenative-sdl3-android-x86_64.so",
            "packages/runtime-native/third_party/sdl3-android/SDL3-3.2.8.aar": "release/threenative-sdl3-android.aar",
          };
          mkdirSync("release", { recursive: true });
          for (const [source, output] of Object.entries(assets)) {
            copyFileSync(source, output);
            if (statSync(output).size === 0) throw new Error(`${output} is empty.`);
          }
          NODE
          nm -D release/threenative-runtime-android-arm64-v8a.so | grep -F 'tn_physics_step'
          nm -D release/threenative-runtime-android-x86_64.so | grep -F 'tn_physics_step'
          nm -D release/threenative-runtime-android-arm64-v8a-v8.so | grep -F 'tn_physics_step'
          # The engine each runtime links is asserted, not assumed: the two binaries are otherwise
          # indistinguishable by name, and shipping one under the other's key would produce a
          # prebuilt build whose logcat reports the wrong engine.
          #
          # DT_NEEDED, not a symbol grep. V8's symbols are mangled (`_ZN2v8...`), so a literal
          # 'v8::' matches nothing and the assertion would pass vacuously on both binaries.
          readelf -d release/threenative-runtime-android-arm64-v8a-v8.so | grep -F 'NEEDED' | grep -F 'libv8android.so'
          readelf -d release/threenative-runtime-android-x86_64-v8.so | grep -F 'NEEDED' | grep -F 'libv8android.so'
          for quickjs in release/threenative-runtime-android-arm64-v8a.so release/threenative-runtime-android-x86_64.so; do
            if readelf -d "$quickjs" | grep -F 'NEEDED' | grep -qF 'libv8android.so'; then
              echo "$quickjs links V8; the engine-qualified artifacts are crossed." >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-android
          path: release/*
          if-no-files-found: error

  build-ios-simulator:
    needs: gates
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build iOS proof workspace dependencies
        run: |
          while IFS=$'\t' read -r package_name _; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
          done < <(pnpm tsx scripts/workspace-packages.ts --archives)
      - run: rustup target add aarch64-apple-ios-sim
      - run: node packages/runtime-native/scripts/verify-ios-simulator.mjs
      - name: Stage the scenario-verified unsigned simulator host
        run: |
          app=$(find packages/runtime-native/build/tn-ios-simulator -name threenative-ios.app -type d -print -quit)
          test -n "$app"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            release/threenative-ios-simulator-arm64.zip
          test -s release/threenative-ios-simulator-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-ios-simulator-arm64
          path: release/threenative-ios-simulator-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-ios-simulator-arm64
          path: packages/runtime-native/artifacts/ios/
          if-no-files-found: error

  publish:
    needs: [build, build-android, build-ios-simulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: release
          merge-multiple: true
      - name: Generate the checksum lock from the verified assets
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { PREBUILT_KEYS, RELEASE_REPOSITORY } from "./packages/runtime-native/scripts/install-prebuilt.mjs";
          if (process.env.RELEASE_REPOSITORY !== RELEASE_REPOSITORY) {
            throw new Error(`Prebuilt releases must be published by ${RELEASE_REPOSITORY}, received ${process.env.RELEASE_REPOSITORY}.`);
          }
          const names = {
            "android-arm64-v8a-runtime": "threenative-runtime-android-arm64-v8a.so",
            "android-arm64-v8a-runtime-v8": "threenative-runtime-android-arm64-v8a-v8.so",
            "android-arm64-v8a-sdl3": "threenative-sdl3-android-arm64-v8a.so",
            "android-arm64-v8a-v8": "threenative-v8-android-arm64-v8a.so",
            "android-arm64-v8a-libcxx": "threenative-libcxx-android-arm64-v8a.so",
            "android-arm64-v8a-v8-snapshot": "threenative-v8-snapshot-android-arm64-v8a.bin",
            "android-sdl3-aar": "threenative-sdl3-android.aar",
            "android-x86_64-runtime": "threenative-runtime-android-x86_64.so",
            "android-x86_64-runtime-v8": "threenative-runtime-android-x86_64-v8.so",
            "android-x86_64-sdl3": "threenative-sdl3-android-x86_64.so",
            "android-x86_64-v8": "threenative-v8-android-x86_64.so",
            "android-x86_64-libcxx": "threenative-libcxx-android-x86_64.so",
            "android-x86_64-v8-snapshot": "threenative-v8-snapshot-android-x86_64.bin",
            "darwin-arm64": "threenative-runtime-darwin-arm64",
            "ios-simulator-arm64": "threenative-ios-simulator-arm64.zip",
            "linux-x64": "threenative-runtime-linux-x64",
            "win32-x64": "threenative-runtime-win32-x64.exe",
          };
          const expectedKeys = [...PREBUILT_KEYS].sort();
          const actualKeys = Object.keys(names).sort();
          if (JSON.stringify(actualKeys) !== JSON.stringify(expectedKeys)) {
            throw new Error(`Prebuilt key table drift: expected ${expectedKeys.join(", ")}; received ${actualKeys.join(", ")}.`);
          }
          const expected = Object.values(names).sort();
          const actual = readdirSync("release").sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Expected ${expected.join(", ")}; received ${actual.join(", ")}.`);
          }
          const artifacts = Object.fromEntries(Object.entries(names).map(([key, name]) => [key, {
            sha256: createHash("sha256").update(readFileSync(`release/${name}`)).digest("hex"),
            url: `https://github.com/${process.env.RELEASE_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${name}`,
          }]));
          writeFileSync("release/prebuilt-lock.json", `${JSON.stringify({ artifacts }, null, 2)}\n`);
          NODE
      - name: Publish runtimes and checksum lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release/*
          --repo "${{ github.repository }}"
          --verify-tag
          --title "ThreeNative runtime ${{ github.ref_name }}"
          --prerelease
          --latest=false
          --generate-notes

  clean-consumer:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install a software Vulkan ICD for the clean desktop launch
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - run: pnpm install --frozen-lockfile
      - name: Pack the exact scaffold consumer packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          pnpm tsx scripts/workspace-packages.ts --archives > "$RUNNER_TEMP/threenative-package-specs"
          while IFS=$'\t' read -r package_name archive_prefix; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
            pnpm --filter "$package_name" pack --pack-destination "$RUNNER_TEMP/packages"
          done < "$RUNNER_TEMP/threenative-package-specs"
      - name: Scaffold from local tarballs
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ runner.temp }}/packages
          specs-file: ${{ runner.temp }}/threenative-package-specs
          target: ${{ runner.temp }}/threenative-consumer-proof
          template: minimal
      - name: Prepare the scaffolded consumer proof
        run: |
          target="$RUNNER_TEMP/threenative-consumer-proof"
          CONSUMER_TARGET="$target" node --input-type=module <<'NODE'
          import { copyFileSync } from "node:fs";
          copyFileSync("examples/native-smoke/src/game.ts", `${process.env.CONSUMER_TARGET}/src/game.ts`);
          copyFileSync("examples/native-smoke/vite.config.ts", `${process.env.CONSUMER_TARGET}/vite.config.ts`);
          copyFileSync("packages/physics/__tests__/fixtures/physics-parity.scenario.json", `${process.env.CONSUMER_TARGET}/physics-parity.scenario.json`);
          NODE
          echo "CONSUMER_TARGET=$target" >> "$GITHUB_ENV"
      - name: Expose an Android SDK with no NDK or CMake installation
        run: |
          source_sdk="$ANDROID_HOME"
          clean_sdk="$RUNNER_TEMP/android-sdk-no-native-toolchain"
          mkdir -p "$clean_sdk"
          for directory in build-tools cmdline-tools emulator licenses platform-tools platforms system-images; do
            ln -s "$source_sdk/$directory" "$clean_sdk/$directory"
          done
          test -L "$clean_sdk/emulator"
          test -L "$clean_sdk/system-images"
          test ! -e "$clean_sdk/ndk"
          test ! -e "$clean_sdk/cmake"
          echo "ANDROID_HOME=$clean_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$clean_sdk" >> "$GITHUB_ENV"
      - name: Mask every native toolchain entry point
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain-mask"
          TOOLCHAIN_MASK="$RUNNER_TEMP/toolchain-mask" node --input-type=module <<'NODE'
          import { chmodSync, writeFileSync } from "node:fs";
          const commands = ["cargo", "cc", "clang", "clang++", "cmake", "c++", "g++", "gcc", "ndk-build", "ninja", "rustc", "xcodebuild"];
          for (const command of commands) {
            const path = `${process.env.TOOLCHAIN_MASK}/${command}`;
            writeFileSync(path, '#!/bin/sh\nprintf "%s\\n" "$0 $*" >> "$TN_TOOLCHAIN_LOG"\nexit 97\n');
            chmodSync(path, 0o755);
          }
          NODE
          echo "$RUNNER_TEMP/toolchain-mask" >> "$GITHUB_PATH"
          echo "TN_TOOLCHAIN_LOG=$RUNNER_TEMP/toolchain-invocations.log" >> "$GITHUB_ENV"
      - name: Install and build without a native toolchain
        run: |
          pnpm --dir "$CONSUMER_TARGET" install
          pnpm --dir "$CONSUMER_TARGET" build --target desktop
          test ! -e "$TN_TOOLCHAIN_LOG"
      - name: Launch the packed desktop game for 300 frames
        run: |
          log="$RUNNER_TEMP/threenative-consumer.log"
          screenshot="$RUNNER_TEMP/threenative-consumer.png"
          trap 'status=$?; trap - ERR; cat "$log"; exit "$status"' ERR
          sh scripts/xvfb.sh \
            "$CONSUMER_TARGET/dist-native/threenative-consumer-proof" \
            --screenshot "$screenshot" --frames 300 > "$log" 2>&1
          grep -F 'TN_NATIVE_SMOKE_READY:webgpu' "$log"
          grep -F 'TN_NATIVE_SMOKE_FIRST_FRAME' "$log"
          grep -F 'TN_NATIVE_SMOKE_300_FRAMES:300' "$log"
          grep -E 'Rendered 300 frames in [0-9]+ms' "$log"
          SCREENSHOT="$screenshot" node --input-type=module <<'NODE'
          import { inspectScreenshot } from "./packages/runtime-native/scripts/verify-desktop-core.mjs";
          console.log(inspectScreenshot(process.env.SCREENSHOT));
          NODE
          test ! -e "$TN_TOOLCHAIN_LOG"
          trap - ERR
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Build the packed Android target without NDK, CMake, or Rust
        run: |
          cp examples/native-smoke/src/physics.ts "$CONSUMER_TARGET/src/game.ts"
          cp examples/native-smoke/vite.config.ts "$CONSUMER_TARGET/vite.config.ts"
          cp packages/physics/__tests__/fixtures/physics-parity.scenario.json \
            "$CONSUMER_TARGET/physics-parity.scenario.json"
          pnpm --dir "$CONSUMER_TARGET" build --target android
          apk="$CONSUMER_TARGET/dist-native/threenative-consumer-proof.apk"
          test -s "$apk"
          unzip -l "$apk" > "$RUNNER_TEMP/threenative-consumer-android.txt"
          grep -F 'lib/arm64-v8a/libmystral-runtime.so' "$RUNNER_TEMP/threenative-consumer-android.txt"
          grep -F 'lib/arm64-v8a/libSDL3.so' "$RUNNER_TEMP/threenative-consumer-android.txt"
          grep -F 'lib/x86_64/libmystral-runtime.so' "$RUNNER_TEMP/threenative-consumer-android.txt"
          grep -F 'lib/x86_64/libSDL3.so' "$RUNNER_TEMP/threenative-consumer-android.txt"
          test ! -e "$TN_TOOLCHAIN_LOG"
      - name: Run packed Android physics and negative controls on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r "$CONSUMER_TARGET/dist-native/threenative-consumer-proof.apk"
            node "$CONSUMER_TARGET/node_modules/@threenative/playtest/dist/runner/cli.js" "$GITHUB_WORKSPACE/examples/native-smoke/playtests/physics.playtest.json" --target android --artifacts "$RUNNER_TEMP/packed-android-physics" --timeout 30000
            set +e; node "$CONSUMER_TARGET/node_modules/@threenative/playtest/dist/runner/cli.js" "$GITHUB_WORKSPACE/examples/native-smoke/playtests/physics-wrong-height.playtest.json" --target android --artifacts "$RUNNER_TEMP/packed-android-wrong-height" --timeout 30000 > "$RUNNER_TEMP/android-wrong-height.log" 2>&1; status=$?; set -e; cat "$RUNNER_TEMP/android-wrong-height.log"; test "$status" -eq 1; grep -F TN_PLAYTEST_POSITION_REACH_ASSERTION_FAILED "$RUNNER_TEMP/android-wrong-height.log"
            set +e; node "$CONSUMER_TARGET/node_modules/@threenative/playtest/dist/runner/cli.js" "$GITHUB_WORKSPACE/examples/native-smoke/playtests/physics-mask.playtest.json" --target android --artifacts "$RUNNER_TEMP/packed-android-mask-control" --timeout 30000 > "$RUNNER_TEMP/android-mask-control.log" 2>&1; status=$?; set -e; cat "$RUNNER_TEMP/android-mask-control.log"; test "$status" -eq 1; grep -F TN_PLAYTEST_MOVEMENT_ASSERTION_FAILED "$RUNNER_TEMP/android-mask-control.log"
            THREENATIVE_PHYSICS_CONTROL=masked pnpm --dir "$CONSUMER_TARGET" build --target android
            adb install -r "$CONSUMER_TARGET/dist-native/threenative-consumer-proof.apk"
            node "$CONSUMER_TARGET/node_modules/@threenative/playtest/dist/runner/cli.js" "$GITHUB_WORKSPACE/examples/native-smoke/playtests/physics-mask.playtest.json" --target android --artifacts "$RUNNER_TEMP/packed-android-mask-pass" --timeout 30000
            THREENATIVE_PHYSICS_CONTROL=wrong-gravity pnpm --dir "$CONSUMER_TARGET" build --target android
            adb install -r "$CONSUMER_TARGET/dist-native/threenative-consumer-proof.apk"
            set +e; node "$CONSUMER_TARGET/node_modules/@threenative/playtest/dist/runner/cli.js" "$GITHUB_WORKSPACE/examples/native-smoke/playtests/physics.playtest.json" --target android --artifacts "$RUNNER_TEMP/packed-android-wrong-gravity" --timeout 30000 > "$RUNNER_TEMP/android-wrong-gravity.log" 2>&1; status=$?; set -e; cat "$RUNNER_TEMP/android-wrong-gravity.log"; test "$status" -eq 1; grep -F TN_PLAYTEST_POSITION_REACH_ASSERTION_FAILED "$RUNNER_TEMP/android-wrong-gravity.log"
            test ! -e "$TN_TOOLCHAIN_LOG"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clean-consumer-linux-x64
          path: |
            ${{ runner.temp }}/threenative-consumer.log
            ${{ runner.temp }}/threenative-consumer.png
            ${{ runner.temp }}/threenative-consumer-android.txt
            ${{ runner.temp }}/toolchain-invocations.log
            ${{ runner.temp }}/packed-android-physics/
            ${{ runner.temp }}/packed-android-wrong-height/
            ${{ runner.temp }}/packed-android-mask-control/
            ${{ runner.temp }}/packed-android-mask-pass/
            ${{ runner.temp }}/packed-android-wrong-gravity/
            ${{ runner.temp }}/android-*.log
          if-no-files-found: warn

  clean-consumer-ios:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack the exact iOS consumer packages
        run: |
          mkdir -p "$RUNNER_TEMP/ios-packages"
          pnpm tsx scripts/workspace-packages.ts --archives > "$RUNNER_TEMP/threenative-package-specs"
          while IFS=$'\t' read -r package_name archive_prefix; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
            pnpm --filter "$package_name" pack --pack-destination "$RUNNER_TEMP/ios-packages"
          done < "$RUNNER_TEMP/threenative-package-specs"
      - name: Scaffold the iOS release consumer from local tarballs
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ runner.temp }}/ios-packages
          specs-file: ${{ runner.temp }}/threenative-package-specs
          target: ${{ runner.temp }}/threenative-ios-release-consumer
          template: minimal
      - name: Install the exact iOS consumer packages
        run: |
          target="$RUNNER_TEMP/threenative-ios-release-consumer"
          cp examples/native-smoke/src/game.ts "$target/src/game.ts"
          cp examples/native-smoke/vite.config.ts "$target/vite.config.ts"
          cp packages/physics/__tests__/fixtures/physics-parity.scenario.json \
            "$target/physics-parity.scenario.json"
          pnpm --dir "$target" install --ignore-scripts
          echo "IOS_RELEASE_CONSUMER=$target" >> "$GITHUB_ENV"
      - name: Build the released host without a native compiler
        run: |
          mkdir -p "$RUNNER_TEMP/ios-toolchain-mask"
          for command in cargo cmake ninja rustc xcodebuild; do
            printf '#!/bin/sh\nprintf "%%s\\n" "$0 $*" >> "$TN_IOS_TOOLCHAIN_LOG"\nexit 97\n' \
              > "$RUNNER_TEMP/ios-toolchain-mask/$command"
            chmod +x "$RUNNER_TEMP/ios-toolchain-mask/$command"
          done
          export TN_IOS_TOOLCHAIN_LOG="$RUNNER_TEMP/ios-toolchain-invocations.log"
          export PATH="$RUNNER_TEMP/ios-toolchain-mask:$PATH"
          echo "TN_IOS_TOOLCHAIN_LOG=$TN_IOS_TOOLCHAIN_LOG" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ios-toolchain-mask" >> "$GITHUB_PATH"
          pnpm --dir "$IOS_RELEASE_CONSUMER" build --target ios
          test -d "$IOS_RELEASE_CONSUMER/dist-native/threenative-ios-release-consumer.app"
          test ! -e "$TN_IOS_TOOLCHAIN_LOG"
      - name: Boot a clean-consumer iOS simulator
        run: |
          device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          test -n "$device"
          if ! xcrun simctl list devices booted | grep -F "$device"; then
            xcrun simctl boot "$device"
          fi
          xcrun simctl bootstatus "$device" -b
      - name: Launch packed-consumer pass and wrong-value scenarios
        run: |
          app="$IOS_RELEASE_CONSUMER/dist-native/threenative-ios-release-consumer.app"
          node packages/playtest/dist/runner/cli.js \
            examples/native-smoke/playtests/device-smoke.playtest.json \
            --target ios --app "$app" --bundle-id dev.threenative.runtime \
            --timeout 30000 \
            --artifacts packages/runtime-native/artifacts/ios/release-consumer-pass
          set +e
          node packages/playtest/dist/runner/cli.js \
            examples/native-smoke/playtests/device-smoke-wrong-value.playtest.json \
            --target ios --app "$app" --bundle-id dev.threenative.runtime \
            --timeout 30000 \
            --artifacts packages/runtime-native/artifacts/ios/release-consumer-wrong \
            > "$RUNNER_TEMP/ios-wrong-value.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ios-wrong-value.log"
          test "$status" -eq 1
          grep -F TN_PLAYTEST_VISIBILITY_FAILED "$RUNNER_TEMP/ios-wrong-value.log"
      - name: Run packed-consumer native physics and negative controls
        run: |
          cp examples/native-smoke/src/physics.ts "$IOS_RELEASE_CONSUMER/src/game.ts"
          app="$IOS_RELEASE_CONSUMER/dist-native/threenative-ios-release-consumer.app"
          run_ios() {
            scenario=$1
            artifacts=$2
            node packages/playtest/dist/runner/cli.js "$scenario" \
              --target ios --app "$app" --bundle-id dev.threenative.runtime \
              --timeout 30000 \
              --artifacts "$artifacts"
          }
          expect_ios_failure() {
            scenario=$1
            artifacts=$2
            expected=$3
            log=$4
            set +e
            run_ios "$scenario" "$artifacts" > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            test "$status" -eq 1
            grep -F "$expected" "$log"
          }

          THREENATIVE_PHYSICS_PROOF=enabled THREENATIVE_PHYSICS_CONTROL=normal \
            pnpm --dir "$IOS_RELEASE_CONSUMER" build --target ios
          run_ios examples/native-smoke/playtests/physics.playtest.json \
            packages/runtime-native/artifacts/ios/release-physics-pass
          expect_ios_failure examples/native-smoke/playtests/physics-wrong-height.playtest.json \
            packages/runtime-native/artifacts/ios/release-physics-wrong-height \
            TN_PLAYTEST_POSITION_REACH_ASSERTION_FAILED "$RUNNER_TEMP/ios-physics-wrong-height.log"
          expect_ios_failure examples/native-smoke/playtests/physics-mask.playtest.json \
            packages/runtime-native/artifacts/ios/release-physics-mask-normal \
            TN_PLAYTEST_MOVEMENT_ASSERTION_FAILED "$RUNNER_TEMP/ios-physics-mask-normal.log"

          THREENATIVE_PHYSICS_PROOF=enabled THREENATIVE_PHYSICS_CONTROL=masked \
            pnpm --dir "$IOS_RELEASE_CONSUMER" build --target ios
          run_ios examples/native-smoke/playtests/physics-mask.playtest.json \
            packages/runtime-native/artifacts/ios/release-physics-mask-pass

          THREENATIVE_PHYSICS_PROOF=enabled THREENATIVE_PHYSICS_CONTROL=wrong-gravity \
            pnpm --dir "$IOS_RELEASE_CONSUMER" build --target ios
          expect_ios_failure examples/native-smoke/playtests/physics.playtest.json \
            packages/runtime-native/artifacts/ios/release-physics-wrong-gravity \
            TN_PLAYTEST_POSITION_REACH_ASSERTION_FAILED "$RUNNER_TEMP/ios-physics-wrong-gravity.log"
          test ! -e "$TN_IOS_TOOLCHAIN_LOG"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clean-consumer-ios-simulator-arm64
          path: |
            packages/runtime-native/artifacts/ios/release-consumer-*/
            packages/runtime-native/artifacts/ios/release-physics-*/
            ${{ runner.temp }}/ios-wrong-value.log
            ${{ runner.temp }}/ios-physics-*.log
            ${{ runner.temp }}/ios-toolchain-invocations.log
          if-no-files-found: warn

  finalize:
    needs: [clean-consumer, clean-consumer-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Promote the consumer-verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --prerelease=false
          --latest

  cleanup-failed-release:
    if: >-
      ${{ always() && needs.publish.result == 'success' &&
      (needs.clean-consumer.result != 'success' || needs.clean-consumer-ios.result != 'success') }}
    needs: [publish, clean-consumer, clean-consumer-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Remove a release that failed consumer verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release delete "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --yes
