name: Native platform evidence

# When this lane runs is owned by ci.yml, not by a path filter here.
#
# The filter used to list only packages/runtime-native/**, so a change to core,
# playtest, create-threenative or native-smoke — every package the native app
# actually bundles — could break these targets with nothing reporting it. On
# 2026-08-11 three separate reds on main turned out to be stale for exactly that
# reason. Path filters also fired push and pull_request together, running the
# whole 24-minute matrix twice per PR.
#
# This file is a reusable workflow called by ci.yml, where the `native-platforms` job is a required
# member of the primary board. Manual dispatch remains available for an isolated platform run.
on:
  workflow_dispatch:
    inputs:
      ios_only:
        description: "Run only the iOS simulator and consumer handoff job"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ios_only:
        required: false
        type: boolean
        default: false

concurrency:
  group: native-platforms-${{ github.ref }}
  # Superseded PR runs are dead weight — cancel them. A push to main is not supersession: this
  # lane exists to produce platform evidence, and at this repository's push cadence (~20 minutes)
  # against this lane's runtime (27-45 minutes) cancel-in-progress killed every main run before
  # it finished — 37 of the last 100 cancelled, none of the platform legs ever reported on the
  # branch that claims them. Main runs queue instead; a queued evidence run is late, a cancelled
  # one is absent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: the run-cancel-on-failure step that needed Actions write access is gone — it re-marked
# the failing job itself `cancelled`, which hid which leg went red. See ci.yml.
permissions:
  contents: read

jobs:
  # The native lane shares ci.yml's fail-closed merge-base classifier. Non-PR events are always
  # full, which preserves scheduled, workflow-call and manual platform evidence.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      selection: ${{ steps.classify.outputs.selection }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify the complete pull-request diff
        env:
          TN_CI_EVENT: ${{ github.event_name }}
          TN_CI_BASE: ${{ github.event.pull_request.base.sha }}
          TN_CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/ci-change-scope.mjs \
            --event-name "$TN_CI_EVENT" \
            --base "$TN_CI_BASE" \
            --head "$TN_CI_HEAD" \
            --format github | tee "$RUNNER_TEMP/ci-scope.outputs"
          cat "$RUNNER_TEMP/ci-scope.outputs" >> "$GITHUB_OUTPUT"

  web-reference:
    needs: scope
    name: Commit-keyed web conformance reference
    # Ungated on pull requests with android-emulator-parity, which needs this reference to compare
    # against and would otherwise skip with it. desktop-parity also needs it and stays gated; a
    # skipped dependant does not force this job to run, so the cost here is one browser capture on
    # pull requests that previously ran none. The prose-only scope skip is unrelated and kept.
    if: >-
      needs.scope.outputs.selection != 'prose' &&
      inputs.ios_only == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
      - uses: ./.github/actions/playwright-chromium
      - name: Capture commit-keyed browser reference
        run: |
          set +e
          sh scripts/xvfb.sh node packages/runtime-native/conformance/run-conformance.mjs --target web --out artifacts/conformance/web
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/web "web reference"
      # Uploaded even when the capture step fails, and that changes no verdict: this job still
      # reports its own red, and a consumer whose `needs` failed still skips. What it changes is
      # that the red becomes diagnosable. `report.json` is written before the exit test, so on a
      # failing run the one artifact naming which row failed existed and was thrown away — which is
      # why "web-reference is red" has been readable for three runs on main without anyone being
      # able to say what failed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-web-reference-${{ github.sha }}
          path: packages/runtime-native/artifacts/conformance/web
          if-no-files-found: error

  performance-coverage:
    name: Native collector evidence coverage
    needs: [scope, android-emulator-parity, desktop-parity, desktop, ios-simulator]
    if: ${{ !cancelled() && needs.scope.outputs.selection != 'prose' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        if: always()
        with:
          pattern: native-*
          path: artifacts/native-performance-coverage
      - name: Aggregate retained collector evidence and unscheduled platforms
        if: always()
        env:
          TN_PERF_REQUIRED_DESKTOP: ${{ needs.desktop.result != 'skipped' && 'Windows,macOS' || '' }}
        run: |
          pnpm tsx scripts/performance-regression/ci-summary.ts \
            --artifact-dir artifacts/native-performance-coverage \
            --manifest scripts/performance-regression/lanes.json \
            --coverage desktop-parity,Windows,macOS,android-emulator,ios-simulator \
            --required-lanes "$TN_PERF_REQUIRED_DESKTOP" \
            --expected-sha "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  networking-matrix:
    name: Networking qualification matrix
    needs: [android-emulator-parity, desktop-parity, desktop, ios-simulator]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The aggregator is plain Node with no dependencies, so this job needs no pnpm
      # install and no toolchain setup. Its own suite already runs in CI's test-unit
      # shards; re-running it here would only duplicate that work.
      - uses: actions/download-artifact@v7
        if: always()
        with:
          # Networking lane results only. The platform jobs upload conformance artifacts
          # as native-*, and the aggregator validates every JSON under this path, so that
          # pattern would fail the gate on foreign evidence. Task 7c publishes these.
          pattern: networking-lane-*
          path: artifacts/networking-matrix
          # No lane publishes these yet, so nothing matching is the expected state today.
          # It is not `continue-on-error`: a download that genuinely fails must not be
          # indistinguishable from an empty matrix.
          if-no-files-found: ignore
      # --report-only, and named so, because ordinary CI cannot execute the qualification
      # lanes: this step reports what evidence exists and never claims a platform. The
      # aggregator fails closed without that flag, so the verdict is still the default for
      # every other caller. One lane result is enough to enforce every required row, so a
      # partial set fails here too.
      - name: Report the networking qualification matrix (not a verdict)
        if: always()
        run: |
          mkdir -p artifacts/networking-matrix
          node scripts/verify-networking-matrix.mjs \
            --manifest docs/PRDs/networking/qualification-lanes.json \
            --results artifacts/networking-matrix --report-only 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  android-emulator-parity:
    name: Android emulator visual parity
    needs: [scope, web-reference]
    # Runs on every event since 2026-09-01 (owner call): the earlier narrowing held the expensive
    # platform legs behind pushes to main and a `native` label, and the lane then spent its runs
    # being cancelled by the next push instead of reporting anything. A leg that is skipped on the
    # branch where the work happens is a leg nobody is watching.
    # Ungated on pull requests again, 2026-09-06, and only this leg — desktop-parity keeps the
    # label. The cost note that gated both still stands on its numbers:
    #
    #   desktop-parity            3173s   android-emulator-parity   1858s
    #
    # but its load-bearing clause was "both are red on main today", and that was the reason the
    # evidence did not justify the minutes. This leg was red for a reason that had nothing to do
    # with any pull request's diff: `stb` is fetched fresh from raw.githubusercontent.com on every
    # run, unauthenticated, and returned 429 (run 34078916876), so `Install Android build
    # prerequisites` exited 1 and the emulator never booted. With that fixed and the lane
    # producing a result, "advisory but reporting" is worth 31 runner-minutes; "advisory and
    # always red" was not.
    #
    # desktop-parity is left gated: it is the larger half of the 84 runner-minutes, and nothing
    # here has made it green.
    #
    # This leg is still advisory, not a required check, so it reports without blocking.
    # Restoring the label gate is the same `if` desktop-parity still carries. The prose-only
    # scope skip is unrelated and kept.
    if: >-
      needs.scope.outputs.selection != 'prose' &&
      inputs.ios_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v4
      # The three re-downloads this lane paid for on every run. Measured on run 33675488456:
      # ~6 min of SDK/emulator installation and ~5 min of the Gradle build plus the Rust
      # cross-compile, against a 35 min job. `third_party` was already cached and hit in ~4 s;
      # these were simply never added. Keys are content-addressed where a lockfile exists and
      # pinned to the versions this workflow installs where one does not, so a version bump
      # misses rather than serving a stale toolchain.
      # This leg was the only compiling native job without it — desktop-parity, desktop and
      # starter-linux all restore the same path under the same key. Its absence is why the lane
      # re-fetched every Android dependency on every run, including stb's three single headers from
      # raw.githubusercontent.com, which returned 429 on run 34078916876 and took the whole lane
      # down before the emulator booted. On a warm cache `download-deps.mjs` finds the headers
      # already present and skips the fetch entirely, so the failure mode cannot recur; the retry
      # added alongside this covers the cold-cache run that still has to reach the network.
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Restore the Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-35
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0
            ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
            ${{ env.ANDROID_SDK_ROOT }}/system-images/android-35
            ${{ env.ANDROID_SDK_ROOT }}/emulator
          key: android-sdk-35-ndk27.1.12297006-${{ runner.os }}
      - name: Restore the Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            gradle-${{ runner.os }}-${{ hashFiles(
              'packages/runtime-native/android/**/*.gradle*',
              'packages/runtime-native/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Restore the Rust cross-compile caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/runtime-native/.runtime/physics-target
          key: >-
            cargo-android-${{ runner.os }}-${{ hashFiles(
              'packages/runtime-native/native/physics/Cargo.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Build browser reference workspace imports
        run: pnpm tsx scripts/workspace-packages.ts build
      - uses: ./.github/actions/playwright-chromium
      - name: Capture browser references from the commit-keyed artifact
        uses: actions/download-artifact@v7
        with:
          name: native-web-reference-${{ github.sha }}
          path: packages/runtime-native/artifacts/conformance/web
      - name: Verify the downloaded browser reference
        run: |
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/web "downloaded web reference"
      - name: Install Android build prerequisites
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
          # build-native-physics.mjs cross-compiles the Rust physics crate for both ABIs
          # Gradle packages. Without these targets `:app:buildNativePhysics` fails with
          # E0463 can't find crate for `core`, and every conformance row fails at phase
          # "build" before the emulator is ever reached.
          rustup target add aarch64-linux-android x86_64-linux-android
          node packages/runtime-native/scripts/download-deps.mjs --android
          # --android fetches only sdl3 glue, wgpu-android, sdl3-android and quiche-android.
          # src/webgpu/bindings.cpp includes stb_image.h unconditionally, so the NDK build
          # fails with "'stb_image.h' file not found" without these. The iOS lane already
          # fetches both explicitly (verify-ios-simulator.mjs); this mirrors it.
          node packages/runtime-native/scripts/download-deps.mjs --only stb
      # Without this the x86_64 image is emulated in software: `-accel auto` finds no writable
      # /dev/kvm and falls back silently. That is the 474-second boot this lane logged, and the
      # load behind the `adb ETIMEDOUT` that then discarded a run which had already passed 74/0.
      # native-release.yml has carried these four lines all along; the parity lane never got them.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Report the mode, never assert it. `test -w /dev/kvm` as the last line of this step —
          # copied from native-release.yml, where nothing has exercised it — turned "this runner
          # has no KVM" into a failed job, which is worse than the slow boot it was meant to fix.
          # A lane that cannot get acceleration should still run and say so.
          if [ -w /dev/kvm ]; then
            echo "TN_EMULATOR_ACCEL:kvm"
          else
            echo "TN_EMULATOR_ACCEL:software"
            echo "::warning::/dev/kvm is not writable on this runner; the emulator falls back to \
          software emulation, which is the 474-second boot this step exists to avoid."
          fi
      - name: Run checksum-locked APKs on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The first run to reach this step booted in 474s and then died in the action's own
          # "Disabling animations" step with `Broken pipe (32)`, exit 224 — the emulator was still
          # settling when adb was handed the next command. These options are the ones that make a
          # hosted-runner boot cheap and repeatable: software GL rather than a GPU the runner does
          # not have, and none of the audio, camera, boot animation or snapshot work this lane
          # never reads. The boot timeout is raised past the 474s that was already observed.
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none
            -gpu swiftshader_indirect -accel auto
          emulator-boot-timeout: 900
          # One line on purpose. `android-emulator-runner` feeds `script` to the emulator shell a
          # line at a time, so a `\`-continued command loses everything after the first line: from
          # 2026-09-01 this ran `run-conformance.mjs` with no arguments at all, which defaults
          # `--target` to `all`. That is the whole of the "matrix side effect" — the runner wrote
          # web, desktop, android and ios reports under the default `artifacts/conformance`,
          # overwriting the web reference this lane had just captured and then comparing the
          # emulator against the wreckage. Keep the invocation on one line; `sh -c` keeps the
          # `||` tolerance for exit 2 (rows blocked by this machine) on that same line.
          # The logcat dump rides this same folded line on purpose. `android-emulator-runner` tears
          # the emulator down when `script` returns, so a later step has no device to read: the
          # buffer has to be captured here, before the exit test that decides this step's status.
          #
          # adb's stderr goes to its own file rather than into the log. Folded into the capture it
          # would make "device offline" indistinguishable from "the observer emitted nothing": the
          # log would be non-empty, carry no marker, and the next step would blame the observer.
          # The conformance status is recorded for the same reason — exit 2 means rows were
          # blocked and the app may never have launched, which is not an observer failure.
          script: >-
            node packages/runtime-native/conformance/run-conformance.mjs --target android
            --device emulator-5554 --reference artifacts/conformance/web
            --out artifacts/conformance/android; status=$?; echo "$status" >
            "$RUNNER_TEMP/conformance-status.txt"; adb logcat -d >
            "$RUNNER_TEMP/emulator-logcat.txt" 2> "$RUNNER_TEMP/emulator-logcat.err" || echo
            TN_ADB_LOGCAT_FAILED >> "$RUNNER_TEMP/emulator-logcat.err";
            test "$status" -eq 0 -o "$status" -eq 2
      - name: Verify captured parity ledger
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const reportPath = "packages/runtime-native/artifacts/conformance/android/report.json";
          // This step runs on always(), so it is reached when an earlier step failed and the
          // emulator never ran. A bare ENOENT stack buries that cause; name it instead.
          const report = await readFile(reportPath, "utf8").then(JSON.parse, (error) => {
            if (error?.code !== "ENOENT") throw error;
            throw new Error(
              `TN_PARITY_ANDROID_REPORT_MISSING: ${reportPath} was never written, so the emulator ` +
                "lane did not run. Read the first failing step in this job, not this one.",
            );
          });
          const summary = report.summary;
          for (const key of ["pass", "fail", "blocked"]) {
            if (!Number.isInteger(summary?.[key])) throw new Error(`Missing integer summary.${key}`);
          }
          // The runner's own rule, imported rather than restated. The copy that used to
          // live here knew only `fail` and `blocked`, so a report whose Android multitouch
          // proof had failed was written down as exit 2 while the runner emits 1 — and
          // `parity:ledger`, which exists precisely to recompute this cell, then reported
          // the contradiction as a second failure stacked on top of the real one.
          const { reportExitCode } = await import(
            "./packages/runtime-native/conformance/run-conformance.mjs"
          );
          const exit = reportExitCode(report);
          const ledger = [
            "# PRD-215 Android parity ledger",
            "",
            "## Target results",
            "",
            "| Target | Command | Pass | Fail | Blocked | Exit | Outcome |",
            "| --- | --- | ---: | ---: | ---: | ---: | --- |",
            `| Android emulator | \`node packages/runtime-native/conformance/run-conformance.mjs --target android --reference artifacts/conformance/web --out artifacts/conformance/android\` | ${summary.pass} | ${summary.fail} | ${summary.blocked} | ${exit} | captured report |`,
            "",
          ].join("\n");
          await writeFile(`${process.env.RUNNER_TEMP}/prd-215-parity-ledger.md`, ledger);
          NODE
          pnpm parity:ledger "$RUNNER_TEMP/prd-215-parity-ledger.md"
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/android "android emulator"
      - name: Collect bounded Android performance evidence from the emulator build
        if: always()
        run: |
          set +e
          mkdir -p packages/runtime-native/artifacts/performance-contract/android-emulator
          apk=$(find packages/runtime-native -type f -name '*.apk' -path '*build*' -print -quit)
          if [ -n "$apk" ]; then
            node packages/runtime-native/scripts/profile-production.mjs \
              --profile production --target android --device emulator-5554 \
              --duration 1 --cold-starts 1 --repetitions 1 --warmup 1 \
              --hosted-software \
              --prebuilt-artifact "$apk" \
              --out packages/runtime-native/artifacts/performance-contract/android-emulator
            status=$?
          else
            status=2
            echo "TN_PERF_PREBUILT_ANDROID_MISSING: no APK was produced by the existing emulator build" >&2
          fi
          set -e
          printf '{"collectorExitCode":%s,"sourceSha":"%s","provenance":"android-emulator","status":"%s"}\n' \
            "$status" "$GITHUB_SHA" "$([ "$status" -eq 0 ] && echo UNVERIFIED || echo BLOCKED)" \
            > packages/runtime-native/artifacts/performance-contract/android-emulator/collector-status.json
          node packages/runtime-native/scripts/production-evidence.mjs \
            > packages/runtime-native/artifacts/performance-contract/android-emulator/collector-contract.json
      # PRD-360 structural check. This proves the observer EMITS on a real Android build and that
      # the tracked evaluator parses a real logcat — the one half of the launch measurement that
      # was previously exercised only on desktop and against a mocked adb transport.
      #
      # It deliberately does NOT judge the 8s or 250ms budgets. This lane is x86_64 SwiftShader on
      # `-accel auto`, has booted in 474s without KVM, and the evaluator's own 50% battery preflight
      # is meaningless on an emulator. A budget verdict from here would be a manufactured result, so
      # the timings are recorded UNVERIFIED and only the marker's presence and shape can fail.
      - name: Assert PRD-360 pump observer emits on Android (structural, non-timing)
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const temp = process.env.RUNNER_TEMP;
          const logPath = join(temp, "emulator-logcat.txt");
          const read = (name) => {
            try {
              return readFileSync(join(temp, name), "utf8");
            } catch (error) {
              if (error?.code === "ENOENT") return null;
              throw error;
            }
          };

          const outDir = "packages/runtime-native/artifacts/performance-contract/android-emulator";
          mkdirSync(outDir, { recursive: true });

          const record = (payload) =>
            writeFileSync(
              join(outDir, "pump-silence-structural.json"),
              `${JSON.stringify(
                { provenance: "android-emulator", sourceSha: process.env.GITHUB_SHA, ...payload },
                null,
                2,
              )}\n`,
            );

          // Reached on always(), so it runs when an earlier step failed and no emulator ever
          // booted. Name that cause rather than burying it in an ENOENT stack.
          const hostLog = read("emulator-logcat.txt");
          const conformanceStatus = read("conformance-status.txt");
          if (hostLog === null || conformanceStatus === null) {
            throw new Error(
              `TN_PUMP_ANDROID_LOGCAT_MISSING: ${logPath} was never written, so the emulator lane ` +
                "did not run. Read the first failing step in this job, not this one.",
            );
          }

          // Evidence is published whatever the verdict, and that is the point: when conformance
          // fails, the step below records BLOCKED and asserts nothing about the observer, but the
          // log it just read is the only thing that says whether the markers reached Android
          // logcat at all — still unproven. Discarding it on a red run is exactly the mistake
          // `web-reference` was making, publishing the answer only from runs that did not need it.
          //
          // What is published is the marker lines, not the buffer. `adb logcat -d` returns the
          // default set including `system`, ~1,500 lines of unrelated framework chatter per run,
          // and the open question needs three greps of it. Publishing the whole buffer widens the
          // distribution surface for no added answer. The parser still reads the full capture from
          // RUNNER_TEMP; only the artifact is narrowed.
          const markerLines = hostLog.split("\n")
            .filter((line) => line.includes("TN_PUMP_SILENCE:") || line.includes("TN_PUMP_ENDPOINT:"));
          writeFileSync(
            join(outDir, "pump-markers.log"),
            `# TN_PUMP_* lines from adb logcat -d. Device output, filtered; not the full buffer.\n${
              markerLines.join("\n")
            }\n`,
          );
          // Named for what it is: adb's own stderr on the host, not device output. Empty on a
          // healthy run; on a failed one it carries host error text under an artifact whose name
          // otherwise implies the emulator produced it.
          const adbStderr = read("emulator-logcat.err");
          if (adbStderr !== null) {
            writeFileSync(
              join(outDir, "adb-host-stderr.txt"),
              `# adb stderr on the RUNNER, not emulator output.\n${adbStderr}`,
            );
          }

          // adb's own failure is not the observer's. A dead or offline device leaves a log that is
          // present, empty of markers, and would otherwise read as "the observer emitted nothing".
          const adbErrors = (read("emulator-logcat.err") ?? "").trim();
          if (adbErrors.includes("TN_ADB_LOGCAT_FAILED") || adbErrors.length > 0) {
            record({ claim: "adb could not read the buffer", pass: false, status: "BLOCKED" });
            throw new Error(`TN_PUMP_ANDROID_ADB_FAILED: ${adbErrors.slice(0, 500)}`);
          }

          // The lane deliberately accepts conformance exit 2 — rows blocked by this machine, where
          // the app may never have launched. Absent markers then say nothing about the observer,
          // so this records BLOCKED rather than manufacturing a red against it.
          if (conformanceStatus.trim() !== "0") {
            record({
              claim: "conformance did not fully execute; observer emission not assessed",
              conformanceStatus: conformanceStatus.trim(),
              pass: false,
              status: "BLOCKED",
            });
            console.log(
              `TN_PUMP_ANDROID_BLOCKED conformance exited ${conformanceStatus.trim()}; ` +
                "the app may never have launched, so the observer is not judged here.",
            );
            process.exit(0);
          }

          // The evaluator is tracked as retained source beside its proof; import the same bytes the
          // desktop suite imports rather than restating its rules here.
          const source = "docs/verification/prd-360-startup-2026-09-05/evaluate-first-playable.mjs.txt";
          const staged = join(process.env.RUNNER_TEMP, "evaluate-first-playable.mjs");
          copyFileSync(source, staged);
          const { evaluatePumpSilence } = await import(pathToFileURL(staged).href);

          // Infinity retires the budget branch, leaving presence, JSON shape, observed:true and
          // finite non-negative stamps as the only things that can fail here.
          const result = evaluatePumpSilence({ hostLog, maxGapMs: Number.POSITIVE_INFINITY });

          record({
            claim: "observer emits and parses on Android; timings are NOT a PRD-360 verdict",
            code: result.code,
            detail: result.detail ?? null,
            pass: result.pass,
            status: "UNVERIFIED",
          });

          if (!result.pass) {
            throw new Error(
              `TN_PUMP_ANDROID_STRUCTURAL_FAILED: ${result.code} ` +
                `${JSON.stringify(result.detail ?? null)}`,
            );
          }
          console.log(`TN_PUMP_ANDROID_STRUCTURAL_OK ${JSON.stringify(result.detail)}`);
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-android-emulator-parity
          path: |
            packages/runtime-native/artifacts/conformance/
            packages/runtime-native/artifacts/android/multitouch/
            packages/runtime-native/artifacts/performance-contract/
          if-no-files-found: error

  desktop-parity:
    name: Desktop web/native parity
    needs: [scope, web-reference]
    # Runs on every event except an unlabelled pull request — the only two legs that are gated,
    # and the numbers behind it rather than a preference:
    #
    #   desktop-parity            3173s   android-emulator-parity   1858s
    #
    # 84 of the ~130 runner-minutes this workflow spends per pull request, against ~60 for all of
    # CI, on the same pool. That pool is what CI's wall clock is made of: on run 33782776626 the
    # run took 457s while its longest job was 332s, and CI's own 26 jobs were queueing against
    # ~10 slots that these legs were also holding.
    #
    # What that buys on a pull request is less than it looks. Both legs are advisory rather than
    # required, both are red on main today, and both report 30-53 minutes after a pull request
    # opens — long after CI is green and the pull request has been read. Evidence that arrives
    # after the decision is not gating the decision.
    #
    # They still run on every push to main, every night, and on any pull request labelled
    # `native`, so nothing reaches a release without them reporting. Deleting this one `if` puts
    # them back on every pull request.
    if: >-
      needs.scope.outputs.selection != 'prose' &&
      inputs.ios_only != true &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'native'))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # ccache wrote here while actions/cache saved ${{ runner.temp }}/ccache, a directory that
      # never existed. The save skipped every time, `gh cache list` held no native-ccache entry
      # after five runs, and every job recompiled from scratch while the workflow read as though
      # it were cached. This value and the cache step's `path` must stay the same path — and it
      # has to be spelled with `github.workspace`, because job-level `env` cannot see the
      # `runner` context at all: `${{ runner.temp }}` here is what GitHub rejects outright with
      # "This run likely failed because of a workflow file issue" and zero jobs started.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 900M
      CCACHE_COMPRESS: "1"
      # CMake reads the launcher from these two environment variables (cmake-env-variables(7));
      # it does not read CMAKE_PROJECT_INCLUDE_BEFORE from the environment at all. Setting a file
      # there configured nothing: probed against cmake 4.4.2, the include-before env var leaves
      # zero ccache references in the generated build, while these two put `ccache /usr/bin/cc` on
      # the compile line. Job-level env also reaches the QuickJS configure and the MSVC steps,
      # which a preset-only fix would miss.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          # The lane name is part of the namespace on purpose: this job, native `starter-linux`
          # and ci `test` compile different target sets, and while all three saved under
          # `native-ccache-<os>-<arch>-gcc-` each restored whichever sibling finished last and
          # recompiled its own objects against it. See the note in ci.yml's `test` job.
          key: native-ccache-desktop-parity-${{ runner.os }}-${{ runner.arch }}-gcc-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-${{ github.run_id }}
          restore-keys: native-ccache-desktop-parity-${{ runner.os }}-${{ runner.arch }}-gcc-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Build browser reference workspace imports
        run: pnpm tsx scripts/workspace-packages.ts build
      - uses: ./.github/actions/playwright-chromium
      - name: Capture browser references from the commit-keyed artifact
        uses: actions/download-artifact@v7
        with:
          name: native-web-reference-${{ github.sha }}
          path: packages/runtime-native/artifacts/conformance/web
      - name: Verify the downloaded browser reference
        run: |
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/web "downloaded web reference"
      - name: Install Linux desktop build dependencies and ccache
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ccache
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev
          libvulkan1 mesa-vulkan-drivers vulkan-tools zlib1g-dev
      - name: Zero the compiler cache counters
        shell: bash
        run: ccache --zero-stats
      - name: Build the native host
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Report the compiler cache hit rate
        if: always()
        shell: bash
        run: ccache --show-stats
      - name: Compare the desktop host with browser references
        run: |
          set +e
          sh scripts/xvfb.sh \
            node packages/runtime-native/conformance/run-conformance.mjs \
            --target desktop --reference artifacts/conformance/web --out artifacts/conformance/desktop
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
      - name: Verify captured desktop parity ledger
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const reportPath = "packages/runtime-native/artifacts/conformance/desktop/report.json";
          const report = await readFile(reportPath, "utf8").then(JSON.parse, (error) => {
            if (error?.code !== "ENOENT") throw error;
            throw new Error(
              `TN_PARITY_DESKTOP_REPORT_MISSING: ${reportPath} was never written, so the desktop ` +
                "lane did not run. Read the first failing step in this job, not this one.",
            );
          });
          const summary = report.summary;
          for (const key of ["pass", "fail", "blocked"]) {
            if (!Number.isInteger(summary?.[key])) throw new Error(`Missing integer summary.${key}`);
          }
          // The runner's own rule, imported rather than restated. The copy that used to
          // live here knew only `fail` and `blocked`, so a report whose Android multitouch
          // proof had failed was written down as exit 2 while the runner emits 1 — and
          // `parity:ledger`, which exists precisely to recompute this cell, then reported
          // the contradiction as a second failure stacked on top of the real one.
          const { reportExitCode } = await import(
            "./packages/runtime-native/conformance/run-conformance.mjs"
          );
          const exit = reportExitCode(report);
          const ledger = [
            "# PRD-303 desktop parity ledger",
            "",
            "## Target results",
            "",
            "| Target | Command | Pass | Fail | Blocked | Exit | Outcome |",
            "| --- | --- | ---: | ---: | ---: | ---: | --- |",
            `| Desktop | \`node packages/runtime-native/conformance/run-conformance.mjs --target desktop --reference artifacts/conformance/web --out artifacts/conformance/desktop\` | ${summary.pass} | ${summary.fail} | ${summary.blocked} | ${exit} | captured report |`,
            "",
          ].join("\n");
          await writeFile(`${process.env.RUNNER_TEMP}/prd-303-desktop-parity-ledger.md`, ledger);
          NODE
          pnpm parity:ledger "$RUNNER_TEMP/prd-303-desktop-parity-ledger.md"
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/desktop "desktop parity"
      - name: Collect bounded desktop performance evidence from the existing binary
        if: always()
        run: |
          set +e
          mkdir -p packages/runtime-native/artifacts/performance-contract/desktop-parity
          binary="$GITHUB_WORKSPACE/packages/runtime-native/build/tn-linux/mystral"
          if [ -x "$binary" ]; then
            node packages/runtime-native/scripts/profile-production.mjs \
              --profile production --target desktop --duration 1 --cold-starts 1 \
              --repetitions 1 --warmup 1 --hosted-software --prebuilt-artifact "$binary" \
              --out packages/runtime-native/artifacts/performance-contract/desktop-parity
            status=$?
          else
            status=2
            echo "TN_PERF_PREBUILT_DESKTOP_MISSING: $binary" >&2
          fi
          set -e
          printf '{"collectorExitCode":%s,"sourceSha":"%s","status":"%s"}\n' \
            "$status" "$GITHUB_SHA" "$([ "$status" -eq 0 ] && echo PASS || echo BLOCKED)" \
            > packages/runtime-native/artifacts/performance-contract/desktop-parity/collector-status.json
          node packages/runtime-native/scripts/production-evidence.mjs \
            > packages/runtime-native/artifacts/performance-contract/desktop-parity/collector-contract.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-desktop-parity
          path: |
            packages/runtime-native/artifacts/conformance/
            packages/runtime-native/artifacts/performance-contract/
          if-no-files-found: error

  desktop:
    name: ${{ matrix.platform }} desktop core
    needs: scope
    # Runs on every event since 2026-09-01 (owner call) — see android-emulator-parity. The only
    # remaining gate is the manual `ios_only` dispatch toggle, which exists to run the iOS lane
    # alone; it is not a skip of the default flow.
    if: needs.scope.outputs.selection != 'prose' && inputs.ios_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
          - platform: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # ccache wrote here while actions/cache saved ${{ runner.temp }}/ccache, a directory that
      # never existed. The save skipped every time, `gh cache list` held no native-ccache entry
      # after five runs, and every job recompiled from scratch while the workflow read as though
      # it were cached. This value and the cache step's `path` must stay the same path — and it
      # has to be spelled with `github.workspace`, because job-level `env` cannot see the
      # `runner` context at all: `${{ runner.temp }}` here is what GitHub rejects outright with
      # "This run likely failed because of a workflow file issue" and zero jobs started.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 900M
      CCACHE_COMPRESS: "1"
      # CMake reads the launcher from these two environment variables (cmake-env-variables(7));
      # it does not read CMAKE_PROJECT_INCLUDE_BEFORE from the environment at all. Setting a file
      # there configured nothing: probed against cmake 4.4.2, the include-before env var leaves
      # zero ccache references in the generated build, while these two put `ccache /usr/bin/cc` on
      # the compile line. Job-level env also reaches the QuickJS configure and the MSVC steps,
      # which a preset-only fix would miss.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-${{ github.run_id }}
          restore-keys: native-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Build native-smoke workspace dependencies
        shell: bash
        run: |
          while IFS=$'\t' read -r package_name _; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
          done < <(pnpm tsx scripts/workspace-packages.ts --archives)
      - run: pnpm --filter threenative-native-smoke build
      - name: Install ccache on macOS
        if: runner.os == 'macOS'
        run: brew install ccache
      - name: Install ccache on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ccache --yes --no-progress
      - name: Zero the compiler cache counters
        shell: bash
        run: ccache --zero-stats
      - name: Install Windows HTTP build dependencies
        if: runner.os == 'Windows'
        run: >-
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install
          "curl:x64-windows-static" "zlib:x64-windows-static"
      - name: Build native runtime with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "CC=cl"
          set "CXX=cl"
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          where cl
          pnpm --filter @threenative/runtime-native native:build
      - if: runner.os != 'Windows'
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Report the compiler cache hit rate
        if: always()
        shell: bash
        run: ccache --show-stats
      # `VsDevCmd.bat` configures the process it runs in, and a `cmd` step's environment dies with
      # the step. So this ran without INCLUDE, LIB or a usable `cl`, and the first thing inside it
      # that *configures* a build directory — the physics contract lane — got "the C compiler is
      # not able to compile a simple test program". The runtime itself had already built fine one
      # step earlier, which is why it looked like a code failure rather than a missing environment.
      #
      # Enter the developer environment here too, rather than exporting it through GITHUB_ENV: that
      # would put a Windows-style PATH in front of every later step, including the bash ones.
      - name: Verify the desktop runtime with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "CC=cl"
          set "CXX=cl"
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          pnpm --filter @threenative/runtime-native native:verify:desktop
      - if: runner.os != 'Windows'
        run: pnpm --filter @threenative/runtime-native native:verify:desktop
      - name: Collect bounded desktop performance evidence from the built runtime
        if: always()
        shell: bash
        run: |
          set +e
          status=2
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            artifact=packages/runtime-native/build/tn-windows/mystral.exe
          else
            artifact=packages/runtime-native/build/tn-macos/mystral
          fi
          mkdir -p packages/runtime-native/artifacts/performance-contract/${{ matrix.platform }}
          if [ -f "$artifact" ]; then
            node packages/runtime-native/scripts/profile-production.mjs \
              --profile production --target desktop --duration 1 --cold-starts 1 \
              --warmup 1 --repetitions 1 --hosted-software --prebuilt-artifact "$artifact" \
              --out "packages/runtime-native/artifacts/performance-contract/${{ matrix.platform }}"
            status=$?
          else
            echo "TN_PERF_DESKTOP_ARTIFACT_MISSING: $artifact" >&2
          fi
          collector_status=BLOCKED
          if [ "$status" -eq 0 ]; then collector_status=PASS; fi
          if [ "$status" -eq 1 ]; then collector_status=FAIL; fi
          printf '{"artifact":"%s","collectorExitCode":%s,"platform":"%s","provenance":"hosted-software","status":"%s"}\n' \
            "$artifact" "$status" "${{ matrix.platform }}" "$collector_status" \
            > packages/runtime-native/artifacts/performance-contract/${{ matrix.platform }}/collector-status.json
          node packages/runtime-native/scripts/production-evidence.mjs \
            > packages/runtime-native/artifacts/performance-contract/${{ matrix.platform }}/collector-contract.json
          set -e
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-desktop-${{ matrix.platform }}
          path: packages/runtime-native/artifacts/
          if-no-files-found: error

