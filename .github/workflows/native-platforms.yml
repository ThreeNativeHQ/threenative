name: Native platform evidence

# When this lane runs is owned by ci.yml, not by a path filter here.
#
# The filter used to list only packages/runtime-native/**, so a change to core,
# playtest, create-threenative or native-smoke — every package the native app
# actually bundles — could break these targets with nothing reporting it. On
# 2026-08-11 three separate reds on main turned out to be stale for exactly that
# reason. Path filters also fired push and pull_request together, running the
# whole 24-minute matrix twice per PR.
#
# Triggered here rather than called from ci.yml as of 2026-08-31: the lane reports on every push to
# main, and its result no longer decides ci.yml's conclusion. See the note where the call used to be
# in ci.yml, and PRD-295 for the failures that made it advisory.
#
# Runs on pull requests as well as pushes since 2026-08-31: a lane that only reports after a merge
# tells you the thing you needed before it. `push` is pinned to main and `pull_request` to PRs
# targeting main, so a branch push fires one of them and never both — the double 24-minute matrix
# the path filters used to cause does not come back. Reporting on a PR is not the same as blocking
# one: this lane is not a required status check while it is still red, and PRD-295 is explicit that
# a lane which has never been green must not gate a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: native-platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  android-emulator-parity:
    name: Android emulator visual parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v4
      - run: pnpm install --frozen-lockfile
      - name: Build browser reference workspace imports
        run: pnpm tsx scripts/workspace-packages.ts build
      - name: Install browser and Android build prerequisites
        run: |
          pnpm exec playwright install --with-deps chromium
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
          # build-native-physics.mjs cross-compiles the Rust physics crate for both ABIs
          # Gradle packages. Without these targets `:app:buildNativePhysics` fails with
          # E0463 can't find crate for `core`, and every conformance row fails at phase
          # "build" before the emulator is ever reached.
          rustup target add aarch64-linux-android x86_64-linux-android
          node packages/runtime-native/scripts/download-deps.mjs --android
          # --android fetches only sdl3 glue, wgpu-android, sdl3-android and quiche-android.
          # src/webgpu/bindings.cpp includes stb_image.h unconditionally, so the NDK build
          # fails with "'stb_image.h' file not found" without these. The iOS lane already
          # fetches both explicitly (verify-ios-simulator.mjs); this mirrors it.
          node packages/runtime-native/scripts/download-deps.mjs --only stb
      - name: Capture browser references
        run: |
          set +e
          sh scripts/xvfb.sh \
            node packages/runtime-native/conformance/run-conformance.mjs \
            --target web --out artifacts/conformance/web
          status=$?
          set -e
          # 2 means "some row did not run". A hosted runner exposes SwiftShader, so every
          # requiresHardwareAdapter row refuses to start; the gate below decides whether the
          # blocked set is only that, and fails on a failure or any other blocked row.
          test "$status" -eq 0 -o "$status" -eq 2
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/web "web reference"
      # Without this the x86_64 image is emulated in software: `-accel auto` finds no writable
      # /dev/kvm and falls back silently. That is the 474-second boot this lane logged, and the
      # load behind the `adb ETIMEDOUT` that then discarded a run which had already passed 74/0.
      # native-release.yml has carried these four lines all along; the parity lane never got them.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Report the mode, never assert it. `test -w /dev/kvm` as the last line of this step —
          # copied from native-release.yml, where nothing has exercised it — turned "this runner
          # has no KVM" into a failed job, which is worse than the slow boot it was meant to fix.
          # A lane that cannot get acceleration should still run and say so.
          if [ -w /dev/kvm ]; then
            echo "TN_EMULATOR_ACCEL:kvm"
          else
            echo "TN_EMULATOR_ACCEL:software"
            echo "::warning::/dev/kvm is not writable on this runner; the emulator falls back to \
          software emulation, which is the 474-second boot this step exists to avoid."
          fi
      - name: Run checksum-locked APKs on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The first run to reach this step booted in 474s and then died in the action's own
          # "Disabling animations" step with `Broken pipe (32)`, exit 224 — the emulator was still
          # settling when adb was handed the next command. These options are the ones that make a
          # hosted-runner boot cheap and repeatable: software GL rather than a GPU the runner does
          # not have, and none of the audio, camera, boot animation or snapshot work this lane
          # never reads. The boot timeout is raised past the 474s that was already observed.
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none
            -gpu swiftshader_indirect -accel auto
          emulator-boot-timeout: 900
          script: >-
            node packages/runtime-native/conformance/run-conformance.mjs
            --target android --device emulator-5554
            --reference artifacts/conformance/web
            --out artifacts/conformance/android
      - name: Verify captured parity ledger
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const reportPath = "packages/runtime-native/artifacts/conformance/android/report.json";
          // This step runs on always(), so it is reached when an earlier step failed and the
          // emulator never ran. A bare ENOENT stack buries that cause; name it instead.
          const report = await readFile(reportPath, "utf8").then(JSON.parse, (error) => {
            if (error?.code !== "ENOENT") throw error;
            throw new Error(
              `TN_PARITY_ANDROID_REPORT_MISSING: ${reportPath} was never written, so the emulator ` +
                "lane did not run. Read the first failing step in this job, not this one.",
            );
          });
          const summary = report.summary;
          for (const key of ["pass", "fail", "blocked"]) {
            if (!Number.isInteger(summary?.[key])) throw new Error(`Missing integer summary.${key}`);
          }
          const exit = summary.fail > 0 ? 1 : summary.blocked > 0 ? 2 : 0;
          const ledger = [
            "# PRD-215 Android parity ledger",
            "",
            "## Target results",
            "",
            "| Target | Command | Pass | Fail | Blocked | Exit | Outcome |",
            "| --- | --- | ---: | ---: | ---: | ---: | --- |",
            `| Android emulator | \`node packages/runtime-native/conformance/run-conformance.mjs --target android --reference artifacts/conformance/web --out artifacts/conformance/android\` | ${summary.pass} | ${summary.fail} | ${summary.blocked} | ${exit} | captured report |`,
            "",
          ].join("\n");
          await writeFile(`${process.env.RUNNER_TEMP}/prd-215-parity-ledger.md`, ledger);
          NODE
          pnpm parity:ledger "$RUNNER_TEMP/prd-215-parity-ledger.md"
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/android "android emulator"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-android-emulator-parity
          path: packages/runtime-native/artifacts/conformance/
          if-no-files-found: error
      - if: failure()
        uses: ./.github/actions/cancel-run-on-failure

  desktop-parity:
    name: Desktop web/native parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - uses: actions/checkout@v7
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-gcc-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}
          restore-keys: native-ccache-${{ runner.os }}-${{ runner.arch }}-gcc-
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Build browser reference workspace imports
        run: pnpm tsx scripts/workspace-packages.ts build
      - uses: ./.github/actions/playwright-chromium
      # Capture before the native Vulkan packages are installed. On the same ubuntu-24.04 image,
      # Chromium's SwiftShader compositor produces 74/0 here (as the Android lane proves) but a
      # uniform white surface after mesa-vulkan-drivers changes the runner's Vulkan stack.
      - name: Capture browser references
        run: |
          set +e
          sh scripts/xvfb.sh node packages/runtime-native/conformance/run-conformance.mjs --target web --out artifacts/conformance/web
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/web "web reference"
      - name: Install Linux desktop build dependencies and ccache
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ccache
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev
          libvulkan1 mesa-vulkan-drivers vulkan-tools zlib1g-dev
      - name: Activate native compiler cache
        run: |
          cat > "$RUNNER_TEMP/tn-ccache.cmake" <<'CMAKE'
          set(CMAKE_C_COMPILER_LAUNCHER ccache CACHE STRING "" FORCE)
          set(CMAKE_CXX_COMPILER_LAUNCHER ccache CACHE STRING "" FORCE)
          CMAKE
          echo "CMAKE_PROJECT_INCLUDE_BEFORE=$RUNNER_TEMP/tn-ccache.cmake" >> "$GITHUB_ENV"
      - name: Build the native host
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Compare the desktop host with browser references
        run: |
          set +e
          node packages/runtime-native/conformance/run-conformance.mjs --target desktop --reference artifacts/conformance/web --out artifacts/conformance/desktop
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
      - name: Verify captured desktop parity ledger
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const reportPath = "packages/runtime-native/artifacts/conformance/desktop/report.json";
          const report = await readFile(reportPath, "utf8").then(JSON.parse, (error) => {
            if (error?.code !== "ENOENT") throw error;
            throw new Error(
              `TN_PARITY_DESKTOP_REPORT_MISSING: ${reportPath} was never written, so the desktop ` +
                "lane did not run. Read the first failing step in this job, not this one.",
            );
          });
          const summary = report.summary;
          for (const key of ["pass", "fail", "blocked"]) {
            if (!Number.isInteger(summary?.[key])) throw new Error(`Missing integer summary.${key}`);
          }
          const exit = summary.fail > 0 ? 1 : summary.blocked > 0 ? 2 : 0;
          const ledger = [
            "# PRD-303 desktop parity ledger",
            "",
            "| Target | Pass | Fail | Blocked | Exit |",
            "| --- | ---: | ---: | ---: | ---: |",
            `| Desktop | ${summary.pass} | ${summary.fail} | ${summary.blocked} | ${exit} |`,
            "",
          ].join("\n");
          await writeFile(`${process.env.RUNNER_TEMP}/prd-303-desktop-parity-ledger.md`, ledger);
          NODE
          pnpm parity:ledger "$RUNNER_TEMP/prd-303-desktop-parity-ledger.md"
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/desktop "desktop parity"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-desktop-parity
          path: packages/runtime-native/artifacts/conformance/
          if-no-files-found: error
      - if: failure()
        uses: ./.github/actions/cancel-run-on-failure

  desktop:
    name: ${{ matrix.platform }} desktop core
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
          - platform: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - uses: actions/checkout@v7
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}
          restore-keys: native-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Build native-smoke workspace dependencies
        shell: bash
        run: |
          while IFS=$'\t' read -r package_name _; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
          done < <(pnpm tsx scripts/workspace-packages.ts --archives)
      - run: pnpm --filter threenative-native-smoke build
      - name: Install ccache on macOS
        if: runner.os == 'macOS'
        run: brew install ccache
      - name: Install ccache on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ccache --yes --no-progress
      - name: Activate native compiler cache
        shell: bash
        run: |
          cmake_include="$RUNNER_TEMP/tn-ccache.cmake"
          cat > "$cmake_include" <<'CMAKE'
          set(CMAKE_C_COMPILER_LAUNCHER ccache CACHE STRING "" FORCE)
          set(CMAKE_CXX_COMPILER_LAUNCHER ccache CACHE STRING "" FORCE)
          CMAKE
          if command -v cygpath >/dev/null 2>&1; then cmake_include=$(cygpath -w "$cmake_include"); fi
          echo "CMAKE_PROJECT_INCLUDE_BEFORE=$cmake_include" >> "$GITHUB_ENV"
      - name: Install Windows HTTP build dependencies
        if: runner.os == 'Windows'
        run: >-
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install
          "curl:x64-windows-static" "zlib:x64-windows-static"
      - name: Build native runtime with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "CC=cl"
          set "CXX=cl"
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          where cl
          pnpm --filter @threenative/runtime-native native:build
      - if: runner.os != 'Windows'
        run: pnpm --filter @threenative/runtime-native native:build
      # `VsDevCmd.bat` configures the process it runs in, and a `cmd` step's environment dies with
      # the step. So this ran without INCLUDE, LIB or a usable `cl`, and the first thing inside it
      # that *configures* a build directory — the physics contract lane — got "the C compiler is
      # not able to compile a simple test program". The runtime itself had already built fine one
      # step earlier, which is why it looked like a code failure rather than a missing environment.
      #
      # Enter the developer environment here too, rather than exporting it through GITHUB_ENV: that
      # would put a Windows-style PATH in front of every later step, including the bash ones.
      - name: Verify the desktop runtime with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "CC=cl"
          set "CXX=cl"
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          pnpm --filter @threenative/runtime-native native:verify:desktop
      - if: runner.os != 'Windows'
        run: pnpm --filter @threenative/runtime-native native:verify:desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-desktop-${{ matrix.platform }}
          path: packages/runtime-native/artifacts/
          if-no-files-found: error
      - if: failure()
        uses: ./.github/actions/cancel-run-on-failure

  starter-linux:
    name: Scaffolded starter desktop artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - uses: actions/checkout@v7
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-gcc-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}
          restore-keys: native-ccache-${{ runner.os }}-${{ runner.arch }}-gcc-
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ccache
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev
          libvulkan1 mesa-vulkan-drivers vulkan-tools zlib1g-dev
      - name: Activate native compiler cache
        run: |
          cat > "$RUNNER_TEMP/tn-ccache.cmake" <<'CMAKE'
          set(CMAKE_C_COMPILER_LAUNCHER ccache CACHE STRING "" FORCE)
          set(CMAKE_CXX_COMPILER_LAUNCHER ccache CACHE STRING "" FORCE)
          CMAKE
          echo "CMAKE_PROJECT_INCLUDE_BEFORE=$RUNNER_TEMP/tn-ccache.cmake" >> "$GITHUB_ENV"
      - name: Build and pack the scaffold dependencies
        run: |
          pnpm --filter @threenative/runtime-native native:build
          mkdir -p "$RUNNER_TEMP/threenative-packages"
          pnpm tsx scripts/workspace-packages.ts --archives > "$RUNNER_TEMP/threenative-package-specs"
          while IFS=$'\t' read -r package_name archive_prefix; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
            pnpm --filter "$package_name" pack --pack-destination "$RUNNER_TEMP/threenative-packages"
          done < "$RUNNER_TEMP/threenative-package-specs"
      - name: Scaffold the native starter from local tarballs
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ runner.temp }}/threenative-packages
          specs-file: ${{ runner.temp }}/threenative-package-specs
          target: ${{ runner.temp }}/threenative-starter-native
          template: starter
      - name: Build and verify the scaffolded starter
        run: |
          target="$RUNNER_TEMP/threenative-starter-native"
          pnpm --dir "$target" install --ignore-scripts
          THREENATIVE_RUNTIME_BINARY="$PWD/packages/runtime-native/build/tn-linux/mystral" \
            pnpm --dir "$target" test:native
      - name: Collect starter evidence
        if: always()
        run: |
          mkdir -p packages/runtime-native/artifacts/starter-linux
          source="$RUNNER_TEMP/threenative-starter-native/artifacts/native"
          if [ -d "$source" ]; then
            cp -a "$source/." packages/runtime-native/artifacts/starter-linux/
          else
            echo "starter verifier produced no artifact directory: $source"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-starter-linux
          path: packages/runtime-native/artifacts/starter-linux/
          if-no-files-found: error
      - if: failure()
        uses: ./.github/actions/cancel-run-on-failure

  ios-simulator:
    name: iOS simulator runtime and no-Xcode consumer handoff
    runs-on: macos-15
    timeout-minutes: 60
    # Advisory while the simulator's worker proof is unresolved: the app reaches
    # TN_NATIVE_SMOKE_READY and TN_NATIVE_SMOKE_FIRST_FRAME, then fails
    # TN_NATIVE_WORKER_PROOF_FAIL "worker result was not delivered", so it never reaches 300
    # frames. That is real iOS behaviour and needs a Mac to diagnose; it must not hold every other
    # lane's merge hostage. The job still runs and its artifacts still upload — PRD-295 is explicit
    # that an advisory lane which stays advisory becomes noise, so this comes off with the fix.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build iOS proof workspace dependencies
        run: |
          while IFS=$'\t' read -r package_name _; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
          done < <(pnpm tsx scripts/workspace-packages.ts --archives)
      - run: rustup target add aarch64-apple-ios-sim
      - run: node packages/runtime-native/scripts/verify-ios-simulator.mjs
      - name: Archive the scenario-verified unsigned simulator host
        run: |
          app=$(find packages/runtime-native/build/tn-ios-simulator -name threenative-ios.app -type d -print -quit)
          test -n "$app"
          archive="$RUNNER_TEMP/threenative-ios-simulator-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          sha=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          echo "THREENATIVE_IOS_SIMULATOR_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "THREENATIVE_IOS_SIMULATOR_SHA256=$sha" >> "$GITHUB_ENV"
          cp "$archive" packages/runtime-native/artifacts/ios/
      - name: Pack the exact consumer packages
        run: |
          mkdir -p "$RUNNER_TEMP/ios-packages"
          pnpm tsx scripts/workspace-packages.ts --archives > "$RUNNER_TEMP/threenative-package-specs"
          while IFS=$'\t' read -r package_name archive_prefix; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
            pnpm --filter "$package_name" pack --pack-destination "$RUNNER_TEMP/ios-packages"
          done < "$RUNNER_TEMP/threenative-package-specs"
      - name: Scaffold the iOS consumer from local tarballs
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ runner.temp }}/ios-packages
          specs-file: ${{ runner.temp }}/threenative-package-specs
          target: ${{ runner.temp }}/threenative-ios-consumer
          template: minimal
      - name: Install the exact consumer packages without lifecycle compilation
        run: |
          target="$RUNNER_TEMP/threenative-ios-consumer"
          cp examples/native-smoke/src/physics.ts "$target/src/game.ts"
          cp examples/native-smoke/vite.config.ts "$target/vite.config.ts"
          cp packages/physics/__tests__/fixtures/physics-parity.scenario.json \
            "$target/physics-parity.scenario.json"
          pnpm --dir "$target" install --ignore-scripts
          echo "IOS_CONSUMER_TARGET=$target" >> "$GITHUB_ENV"
      - name: Build and run the consumer app without CMake, Xcodebuild, or Rust
        run: |
          mkdir -p "$RUNNER_TEMP/ios-toolchain-mask"
          for command in cargo cmake ninja rustc xcodebuild; do
            printf '#!/bin/sh\nprintf "%%s\\n" "$0 $*" >> "$TN_IOS_TOOLCHAIN_LOG"\nexit 97\n' \
              > "$RUNNER_TEMP/ios-toolchain-mask/$command"
            chmod +x "$RUNNER_TEMP/ios-toolchain-mask/$command"
          done
          export TN_IOS_TOOLCHAIN_LOG="$RUNNER_TEMP/ios-toolchain-invocations.log"
          export PATH="$RUNNER_TEMP/ios-toolchain-mask:$PATH"
          app="$IOS_CONSUMER_TARGET/dist-native/threenative-ios-consumer.app"
          run_ios() {
            scenario=$1
            artifacts=$2
            node packages/playtest/dist/runner/cli.js "$scenario" \
              --target ios --app "$app" --bundle-id dev.threenative.runtime \
              --artifacts "$artifacts"
          }
          expect_ios_failure() {
            scenario=$1
            artifacts=$2
            expected=$3
            log=$4
            set +e
            run_ios "$scenario" "$artifacts" > "$log" 2>&1
            status=$?
            set -e
            test "$status" -eq 1
            grep -F "$expected" "$log"
          }

          THREENATIVE_PHYSICS_PROOF=enabled THREENATIVE_PHYSICS_CONTROL=normal \
            pnpm --dir "$IOS_CONSUMER_TARGET" build --target ios
          test -d "$app"
          run_ios examples/native-smoke/playtests/physics.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-pass
          expect_ios_failure examples/native-smoke/playtests/physics-wrong-height.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-wrong-height \
            TN_PLAYTEST_POSITION_REACH_ASSERTION_FAILED "$RUNNER_TEMP/ios-consumer-wrong-height.log"
          expect_ios_failure examples/native-smoke/playtests/physics-mask.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-mask-normal \
            TN_PLAYTEST_MOVEMENT_ASSERTION_FAILED "$RUNNER_TEMP/ios-consumer-mask-normal.log"

          THREENATIVE_PHYSICS_PROOF=enabled THREENATIVE_PHYSICS_CONTROL=masked \
            pnpm --dir "$IOS_CONSUMER_TARGET" build --target ios
          run_ios examples/native-smoke/playtests/physics-mask.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-mask-pass

          THREENATIVE_PHYSICS_PROOF=enabled THREENATIVE_PHYSICS_CONTROL=wrong-gravity \
            pnpm --dir "$IOS_CONSUMER_TARGET" build --target ios
          expect_ios_failure examples/native-smoke/playtests/physics.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-wrong-gravity \
            TN_PLAYTEST_POSITION_REACH_ASSERTION_FAILED "$RUNNER_TEMP/ios-consumer-wrong-gravity.log"
          test ! -e "$TN_IOS_TOOLCHAIN_LOG"
      - run: >-
          pnpm exec vitest run
          packages/playtest/__tests__/ios-driver.spec.ts
          packages/playtest/__tests__/ios-device-playtest.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ios-simulator
          path: |
            packages/runtime-native/artifacts/ios/
            ${{ runner.temp }}/ios-consumer-*.log
          if-no-files-found: error
      - if: failure()
        uses: ./.github/actions/cancel-run-on-failure
