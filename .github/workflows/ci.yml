name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. The workflow used to hold Actions write access so a failing job could cancel its own
# run; that mechanism is gone (see the note above `jobs:`), and nothing else here calls the
# Actions API.
permissions:
  contents: read

jobs:
  # A red job no longer stops the rest of the run, and that is deliberate. The fail-fast this
  # replaces cancelled the whole run through the Actions API from inside the job that failed —
  # and a run-level cancel re-marks every in-flight job `cancelled`, the caller included. On
  # 2026-09-02 a flaky `test-browser` therefore reported eleven cancelled checks and zero
  # failures, so the pull request said "cancelled out of nowhere" and `gh run rerun --failed`
  # had nothing marked failed to re-run. The runner minutes it saved cost the one thing a red
  # run exists to produce: the name of the gate that broke. The matrices already carry
  # `fail-fast: false` for the same reason, and the expensive jobs already `needs:` the gate
  # they depend on, so a broken `build` still skips them without erasing anything.
  #
  # Every job below checks out and installs for itself, so nothing gains from a shared `install`
  # job that discards its own node_modules — it only added a serial edge in front of the run.
  # The cheap gates now start together, and the expensive ones name the gate they wait on.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # `pnpm test` needs the native contract executables; nothing else here does. Keeping the browser
  # and playtest lanes in their own jobs means one run reports every failure instead of teaching us
  # one per push — which is what made the first-ever green take five sequential runs to find.
  # The JS half of `pnpm test`. Everything here — `check:docs`, the workspace build, every
  # package's own `test` script bar one, and the ~2,400-test root vitest run — needs a Node
  # toolchain and nothing more. The C++ host it used to compile for 279s serves exactly one
  # consumer: `@threenative/runtime-native`'s own `test` script, which drives real contract
  # executables. That moved to `test-native` below, which runs beside this job instead of in front
  # of it. `scripts/__tests__/ci-structure.spec.ts` asserts the two halves partition the workspace.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TN_SUITE_EXCLUDE_PACKAGES: "@threenative/runtime-native"
      # The unit run moved to `test-unit` below. What is left here is the part that only makes
      # sense once: the docs check, the build that proves every workspace and example still
      # bundles, and the walk of each package's own `test` script.
      TN_SUITE_PHASES: "docs,build,package-test"
      # The orphan gate waits for Playwright's asynchronous profile cleanup and fails when it never
      # settles. Its 30s default is a quiet-machine number and this job is not one.
      TN_ORPHAN_SETTLE_SECONDS: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm test

  # The root vitest run was the longest single thing in the run's longest job — 351 files and
  # ~3,500 tests, measured at 151s of `test`'s 387s. It shards cleanly and it is the only part of
  # that job that does: the docs check, the build and the package walk each make sense once.
  #
  # Every test still runs. `vitest --shard` slices the same file list, and the slices were checked
  # to add back up: 117 + 117 + 117 = 351 files, union identical to the unsharded suite with no
  # file in two shards. `scripts/__tests__/ci-structure.spec.ts` holds the matrix to that shape,
  # and `run-test-suite.sh` refuses a phase selection that would run nothing at all.
  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    env:
      TN_SUITE_PHASES: unit
      TN_SUITE_UNIT_SHARD: ${{ matrix.shard }}
      # The orphan gate waits for Playwright's asynchronous profile cleanup; its 30s default is a
      # quiet-machine number and this job drives real browsers.
      TN_ORPHAN_SETTLE_SECONDS: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The specs import the compiled workspace; `test` builds it in its own `build` phase, and
      # this job takes the cached result rather than repeating it three times over.
      - uses: ./.github/actions/workspace-dist
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm test

  test-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # ccache wrote here while actions/cache saved ${{ runner.temp }}/ccache, a directory that
      # never existed. The save skipped every time, `gh cache list` held no native-ccache entry
      # after five runs, and every job recompiled from scratch while the workflow read as though
      # it were cached. This value and the cache step's `path` must stay the same path — and it
      # has to be spelled with `github.workspace`, because job-level `env` cannot see the
      # `runner` context at all: `${{ runner.temp }}` here is what GitHub rejects outright with
      # "This run likely failed because of a workflow file issue" and zero jobs started.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 900M
      CCACHE_COMPRESS: "1"
      # Not `CCACHE_SLOPPINESS: pch_defines,time_macros`, tried and reverted. The verbose report
      # showed half of every compiler invocation was not a cache candidate at all — run
      # 33714810237, host build:
      #   Uncacheable calls:                   280 / 552 (50.72%)
      #     Could not use precompiled header:  266 / 280 (95.00%)
      # Those 266 are SDL3, which builds its ~391 objects behind `target_precompile_headers`.
      # The sloppiness setting did make them eligible — 538/552 cacheable, 14 uncacheable — and
      # produced *no hits at all*: two consecutive runs both read `Hits: 77 / 538`, the same 77
      # this lane had before, while the first paid 154s -> 211s to store objects the second never
      # read. GCC needs `-fpch-preprocess` on the compile line for a PCH compile to be reusable
      # and CMake does not add it, so the setting bought a better-looking report and nothing else.
      # The next thing to try is `CMAKE_DISABLE_PRECOMPILE_HEADERS=ON` for this build, which makes
      # SDL3's objects ordinary cacheable compiles rather than eligible-but-unhittable ones.
      # CMake reads the launcher from these two environment variables (cmake-env-variables(7));
      # it does not read CMAKE_PROJECT_INCLUDE_BEFORE from the environment at all. Setting a file
      # there configured nothing: probed against cmake 4.4.2, the include-before env var leaves
      # zero ccache references in the generated build, while these two put `ccache /usr/bin/cc` on
      # the compile line. Job-level env also reaches the QuickJS configure and the MSVC steps,
      # which a preset-only fix would miss.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # The orphan gate waits for Playwright's asynchronous profile cleanup and fails when it never
      # settles. Its 30s default is a quiet-machine number: this job also compiles the native host,
      # and on a two-core runner the same gate passed one run and failed the next on a profile
      # directory that removes itself moments later. The knob exists for exactly this; the gate
      # still fails when a directory genuinely outlives the wait, and now names what holds it.
      TN_ORPHAN_SETTLE_SECONDS: 120
    steps:
      # Full history, only on this job. `restore-source-mtimes.mjs` below dates each native source
      # by the commit that last touched it, and a shallow clone has no such information — `git log`
      # reports one commit, every file is dated to HEAD, and the cached build tree is then older
      # than all of its inputs. That is what run 33751865452 did: 299 of 299 files restamped and 78
      # objects rebuilt behind a cache that had just been restored.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      # The compiled tree itself, not just the object cache in front of it. ccache has never paid
      # off on this lane — 195 of 272 cacheable compiles miss on every run, and the half hidden
      # behind SDL3's precompiled header cannot be cached at all without `-fpch-preprocess` (see
      # the notes above and the two reverts in this branch's history). Restoring the build
      # directory sidesteps the question: ninja re-stats every input and rebuilds exactly what
      # changed, so a stale entry costs a recompile rather than a wrong binary, and an unchanged
      # tree costs a download. Measured locally at 315 MB for `build/tn-linux`, against ~240s of
      # compiling on the runner (host 154s + contract targets 53s + QuickJS 33s).
      #
      # The key hashes what the build is made of. `restore-keys` matters more than an exact hit
      # here: a partial match still hands ninja most of its objects and it rebuilds the rest.
      - name: Restore the compiled native tree
        uses: actions/cache@v4
        with:
          # Cargo's output belongs here too. With the C++ compile eliminated by #78, the host build
          # step was still ~112s and all of it was Rust: `threenative_native_physics` and the
          # `ui-overlay` crate with its webkit2gtk bindings. Measured locally, physics alone is a
          # 19s cold build producing 248 MB, and 0s warm.
          #
          # The physics crate's output is `.runtime/physics-target`, not `native/physics/target`:
          # `build-native-physics.mjs` passes `--target-dir` explicitly because it cross-compiles
          # to five targets. Caching the directory `cargo build` would have used by default cached
          # nothing at all, and the ~50s physics build kept running behind a warm cache.
          #
          # It needs no timestamp help, unlike ninja: touching every `.rs` source the way a
          # checkout does and rebuilding takes 0s, because cargo fingerprints content rather than
          # trusting mtimes alone. So the cache is the whole change here, and the key grows to
          # cover the crate sources and their lockfiles — a Rust source that moves has to miss.
          path: |
            packages/runtime-native/build/tn-linux
            packages/runtime-native/build/tn-linux-quickjs
            packages/runtime-native/.runtime/physics-target
            packages/runtime-native/native/ui-overlay/target
          key: native-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake', 'packages/runtime-native/src/**', 'packages/runtime-native/include/**', 'packages/runtime-native/tests/**/*.cpp', 'packages/runtime-native/native/**/src/**', 'packages/runtime-native/native/**/Cargo.toml', 'packages/runtime-native/native/**/Cargo.lock') }}
          restore-keys: native-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          # `ci-test` names the lane, and that is the whole point of it. Three Linux jobs compile
          # different target sets — this one, native `desktop-parity` and native `starter-linux` —
          # and all three used to save under `native-ccache-<os>-<arch>-gcc-`. The key carries the
          # run id so every run stores a new entry, and `restore-keys` takes the newest match, so
          # each lane restored whichever sibling had finished last and then recompiled its own
          # objects against it. On run 33690597861 this job reported `Hits: 184 / 574 (32.06%)`
          # against a tree whose native sources had not moved, and the stored entry sat at 23 MiB
          # run after run instead of growing to hold what any one lane needs. A restore-key prefix
          # is a namespace; sharing one between jobs that build different things is a cache that
          # reports warm and behaves cold.
          key: native-ccache-ci-test-native-${{ runner.os }}-${{ runner.arch }}-gcc-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-${{ github.run_id }}
          restore-keys: native-ccache-ci-test-native-${{ runner.os }}-${{ runner.arch }}-gcc-
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      # The runtime-native contract tests execute real binaries and refuse to skip when one is
      # missing — an unbuilt executable is unexecuted, and a silent skip would read as a pass. CI
      # never built them, so `pnpm test` had four permanently failing tests and this workflow had
      # never once gone green. The build is what makes the native half of the suite real here.
      - name: Install Linux desktop build dependencies
        # Not `--no-install-recommends`, tried and reverted. It took this step from 63s to 36s
        # and then failed `distribution.test.mjs > an installed runtime verifier uses packaged
        # Linux display support` with `scripts/xvfb.sh: Xvfb did not report a display within 10
        # seconds` (run 33715557861). Something the X stack needs on this runner arrives as a
        # recommended package of one of the development packages below, and 27s is not worth
        # finding out which one by bisection.
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ccache
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev
          libvulkan1 mesa-vulkan-drivers vulkan-tools zlib1g-dev
      # `ccache --show-stats` at the end of the job reports one number for three builds, and that
      # number has been stuck at `Hits: 184 / 574 (32.06%)` on every run measured — identical
      # before and after each lane got its own restore-key namespace, and with the restore
      # demonstrably hitting (`Cache restored from key: native-ccache-ci-test-native-…`). One
      # total cannot tell the two candidate explanations apart:
      #
      #   * the restored cache is worthless and all 184 hits are this run recompiling something
      #     it already compiled — the V8 and QuickJS build directories share sources, so the
      #     third step would hit what the first step just stored; or
      #   * the restore works for a stable subset and 390 objects genuinely hash differently
      #     run over run.
      #
      # Reading the counters between the builds separates them: if the host build reports zero
      # hits and the hits only appear in the QuickJS step, it is the first. This is measurement,
      # not a fix, and it is cheap enough to keep either way.
      # `actions/checkout` stamps every file with the time it ran, so the build tree restored above
      # is always older than its own inputs and ninja rebuilds all of it — which is why the host
      # build stayed at ~108s with a warm cache. The content is identical to the commit; only the
      # timestamps are new. This makes them the commit's, which is the same on every checkout, so
      # an unchanged source really reads as unchanged. A source that did move carries a newer
      # commit time and is rebuilt, and a file differing from HEAD is left alone entirely — the
      # two properties that keep this from being a way to ship a stale object.
      - name: Date the native sources by their last commit, not by the checkout
        run: node packages/runtime-native/scripts/restore-source-mtimes.mjs
      - name: Zero the compiler cache counters
        shell: bash
        run: |
          echo "restored cache on disk: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1 || echo 'absent')"
          ccache --zero-stats
      - name: Build the native host
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Compiler cache after the host build
        if: always()
        shell: bash
        run: ccache --show-stats --verbose
      # The target names are discovered from CMakeLists.txt rather than listed here: a
      # hand-maintained list in a workflow file is the drift that leaves a new contract target
      # unbuilt on CI and only failing for whoever pushes next.
      - name: Build the V8 contract executables
        working-directory: packages/runtime-native
        run: |
          set -euo pipefail
          targets=$(grep -oE 'add_executable\(\s*threenative-[a-z0-9-]+-test' CMakeLists.txt \
            | sed -E 's/.*\(\s*//' | sort -u)
          echo "contract targets: $targets"
          # One ninja invocation over every target, not one per target. Ninja schedules the whole
          # set against a single dependency graph, so the objects these executables share are
          # compiled once instead of being re-checked by each of ~20 sequential builds. The loop
          # survives as the fallback: a combined build reports only that something failed, and the
          # per-target pass is what names which target cannot build while letting the rest through.
          target_args=()
          for target in $targets; do target_args+=(--target "$target"); done
          if ! cmake --build build/tn-linux "${target_args[@]}" --parallel "$(nproc)"; then
            echo "combined contract build failed; rebuilding per target to name the one that broke"
            for target in $targets; do
              cmake --build build/tn-linux --target "$target" --parallel "$(nproc)" || \
                echo "target $target is not buildable in build/tn-linux"
            done
          fi
      - name: Compiler cache after the V8 contract executables
        if: always()
        shell: bash
        run: ccache --show-stats --verbose
      # timestamp-query and rg11b10-renderable are cross-engine contracts and the JS engine is
      # a build-time choice, so QuickJS needs its own configured build directory. Without it
      # those tests fail closed on CI naming build/tn-linux-quickjs, exactly as happened to
      # timestamp-query before this step existed.
      - name: Build the QuickJS engine variant the cross-engine contracts need
        working-directory: packages/runtime-native
        run: |
          set -euo pipefail
          node scripts/download-deps.mjs --only quickjs
          cmake -S . -B build/tn-linux-quickjs -DMYSTRAL_USE_QUICKJS=ON -DMYSTRAL_USE_V8=OFF
          cmake --build build/tn-linux-quickjs --target threenative-timestamp-query-test \
            --target threenative-rg11b10-renderable-test --parallel "$(nproc)"
      - name: Compiler cache after the QuickJS variant
        if: always()
        shell: bash
        run: ccache --show-stats --verbose
      - name: Report the compiler cache hit rate
        if: always()
        shell: bash
        run: ccache --show-stats
      # The contract tests import the compiled workspace — `production-profile.test.mjs` loads
      # `@threenative/playtest` to run its generated workload through the validator, and the
      # conformance dry run bundles rows through the same path. `pnpm test` used to build this for
      # them inside its own `build` phase; now that this job no longer runs `pnpm test`, it builds
      # what it imports. Run 33702063755 is what skipping it looks like:
      #   Cannot find module '.../packages/playtest/dist/index.js'
      #     imported from '.../packages/runtime-native/tests/production-profile.test.mjs'
      - uses: ./.github/actions/workspace-dist
      # Only the suite that needs what the steps above built. `publint` and
      # `native:physics:parity` ride along inside that script, which is the package's whole gate.
      - run: pnpm --filter @threenative/runtime-native test

  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          # The store this job needs is not the repository's. It scaffolds a generated project and
          # installs *its* dependencies, and on run 33753945433 every template leg reported
          # `resolved 492, reused 192, downloaded 170` — a third of the tree fetched from the
          # network, ten legs over, because the store cache is keyed on the workspace lockfile
          # alone and the templates pin their own. Naming the template manifests in the key makes
          # the saved store the one these jobs actually draw from.
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/create-threenative/templates/*/package.json
      - run: pnpm install --frozen-lockfile
      # These lanes used to sit behind `pnpm test`, whose build phase left every package's dist/
      # on disk. Split out, they resolve @threenative/* through export maps that point at dist,
      # so they build it themselves — otherwise the run dies on a missing assets/dist/index.js.
      - uses: ./.github/actions/workspace-dist
      - uses: ./.github/actions/playwright-chromium
      # `playwright.config.ts` scaffolds its starter projects from packed tarballs, and without
      # this it rebuilds and re-packs every workspace package to get them — before the first of
      # four browser tests runs. On run 33739951215 that setup was 245s against 40s of actual
      # testing. `THREENATIVE_PACKED_PACKAGES` is the seam the config already had; this points it
      # at the set the cached action just restored.
      - run: sh scripts/xvfb.sh pnpm test:browser
        env:
          THREENATIVE_PACKED_PACKAGES: ${{ github.workspace }}/artifacts/workspace-packages
      # A pixel gate that fails on a runner nobody can log into is only diagnosable if the frame
      # it rejected comes back with the failure.
      - name: Keep the frame a failed look gate rejected
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: starter-look-frame
          path: test-results/starter-look
          if-no-files-found: ignore

  test-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          # The store this job needs is not the repository's. It scaffolds a generated project and
          # installs *its* dependencies, and on run 33753945433 every template leg reported
          # `resolved 492, reused 192, downloaded 170` — a third of the tree fetched from the
          # network, ten legs over, because the store cache is keyed on the workspace lockfile
          # alone and the templates pin their own. Naming the template manifests in the key makes
          # the saved store the one these jobs actually draw from.
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/create-threenative/templates/*/package.json
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm test:playtest:ci

  golden-path-template:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        template:
          - starter
          - platformer
    runs-on: ubuntu-latest
    # The scenario arithmetic this number came from moved out to `template-nonvisual`, which now
    # owns the non-visual sweep for all eight templates. What is left is `verify:golden-path` —
    # pack, scaffold, install, dev, test, build, assert, once per matrix leg — which measured 309s
    # (starter) and 412s (platformer) on run 33690597861, plus a 27s browser smoke. 45 minutes is
    # a ceiling on patience with room to be wrong, not a performance assertion: nothing in this
    # job measures how long it took.
    timeout-minutes: 45
    env:
      # This job proves a stranger can scaffold a project, install it, build it and have its own
      # playtests run. The scaffold's `test` script refuses a software adapter, which is right for
      # the developer machine it was written for and impossible on a runner with no GPU — so the
      # acceptance is stated here, out loud, around an unmodified project. The runs still report
      # the adapter they got; what is proven here is the golden path, not the pixels.
      TN_PLAYTEST_ALLOW_SOFTWARE: "1"
      TN_GOLDEN_PATH_TEMPLATES: ${{ matrix.template }}
    steps:
      - uses: actions/checkout@v7
      # Skip the whole lane when this exact tree has already proved it. The key hashes everything
      # the lane consumes — every package source and manifest, every template, the scripts that
      # pack and verify, the lockfile, and the workflow itself — so a hit means the inputs are
      # byte-identical to a run that passed, on any branch. A PR that only touches docs or PRDs
      # skips ~12 minutes; a rebase that changes nothing here reuses the proof rather than
      # re-earning it; anything that could change the answer misses and runs in full.
      #
      # Deliberately broad rather than clever. A key that names only the "related" files is one
      # forgotten input away from a gate that passes because nothing ran, and this repository has
      # already been bitten by exactly that reasoning: the path filters on native-platforms let
      # core, playtest and create-threenative changes through unproven. Extra misses cost minutes.
      # A false pass costs a broken release.
      - name: Restore the proof that this tree already passed
        id: proof
        uses: actions/cache/restore@v4
        with:
          path: .golden-path-proof
          key: golden-path-proof-${{ matrix.template }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/**', 'scripts/**', '.github/**') }}
      - if: steps.proof.outputs.cache-hit == 'true'
        run: |
          echo "golden-path ${{ matrix.template }}: reusing the proof recorded for this tree"
          cat .golden-path-proof/commit
      - uses: ./.github/actions/pnpm
        if: steps.proof.outputs.cache-hit != 'true'
      - uses: actions/setup-node@v7
        if: steps.proof.outputs.cache-hit != 'true'
        with:
          node-version: 20
          cache: pnpm
          # The store this job needs is not the repository's. It scaffolds a generated project and
          # installs *its* dependencies, and on run 33753945433 every template leg reported
          # `resolved 492, reused 192, downloaded 170` — a third of the tree fetched from the
          # network, ten legs over, because the store cache is keyed on the workspace lockfile
          # alone and the templates pin their own. Naming the template manifests in the key makes
          # the saved store the one these jobs actually draw from.
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/create-threenative/templates/*/package.json
      - run: pnpm install --frozen-lockfile
        if: steps.proof.outputs.cache-hit != 'true'
      # Everything this lane needs before the smoke, and nothing template-nonvisual already does.
      # It used to pack the workspace, scaffold both templates and run their non-visual scenarios
      # here, and then `verify:golden-path` below packed and scaffolded the same template all over
      # again. Since 2026-09-01 `template-nonvisual` runs that identical sweep — same classifier,
      # same runner, same flags — for all eight templates on every event, so the copy proved
      # nothing the run did not already know and cost 350s of the critical path (run 33690597861,
      # step "Run the scaffold's GPU-free assertions"). What is left here is the verifier, which is
      # this lane's subject, plus the one thing nothing else covers: the starter booting in a
      # browser against its own dev server and moving when a key is pressed.
      # Both legs, not just the one that scaffolds. `verify:golden-path` runs through
      # `create-threenative/src/config.ts`, which imports `@threenative/assets` — resolved by pnpm
      # into `packages/assets/dist`. Gate this on the template and the platformer leg dies on
      # ERR_MODULE_NOT_FOUND before the verifier reaches its first step, which is what run
      # 33697267947 did. The scaffold below stays starter-only; the compiled workspace does not.
      - name: Take the packed workspace from build
        if: steps.proof.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: workspace-packages
      - name: Scaffold the starter the HUD smoke drives
        if: matrix.template == 'starter' && steps.proof.outputs.cache-hit != 'true'
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ github.workspace }}/artifacts/workspace-packages
          specs-file: ${{ github.workspace }}/artifacts/workspace-packages/specs
          target: ${{ runner.temp }}/threenative-starter
          template: starter
      - name: Install the scaffolded starter
        if: matrix.template == 'starter' && steps.proof.outputs.cache-hit != 'true'
        run: pnpm --dir "$RUNNER_TEMP/threenative-starter" install
      - uses: ./.github/actions/playwright-chromium
        if: steps.proof.outputs.cache-hit != 'true'
      - name: Drive the starter's interactive HUD smoke
        if: matrix.template == 'starter' && steps.proof.outputs.cache-hit != 'true'
        run: |
          target="$RUNNER_TEMP/threenative-starter"
          pnpm --dir "$target" dev --host 127.0.0.1 --port 4175 > "$RUNNER_TEMP/threenative-starter.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4175/ >/dev/null && break; sleep 1; done
          SCAFFOLD_URL=http://127.0.0.1:4175 node --input-type=module - <<'NODE'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({
            args: ["--disable-gpu-sandbox", "--ignore-gpu-blocklist"],
          });
          const page = await browser.newPage();
          const errors = [];
          page.on("pageerror", (error) => errors.push(error.message));
          await page.goto(process.env.SCAFFOLD_URL);
          await page.waitForSelector("canvas");
          // The starter boots straight into the game. It used to open on a main menu that asked for
          // a character name, and this smoke typed one in; that menu is gone, so waiting for it hung
          // for 30 s and failed the lane. Wait for the game's own HUD instead — which is also the
          // assertion that it really booted, rather than that a form was filled in.
          await page.waitForFunction(() => document.body.innerText.includes("POSITION"), undefined, {
            timeout: 60_000,
          });
          await page.keyboard.down("ArrowRight");
          await page.waitForTimeout(3_000);
          await page.keyboard.up("ArrowRight");
          const text = await page.locator("body").innerText();
          const position = Number(text.match(/POSITION\n(-?\d+)/)?.[1]);
          if (!Number.isFinite(position) || Math.abs(position) < 1 || errors.length > 0) {
            throw new Error(`Scaffold smoke failed: ${JSON.stringify({ text, errors })}`);
          }
          await browser.close();
          NODE
      # `build` already compiled this workspace and packed every tarball from this commit, and the
      # step above downloaded them. Without this the verifier packs the whole set a second time —
      # the workspace `tsc` plus ten `pnpm pack` runs — inside the job that sets the run's critical
      # path. Measured on run 33710335121: `verify:golden-path` 425s of a 472s job, behind `build`
      # at 98s. Unset on a developer machine, so `pnpm verify:golden-path` still packs its own.
      - run: pnpm verify:golden-path
        if: steps.proof.outputs.cache-hit != 'true'
        env:
          TN_GOLDEN_PATH_ARCHIVES: ${{ github.workspace }}/artifacts/workspace-packages
          # The `test` layer proves a stranger's `pnpm test` reaches a running scene and comes
          # back green. It does not have to prove every scenario in the template passes:
          # `template-nonvisual` runs this identical list — same `non-visual-scenarios.mjs`
          # classifier, same `threenative-playtest` runner, same flags — for all eight templates,
          # in a job beside this one. On run 33712230560 the whole sweep took 353s of a 375s step
          # on the run's critical path and proved nothing the run did not already know. The layer
          # prints which scenarios it drove and which it left to the other lane.
          TN_GOLDEN_PATH_SCENARIOS: "1"
      - name: Record the proof for this tree
        if: success() && steps.proof.outputs.cache-hit != 'true'
        run: |
          mkdir -p .golden-path-proof
          echo "$GITHUB_SHA" > .golden-path-proof/commit
      # cache/save rather than the combined action on purpose: the combined action's post step
      # writes the entry whatever the job did, which would record a proof for a run that failed.
      # `if: success()` is the whole safety property here.
      - name: Save the proof for this tree
        if: success() && steps.proof.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .golden-path-proof
          key: golden-path-proof-${{ matrix.template }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/**', 'scripts/**', '.github/**') }}

  template-nonvisual:
    # Ran only on push/schedule until 2026-09-01 (owner call): every template now proves itself
    # non-visually on every PR too, so a template regression is reported by the PR that caused it
    # instead of by the merge that shipped it. `golden-path` above still owns the visual proof.
    needs: build
    # One leg per template was one leg per *unit of naming*, not per unit of work: on run
    # 33734775193 `minimal` finished in 80s and `platformer` took 407s, and the run is only ever as
    # fast as its slowest leg. Timestamping platformer's step splits it as ~74s of scaffold install
    # and typecheck plus 15 scenarios at ~20s each, so the scenarios are what makes it long and
    # they shard cleanly. Platformer and starter run in thirds. Puzzle was measured at 399s of
    # scenario work on run 33843502361 (carry 134s, swing 255s), so it runs in two halves as well;
    # every other template is already well under the leg it would be sharded against, and splitting
    # them would buy nothing and pay the 74s setup twice.
    #
    # Every scenario still runs. `shard` selects a slice of the same classifier output the whole
    # lane has always used, and the step fails closed if the slices do not add back up to the list.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { template: action-rpg, shard: "1/1" }
          - { template: defense, shard: "1/1" }
          - { template: minimal, shard: "1/1" }
          - { template: platformer, shard: "1/3" }
          - { template: platformer, shard: "2/3" }
          - { template: platformer, shard: "3/3" }
          - { template: puzzle, shard: "1/2" }
          - { template: puzzle, shard: "2/2" }
          - { template: racing, shard: "1/1" }
          - { template: runner, shard: "1/1" }
          - { template: sailing, shard: "1/1" }
          - { template: shooter, shard: "1/1" }
          - { template: starter, shard: "1/3" }
          - { template: starter, shard: "2/3" }
          - { template: starter, shard: "3/3" }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TN_PLAYTEST_ALLOW_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          # The store this job needs is not the repository's. It scaffolds a generated project and
          # installs *its* dependencies, and on run 33753945433 every template leg reported
          # `resolved 492, reused 192, downloaded 170` — a third of the tree fetched from the
          # network, ten legs over, because the store cache is keyed on the workspace lockfile
          # alone and the templates pin their own. Naming the template manifests in the key makes
          # the saved store the one these jobs actually draw from.
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/create-threenative/templates/*/package.json
      - run: pnpm install --frozen-lockfile
      # Packed once by `build`. See the note there.
      - name: Take the packed workspace from build
        uses: actions/download-artifact@v4
        with:
          name: workspace-packages
      - name: Scaffold the template from local tarballs
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ github.workspace }}/artifacts/workspace-packages
          specs-file: ${{ github.workspace }}/artifacts/workspace-packages/specs
          target: ${{ runner.temp }}/threenative-${{ matrix.template }}
          template: ${{ matrix.template }}
      - uses: ./.github/actions/playwright-chromium
      - name: Run the template's GPU-free scenarios
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/threenative-${{ matrix.template }}"
          pnpm --dir "$target" install
          pnpm --dir "$target" run typecheck
          scenario_list=$(node "$GITHUB_WORKSPACE/scripts/non-visual-scenarios.mjs" "$target")
          mapfile -t scenarios <<< "$scenario_list"
          test "${#scenarios[@]}" -gt 0
          # The classifier's order is stable, so a round-robin slice is deterministic and every
          # scenario belongs to exactly one shard. Round-robin rather than a contiguous block
          # because the expensive scenarios are not evenly distributed through the list.
          index="${SHARD%/*}"
          count="${SHARD#*/}"
          test "$index" -ge 1 && test "$index" -le "$count"
          mine=()
          for position in "${!scenarios[@]}"; do
            if [ "$(( position % count + 1 ))" -eq "$index" ]; then mine+=("${scenarios[$position]}"); fi
          done
          # A shard that selected nothing is a lane reporting green on an empty set, which is the
          # one thing this must never do.
          test "${#mine[@]}" -gt 0
          echo "shard $SHARD of ${{ matrix.template }}: ${#mine[@]} of ${#scenarios[@]} scenarios"
          scenario_args=()
          for scenario in "${mine[@]}"; do scenario_args+=(--scenario "$scenario"); done
          pnpm --dir "$target" exec threenative-playtest "${scenario_args[@]}" \
            --browser-recipe webgpu --headed --no-screenshots \
            --server-command "pnpm dev --host 127.0.0.1 --port \$PORT --strictPort"
        env:
          SHARD: ${{ matrix.shard }}

  # `golden-path` is a required status check in the `main protection` ruleset, and required checks
  # match the reported context by exact string. A matrix job does not report its own name — it
  # reports `golden-path (starter)` and `golden-path (platformer)` — so the moment this lane became
  # a matrix, the context the ruleset waits for stopped existing and every PR would sit on
  # "Expected — waiting for status to be reported" forever.
  #
  # This job is that context. It runs no work; it reads the matrix result and fails when any leg
  # failed. `if: always()` matters: without it a failed matrix leaves this skipped, and a skipped
  # required check counts as satisfied, which would turn the ruleset into decoration. Adding a
  # template to the matrix above needs no ruleset change, which is the point of the indirection.
  golden-path:
    needs: golden-path-template
    # `!cancelled()` rather than `always()`. Both run this job when a matrix leg fails, which is the
    # point. `always()` also runs it when the whole run was cancelled — a superseding push, someone
    # hitting the button — where the matrix result is `cancelled`, this job reported *failure*, and
    # its own cancel step fired on a run already dying. Run 33468531605 is that: every leg cancelled
    # by the next push, and `golden-path` the only red check on the board. A cancelled run must read
    # as cancelled, so the skip is correct there; it still cannot be mistaken for a pass, because a
    # cancelled run has no passing checks to merge on.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every golden-path template to have passed
        run: |
          set -euo pipefail
          result='${{ needs.golden-path-template.result }}'
          echo "golden-path templates: $result"
          test "$result" = "success"

  benchmark:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
      - run: pnpm tsx scripts/count-loc.ts --check
      - run: pnpm --filter abyss-vanilla build
      - run: pnpm --filter abyss-framework build
      - run: pnpm exec vitest run scripts/__tests__/count-loc.spec.ts scripts/__tests__/score-blind.spec.ts
      - uses: ./.github/actions/playwright-chromium
      # `test:browser` is the test-browser job's gate; running it again here bought nothing but
      # a second copy of the slowest step in the workflow.
      - run: pnpm exec playwright test --config=benchmark.playwright.config.ts

  # visuals is NOT a job here any more. It captures frames from a WebGPU canvas, and this runner
  # has no GPU — its first execution in the repository's history failed on
  #   page.screenshot: Timeout 30000ms exceeded
  #     - taking page screenshot
  # which is the documented behaviour: a software rasteriser does not composite a WebGPU canvas
  # for `page.screenshot`. No timeout fixes that; the lane needs hardware.
  #
  # It never ran before because it declared `needs: golden-path`, and golden-path had never
  # passed. That is the third gate this session that was hiding behind a permanently red one —
  # after native-platforms and the visuals build step itself — and each was broken the whole time.
  #
  # Run it where there is a GPU: `pnpm visuals` locally, or `pnpm ci:local visuals`. The look is
  # the thing no automated gate on this runner can judge anyway, which the templates' own
  # AGENTS.md says in as many words: every gate here is blind to how the game looks.

  # Building the workspace and checking the entity-registry boundary needs neither the native host
  # nor a browser, so it is a gate the scaffold and benchmark lanes can wait on instead of waiting
  # ~15 minutes behind the native suite.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
      - run: pnpm --filter abyss-framework build
      - name: Enforce entity registry boundaries
        run: pnpm exec tsx scripts/check-core-boundary.ts
      # Ten jobs downstream scaffold a template from packed workspace tarballs, and every one of
      # them used to build the workspace and run `pnpm pack` itself: ~70s each, ten times, for
      # byte-identical archives from one commit (run 33690597861, step "Pack local framework
      # packages", 55-72s per leg). This job has already compiled the workspace by the line above,
      # so it packs once and the legs download the result. The specs file travels with the
      # archives because it names them; deriving it again on the other side would be a second
      # source of truth for which packages exist.
      - name: Pack the workspace once for every lane that scaffolds from tarballs
        run: |
          set -euo pipefail
          mkdir -p artifacts/workspace-packages
          pnpm tsx scripts/workspace-packages.ts --archives > artifacts/workspace-packages/specs
          while IFS=$'\t' read -r package_name archive_prefix; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" pack --pack-destination artifacts/workspace-packages
          done < artifacts/workspace-packages/specs
      # Every `packages/*/dist` rides along, not just the CLI's. The scaffold action runs
      # `create-threenative` from `dist/index.js`, and that file imports `@threenative/assets`,
      # which pnpm resolves through a workspace symlink to `packages/assets/dist/index.js`. Ship
      # only the CLI's own output and the first scaffold dies on ERR_MODULE_NOT_FOUND for a
      # sibling it never mentions. 4.3 MB for the set. One day of retention: nothing outside this
      # run ever reads these.
      - name: Publish the packed workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-packages
          path: |
            artifacts/workspace-packages
            packages/*/dist
          retention-days: 1
          if-no-files-found: error

  budgets:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check-capability-docs resolves every documented capability through its package export
      # map, and those maps point at dist. Without this the gate fails closed on the build it
      # needs rather than on a capability, naming a missing packages/assets/dist/index.js:
      #   CAPABILITY_BUILT_IMPORT_MISSING: @threenative/assets#compileAssets could not resolve
      #   from the package export map
      # `needs: build` orders this job behind the build but hands it no artifact, so the ordering
      # reads like a guarantee it does not make. The shared action is what actually supplies dist.
      - uses: ./.github/actions/workspace-dist
      - run: pnpm budgets
      - run: pnpm quality
      - run: pnpm sync:agents --check

  # The native lane guards targets that any package change can break. native-platforms is NOT
  # called from here — its own file triggers on pushes to main, pull requests, and the nightly
  # cron, and since 2026-09-01 every leg of it runs on every one of those events (owner call:
  # a leg that is skipped on the branch where the work happens is a leg nobody is watching).
  #
  # Why: it has never passed. It ran only on main behind `needs: test`, and `test` was red on every
  # run before 2026-08-31, so it was skipped every single time until the day `test` went green — then
  # failed on all five legs, twice. Nothing broke it; fixing the jobs in front of it revealed it. A
  # gate behind a permanently red gate is not a gate.
  #
  # What it covers — macOS, Windows, Android and iOS contract tests — is not what this version
  # claims. ROADMAP.md licenses browser, Linux desktop and the Android emulator with qualifications
  # and claims nothing for iOS hardware, so a never-green lane over unclaimed platforms cannot be
  # what blocks the release. `native:build` succeeds on those runners; it is `native:verify:desktop`
  # that fails, and the release builds artifacts rather than running that.
  #
  # `continue-on-error` would have been the smaller change and GitHub does not allow it on a job
  # that calls a reusable workflow — that attempt is what produced "This run likely failed because
  # of a workflow file issue" on 33366316333.
  #
  # This is not permission to ignore it. The failures are filed in
  # docs/PRDs/native/PRD-295-the-native-platform-lane-has-never-been-green.md, which requires the
  # call to come back here in the same commit that fixes them.
  supply-chain:
    # PR-only until 2026-09-01 (owner call): a push to main skipped the whole job, so the board
    # read a skip where the secrets scan should have been. Pushes now scan the repository's full
    # git history — gitleaks' default git mode — which is strictly stronger than the incremental
    # PR range and immune to force-push SHAs the checkout may not have.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the PR commit range is present
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range="$BASE_SHA..$HEAD_SHA"
          test "$(git rev-list --count "$range")" -gt 0
          echo "TN_GITLEAKS_RANGE=$range" >> "$GITHUB_ENV"
      - name: Scan PR commits for leaked secrets
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --verbose
          --gitleaks-ignore-path /repo/.gitleaksignore
          --log-opts="$TN_GITLEAKS_RANGE"
          /repo
      - name: Scan the full git history for leaked secrets
        if: github.event_name == 'push'
        run: >-
          docker run --rm
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --verbose
          --gitleaks-ignore-path /repo/.gitleaksignore
          /repo
      # dependency-review diffs a base ref against a head ref, and only a pull_request /
      # pull_request_target / merge_group event supplies them. This job stopped being PR-only on
      # 2026-09-01 (#39) so gitleaks could scan the full history on main, and every step added
      # then was guarded by event — except this one. Ungated it has errored on every push to main
      # since, with "Both a base ref and head ref must be provided", which is why main has not
      # reported a green supply-chain in three days. The secrets scan runs on both events; the
      # dependency diff cannot.
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate

  # PRD-296 item 3. Three gates once sat behind a permanently red one and were skipped on every
  # run this repository had ever produced; nobody had seen any of them fail because nobody had
  # seen them run. The board looked like nine jobs of coverage and was six.
  #
  # A skipped job is invisible on the checks list in a way a red one is not — and the `main
  # protection` ruleset makes that worse rather than better, because a skipped required check
  # counts as satisfied. This job writes the verdicts into the run summary, names every job that
  # did not run, and names the upstream that stopped it.
  #
  # It is the one job that may legitimately declare `needs:` on coverage jobs: publishing their
  # verdict is its entire work, and `scripts/__tests__/ci-needs.spec.ts` recognises exactly that
  # exemption through `toJSON(needs)`. It reports and never gates, so it is not a required check
  # and cannot itself become something to route around.
  run-summary:
    needs:
      - typecheck
      - lint
      - test
      - test-unit
      - test-native
      - test-browser
      - test-playtest
      - golden-path-template
      - template-nonvisual
      - golden-path
      - benchmark
      - build
      - budgets
      - supply-chain
    # `!cancelled()` and not `always()`, for the reason golden-path gives above: a cancelled run
    # has nothing to report and its summary would only describe the cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report every job's verdict, and why a skipped one never ran
        env:
          # `toJSON(needs)` is every upstream result at once. Passed through a file rather than an
          # argument: it is multi-line JSON, and an expression interpolated into a `run:` line is
          # shell source.
          TN_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$TN_CI_NEEDS" > "$RUNNER_TEMP/needs.json"
          pnpm tsx scripts/ci-run-summary.ts \
            --workflow .github/workflows/ci.yml \
            --results "$RUNNER_TEMP/needs.json" \
            --reporter run-summary | tee -a "$GITHUB_STEP_SUMMARY"
