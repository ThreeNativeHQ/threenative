name: CI

on:
  push:
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages consumed through export maps
        run: |
          pnpm --filter @threenative/playtest build
          pnpm --filter @threenative/core build
          pnpm --filter @threenative/physics build
          pnpm --filter @threenative/ui build
          pnpm --filter create-threenative build
      - run: pnpm typecheck

  lint:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm check:docs
      - run: sh scripts/xvfb.sh pnpm test:browser
      - run: pnpm test:playtest

  golden-path:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-threenative build
      - name: Pack local framework packages
        run: |
          mkdir -p "$RUNNER_TEMP/threenative-packages"
          pnpm --filter @threenative/playtest build
          pnpm --filter @threenative/core build
          pnpm --filter @threenative/physics build
          pnpm --filter @threenative/ui build
          pnpm --filter @threenative/core pack --pack-destination "$RUNNER_TEMP/threenative-packages"
          pnpm --filter @threenative/physics pack --pack-destination "$RUNNER_TEMP/threenative-packages"
          pnpm --filter @threenative/playtest pack --pack-destination "$RUNNER_TEMP/threenative-packages"
          pnpm --filter @threenative/ui pack --pack-destination "$RUNNER_TEMP/threenative-packages"
          pnpm --filter @threenative/runtime-native pack --pack-destination "$RUNNER_TEMP/threenative-packages"
          pnpm --filter create-threenative pack --pack-destination "$RUNNER_TEMP/threenative-packages"
      - name: Generate starter scaffold
        run: |
          target="$RUNNER_TEMP/threenative-starter"
          core_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-core-*.tgz' -print -quit)
          physics_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-physics-*.tgz' -print -quit)
          playtest_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-playtest-*.tgz' -print -quit)
          ui_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-ui-*.tgz' -print -quit)
          runtime_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-runtime-native-*.tgz' -print -quit)
          cli_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'create-threenative-*.tgz' -print -quit)
          node packages/create-threenative/dist/index.js "$target" --template starter --no-install \
            --core-package "$core_package" --physics-package "$physics_package" \
            --playtest-package "$playtest_package" --ui-package "$ui_package" \
            --runtime-native-package "$runtime_package" --cli-package "$cli_package"
          pnpm --dir "$target" install
          MCP_TARGET="$target" node --input-type=module - <<'NODE'
          import { spawn } from "node:child_process";
          import { readFile } from "node:fs/promises";

          const target = process.env.MCP_TARGET;
          const { mcpServers } = JSON.parse(await readFile(`${target}/.mcp.json`, "utf8"));
          const surfaces = [
            ["threenative-assets", "asset-mcp-tools.json"],
            ["threenative-sculpt", "sculpt-mcp-tools.json"],
          ];

          async function probe(serverName, surfaceFile) {
            const surface = JSON.parse(
              await readFile(`packages/create-threenative/${surfaceFile}`, "utf8"),
            );
            const server = mcpServers[serverName];
            if (!server) throw new Error(`Generated project is missing MCP server ${serverName}`);
            const child = spawn(server.command, server.args, {
              cwd: target,
              stdio: ["pipe", "pipe", "inherit"],
            });
            let buffer = "";
            let nextId = 1;
            const pending = new Map();
            child.stdout.on("data", (chunk) => {
              buffer += chunk.toString();
              const lines = buffer.split("\n");
              buffer = lines.pop() ?? "";
              for (const line of lines) {
                if (!line.trim().startsWith("{")) continue;
                let message;
                try {
                  message = JSON.parse(line);
                } catch {
                  continue;
                }
                const waiter = pending.get(message.id);
                if (waiter) {
                  pending.delete(message.id);
                  clearTimeout(waiter.timer);
                  message.error ? waiter.reject(new Error(JSON.stringify(message.error))) : waiter.resolve(message.result);
                }
              }
            });
            const exited = new Promise((_, reject) => {
              child.once("error", reject);
              child.once("exit", (code) => reject(new Error(`${serverName} exited early (${code})`)));
            });
            const request = (method, params = {}) => {
              const id = nextId++;
              const response = new Promise((resolve, reject) => {
                const timer = setTimeout(() => {
                  pending.delete(id);
                  reject(new Error(`${serverName} ${method} timed out; saw ${buffer.slice(0, 500)}`));
                }, 30_000);
                pending.set(id, { resolve, reject, timer });
              });
              child.stdin.write(`${JSON.stringify({ jsonrpc: "2.0", id, method, params })}\n`);
              return Promise.race([response, exited]);
            };
            try {
              await request("initialize", {
                protocolVersion: "2025-06-18",
                capabilities: {},
                clientInfo: { name: "scaffold-smoke", version: "0" },
              });
              child.stdin.write(`${JSON.stringify({ jsonrpc: "2.0", method: "notifications/initialized" })}\n`);
              const listed = await request("tools/list");
              const names = listed.tools.map((tool) => tool.name).sort();
              const expected = [...surface.tools].sort();
              if (JSON.stringify(names) !== JSON.stringify(expected)) {
                throw new Error(
                  `${serverName} surface drifted.\nexpected ${expected.length}: ${expected.join(", ")}\nactual ${names.length}: ${names.join(", ")}`,
                );
              }
              if (serverName === "threenative-sculpt") {
                const listedResources = await request("resources/list");
                if (!listedResources.resources?.length)
                  throw new Error("Sculpt MCP listed no technique resources");
                for (const resource of listedResources.resources) {
                  const read = await request("resources/read", { uri: resource.uri });
                  const text = read.contents?.map((content) => content.text ?? "").join("\n") ?? "";
                  const concreteBlock = /```(?:glsl|wgsl|(?:java|type)script|[jt]s)\b[\s\S]*?(?:ShaderMaterial|onBeforeCompile|diffuseColor|gl_FragColor|new\s+Mesh(?:Standard|Physical|Phong|Basic|Lambert|Toon)Material)/u;
                  if (concreteBlock.test(text))
                    throw new Error(`Sculpt grimoire resource owns the look: ${resource.uri}`);
                }
              }
              console.log(`${serverName} ok: ${names.length} tools from ${surface.version}`);
            } finally {
              child.kill();
            }
          }

          for (const [serverName, surfaceFile] of surfaces) await probe(serverName, surfaceFile);
          NODE
          pnpm exec playwright install --with-deps chromium
          pnpm --dir "$target" test
          # `pnpm --dir "$target" test` above boots this project and asserts its portable HUD
          # reported a live glyph count, so the HUD proof is an observation, not this check.
          test -f "$target/src/render/lighting.ts"
          test -f "$target/src/render/hud.ts"
          ! grep -R "@threenative/" "$target/src/render"
          ! grep -R "catalog:" "$target/package.json"
          pnpm --dir "$target" dev --host 127.0.0.1 --port 4175 > "$RUNNER_TEMP/threenative-starter.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4175/ >/dev/null && break; sleep 1; done
          SCAFFOLD_URL=http://127.0.0.1:4175 node --input-type=module - <<'NODE'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({
            args: ["--disable-gpu-sandbox", "--ignore-gpu-blocklist"],
          });
          const page = await browser.newPage();
          const errors = [];
          page.on("pageerror", (error) => errors.push(error.message));
          await page.goto(process.env.SCAFFOLD_URL);
          await page.waitForSelector("canvas");
          await page.keyboard.down("ArrowRight");
          await page.waitForTimeout(3_000);
          await page.keyboard.up("ArrowRight");
          const text = await page.locator("body").innerText();
          const position = Number(text.match(/POSITION\n(-?\d+)/)?.[1]);
          if (!Number.isFinite(position) || Math.abs(position) < 1 || errors.length > 0) {
            throw new Error(`Scaffold smoke failed: ${JSON.stringify({ text, errors })}`);
          }
          await browser.close();
          NODE
      - name: Generate platformer scaffold
        run: |
          target="$RUNNER_TEMP/threenative-platformer"
          core_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-core-*.tgz' -print -quit)
          physics_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-physics-*.tgz' -print -quit)
          playtest_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-playtest-*.tgz' -print -quit)
          ui_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-ui-*.tgz' -print -quit)
          runtime_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'threenative-runtime-native-*.tgz' -print -quit)
          cli_package=$(find "$RUNNER_TEMP/threenative-packages" -name 'create-threenative-*.tgz' -print -quit)
          node packages/create-threenative/dist/index.js "$target" --template platformer --no-install \
            --core-package "$core_package" --physics-package "$physics_package" \
            --playtest-package "$playtest_package" --ui-package "$ui_package" \
            --runtime-native-package "$runtime_package" --cli-package "$cli_package"
          pnpm --dir "$target" install
          pnpm exec playwright install chromium
          sh scripts/xvfb.sh pnpm --dir "$target" test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:golden-path

  benchmark:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build framework packages consumed through export maps
        run: |
          pnpm --filter @threenative/playtest build
          pnpm --filter @threenative/core build
          pnpm --filter @threenative/physics build
          pnpm --filter @threenative/ui build
      - run: pnpm tsx scripts/count-loc.ts --check
      - run: pnpm --filter abyss-vanilla build
      - run: pnpm --filter abyss-framework build
      - run: pnpm exec vitest run scripts/__tests__/count-loc.spec.ts scripts/__tests__/score-blind.spec.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: sh scripts/xvfb.sh pnpm test:browser
      - run: pnpm exec playwright test --config=benchmark.playwright.config.ts

  visuals:
    needs: golden-path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm visuals

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Enforce entity registry boundaries
        run: |
          test "$(wc -l < packages/core/src/entities.ts)" -lt 80
          ! rg -n '\b(archetype|createQuery|defineComponent|System|Component)\b' packages/core/src
          ! rg -n 'DebugOverlay|__THREENATIVE__' examples/abyss-framework/dist

  budgets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm budgets
      - run: pnpm quality
      - run: pnpm sync:agents --check

  # The native lane guards targets that any package change can break, so it is
  # gated on the event rather than on paths — see native-platforms.yml. It costs
  # ~24 minutes on free public-repo runners, so it runs where it is the merge
  # gate (PRs into main, and main itself) and not on every feature-branch push.
  # `needs: test` keeps it from burning that time behind a red unit suite.
  native-platforms:
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    uses: ./.github/workflows/native-platforms.yml
