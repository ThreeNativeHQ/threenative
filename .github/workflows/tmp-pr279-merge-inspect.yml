name: tmp-pr279-merge-inspect

on:
  push:
    branches:
      - fix/dev-release

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/dev-release
      - name: Inspect merge conflicts against develop
        shell: bash
        run: |
          set -u
          git config user.name "ThreeNative PR Watch"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin develop
          set +e
          git merge --no-commit --no-ff origin/develop
          status=$?
          set -e
          echo "MERGE_STATUS=$status"
          echo "CONFLICT_FILES_BEGIN"
          git diff --name-only --diff-filter=U || true
          echo "CONFLICT_FILES_END"
          if [ "$status" -ne 0 ]; then
            for f in $(git diff --name-only --diff-filter=U); do
              echo "===== $f ====="
              git diff --cc -- "$f" || true
            done
          fi
          git merge --abort >/dev/null 2>&1 || true
          exit 0
