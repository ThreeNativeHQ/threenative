name: PRD-373 cold-checkout validation
on:
  push:
    branches: [verify/prd-373-cold-instructions]
permissions:
  contents: read
env:
  CANDIDATE_TREE: fa7287f1fc6b7e679824f1c42f93cb82b221cbf6
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 32e6a3def6382d00a8148d4b021c2f0fb3057d4f
          persist-credentials: false
      - name: Verify exact edits and store only source blobs
        env:
          GH_TOKEN: ${{ github.token }}
          EDITS: 
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          raw = bz2.decompress(base64.b64decode(os.environ['EDITS']))
          assert hashlib.sha256(raw).hexdigest() == 'c94caa8abe51102b3e93c9358217fdd4bc4790b9f4d2eae383432efc6633f093'
          spec = json.loads(raw)
          assert spec['base'] == '32e6a3def6382d00a8148d4b021c2f0fb3057d4f'
          assert spec['tree'] == os.environ['CANDIDATE_TREE']
          entries = []
          for entry in spec['entries']:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] != '.git'
              before = path.read_bytes()
              assert hashlib.sha256(before).hexdigest() == entry['before'], str(path)
              lines = before.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              path.write_text(''.join(lines))
              path.chmod(int(entry['mode'][-3:], 8))
              subprocess.run(['git', 'add', '--', str(path)], check=True)
              sha = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              assert sha == entry['sha'], str(path)
              entries.append({'path': str(path), 'mode': entry['mode'], 'type': 'blob', 'sha': sha})
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == spec['tree']
          directory = Path(os.environ['RUNNER_TEMP']) / 'candidate'
          directory.mkdir()
          patch = subprocess.check_output(['git', 'diff', '--cached', '--binary'])
          (directory / 'candidate.patch').write_bytes(patch)
          manifest = {'base': spec['base'], 'tree': spec['tree'], 'entries': entries, 'patch_sha256': hashlib.sha256(patch).hexdigest()}
          (directory / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          for entry in entries:
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', data=json.dumps({'content': Path(entry['path']).read_text(), 'encoding': 'utf-8'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  assert json.load(response)['sha'] == entry['sha']
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TN_SUITE_EXCLUDE_PACKAGES: '@threenative/runtime-native'
      TN_ORPHAN_SETTLE_SECONDS: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 32e6a3def6382d00a8148d4b021c2f0fb3057d4f
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cold-candidate
          path: ${{ runner.temp }}/candidate
      - name: Apply only the exact validated source
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'candidate'
          manifest = json.loads((directory / 'manifest.json').read_text())
          patch = directory / 'candidate.patch'
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == manifest['patch_sha256']
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == os.environ['CANDIDATE_TREE']
          PY
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare cold instruction dependencies before importing contract tests
        uses: ./.github/actions/workspace-dist
      - name: Run 279 focused contract and regression tests
        run: pnpm exec vitest run scripts/__tests__/ci-efficiency.spec.ts scripts/__tests__/ci-structure.spec.ts scripts/__tests__/ci-needs.spec.ts scripts/__tests__/ci-fast.spec.ts scripts/__tests__/ci-local.spec.ts scripts/__tests__/release-candidate-gate.spec.ts scripts/__tests__/release.spec.ts scripts/__tests__/prepare-release.spec.ts scripts/__tests__/verify-native-release-commit.spec.ts scripts/__tests__/instruction-budget.spec.ts scripts/__tests__/primary-docs.spec.ts scripts/__tests__/check-template-conventions.spec.ts scripts/__tests__/check-template-quality.spec.ts packages/playtest/__tests__/doc-drift.spec.ts packages/core/__tests__/constraints.spec.ts
      - uses: ./.github/actions/playwright-chromium
        if: ${{ !cancelled() }}
      - name: Verify website types, build, units and actual browser behavior
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          pnpm --filter threenative-site typecheck
          pnpm --filter threenative-site build
          pnpm --filter threenative-site exec vitest run
          pnpm --filter threenative-site exec playwright test --config=playwright.config.ts
      - name: Typecheck, lint and documentation
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm lint
          pnpm check:docs
          pnpm sync:agents --check
      - name: Run the real JS CI suite with Chromium installed
        if: ${{ !cancelled() }}
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-verification-evidence
          path: |
            artifacts/gates
            site/test-results
            site/playwright-report
          retention-days: 7
