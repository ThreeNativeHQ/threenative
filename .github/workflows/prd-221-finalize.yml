name: PRD-221 final candidate application
# Temporary task-branch-only preparation; removed from the PR diff.
on:
  push:
    branches: [codex/prd-221-android-v8-16kb]
    paths: [.github/workflows/prd-221-finalize.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.commit.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply the fixed checksum-verified local candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/prd221-evidence/apply.log"
          import pathlib, textwrap
          source = pathlib.Path('.github/workflows/prd-221-investigation.yml').read_text()
          code = textwrap.dedent(source.split("python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0])
          exec(compile(code, '<guarded-candidate>', 'exec'))
          print('Input hashes matched and exact local candidate applied. The evidence doc records 80 locally executed tests; this job does not claim a hosted unit-test pass.')
          PY
          git diff --check
          node --check packages/runtime-native/scripts/download-deps.mjs
          node --check packages/runtime-native/scripts/build-android-v8.mjs
      - id: commit
        name: Commit the five candidate files to the task branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/runtime-native/scripts/download-deps.mjs packages/runtime-native/scripts/build-android-v8.mjs packages/runtime-native/android/app/build.gradle.kts packages/runtime-native/tests/android-16kb-alignment.test.mjs docs/verification/prd-221-readiness-phase-1-2026-09-10.md
          git diff --cached --check
          git commit -m 'fix(android): provision pinned 16 KB V8 source candidates and validate staging' -m 'PRD-221 phase 1 preparation. Observed red controls and 80 locally passing focused tests are retained in the evidence record. Native qualification, final APK gates and 16 KB gameplay remain pending.'
          git push origin HEAD:refs/heads/codex/prd-221-android-v8-16kb
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/prd221-evidence/source-sha.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prd221-candidate-application-${{ github.sha }}
          path: ${{ runner.temp }}/prd221-evidence
          retention-days: 2
  source-probe:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.candidate }}
          persist-credentials: false
      - name: Retry default V8 through the existing dependency provisioner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          node packages/runtime-native/scripts/download-deps.mjs --android --only v8-android 2>&1 | tee "$RUNNER_TEMP/prd221-evidence/build.log"
      - name: Retain candidate identity and any verified or partial payload
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/prd221-evidence/source-sha.txt"
          if test -d packages/runtime-native/third_party/v8-android; then
            tar -czf "$RUNNER_TEMP/prd221-evidence/v8-android.tar.gz" -C packages/runtime-native/third_party v8-android
          fi
          for partial in packages/runtime-native/third_party/.v8-source-*/payload; do
            if test -d "$partial"; then
              tar -czf "$RUNNER_TEMP/prd221-evidence/unqualified-partial-payload.tar.gz" -C "$partial" .
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prd221-owned-v8-${{ needs.apply.outputs.candidate }}
          path: ${{ runner.temp }}/prd221-evidence
          if-no-files-found: error
          retention-days: 2
