name: PRD-221 isolated baseline investigation

# Temporary, branch-only investigation. Removed before the implementation PR.
on:
  push:
    branches: [codex/prd-221-android-v8-16kb]
    paths: [.github/workflows/prd-221-investigation.yml]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Retain tracked source and isolated test tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221"
          git rev-parse HEAD > "$RUNNER_TEMP/prd221/source-sha.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/prd221/source.tar.gz" HEAD
          npm install --prefix "$RUNNER_TEMP/prd221-tools" --ignore-scripts --no-audit --no-fund vitest@4.1.10 esbuild@0.27.0 typescript@5.9.3
          tar -czf "$RUNNER_TEMP/prd221/test-tools.tar.gz" -C "$RUNNER_TEMP/prd221-tools" .
      - name: Retry historical V8 provisioning and source prerequisites
        run: |
          set -uo pipefail
          node packages/runtime-native/scripts/download-deps.mjs --android --only v8-android > "$RUNNER_TEMP/prd221/provision.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/prd221/provision.exit"
          cat "$RUNNER_TEMP/prd221/provision.log"
          git ls-remote https://chromium.googlesource.com/v8/v8.git HEAD > "$RUNNER_TEMP/prd221/v8-source.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/prd221/v8-source.exit"
          git ls-remote https://chromium.googlesource.com/chromium/tools/depot_tools.git HEAD > "$RUNNER_TEMP/prd221/depot-tools.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/prd221/depot-tools.exit"
          if test -d packages/runtime-native/third_party/v8-android; then
            tar -czf "$RUNNER_TEMP/prd221/historical-v8.tar.gz" -C packages/runtime-native/third_party v8-android
          fi
          command -v java git python3 clang ninja || true
          printf 'ANDROID_HOME=%s\n' "${ANDROID_HOME:-}" > "$RUNNER_TEMP/prd221/toolchains.txt"
          ls "${ANDROID_HOME:-/nonexistent}/ndk" >> "$RUNNER_TEMP/prd221/toolchains.txt" 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prd221-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/prd221
          if-no-files-found: error
          retention-days: 2
