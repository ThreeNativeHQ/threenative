name: PRD-221 isolated baseline investigation

# Temporary, branch-only experiment. Removed from the final implementation diff.
on:
  push:
    branches: [codex/prd-221-android-v8-16kb]
    paths:
      - .github/workflows/prd-221-investigation.yml
      - packages/runtime-native/scripts/build-android-v8.mjs
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Execute the owned pinned-source provisioner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          node packages/runtime-native/scripts/build-android-v8.mjs 2>&1 | tee "$RUNNER_TEMP/prd221-evidence/build.log"
      - name: Retain outputs and Android ZIP inspection tool
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/prd221-evidence/source-sha.txt"
          if test -d packages/runtime-native/third_party/v8-android; then
            tar -czf "$RUNNER_TEMP/prd221-evidence/v8-android.tar.gz" -C packages/runtime-native/third_party v8-android
          fi
          for partial in packages/runtime-native/third_party/.v8-source-*/payload; do
            if test -d "$partial"; then
              tar -czf "$RUNNER_TEMP/prd221-evidence/unqualified-partial-payload.tar.gz" -C "$partial" .
            fi
          done
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          if test -f "$sdk_tools/zipalign"; then
            tar -czf "$RUNNER_TEMP/prd221-evidence/zipalign-tools.tar.gz" -C "$sdk_tools" zipalign lib64
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prd221-owned-v8-${{ github.sha }}
          path: ${{ runner.temp }}/prd221-evidence
          if-no-files-found: error
          retention-days: 2
