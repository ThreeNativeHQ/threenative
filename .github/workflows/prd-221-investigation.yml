name: PRD-221 source candidate verification

# Branch-only evidence for the owned Android V8 source build. This workflow never edits or pushes.
on:
  push:
    branches: [codex/prd-221-android-v8-16kb]
    paths:
      - .github/workflows/prd-221-investigation.yml
      - packages/runtime-native/scripts/build-android-v8.mjs
      - packages/runtime-native/scripts/download-deps.mjs
      - packages/runtime-native/android/app/build.gradle.kts
      - packages/runtime-native/tests/android-16kb-alignment.test.mjs
      - packages/runtime-native/tests/runtime-next-contract.test.mjs
permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - uses: ./.github/actions/pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the affected runtime-native suites
        working-directory: packages/runtime-native
        run: |
          pnpm exec vitest run --config vitest.config.ts \
            tests/android-16kb-alignment.test.mjs \
            tests/android-packaging.integration.test.mjs \
            tests/native-platform-workflow.test.mjs \
            tests/android-webp-provisioning.test.mjs \
            tests/js-engine-version-skew.test.mjs \
            tests/dawn-android-option.test.mjs \
            tests/download-retry.test.mjs \
            tests/wgpu-version-matrix.test.mjs \
            tests/workflow-dependency-names.test.mjs
      - name: Retain exact candidate identity
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/prd221-evidence/source-sha.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prd221-candidate-tests-${{ github.sha }}
          path: ${{ runner.temp }}/prd221-evidence
          if-no-files-found: error
          retention-days: 2
  source-probe:
    needs: focused-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Retry through the supported dependency provisioner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          node packages/runtime-native/scripts/download-deps.mjs --android --only v8-android 2>&1 | tee "$RUNNER_TEMP/prd221-evidence/build.log"
      - name: Retain exact candidate identity and any verified payload
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/prd221-evidence/source-sha.txt"
          if test -d packages/runtime-native/third_party/v8-android; then
            tar -czf "$RUNNER_TEMP/prd221-evidence/v8-android.tar.gz" -C packages/runtime-native/third_party v8-android
          fi
          for partial in packages/runtime-native/third_party/.v8-source-*/payload; do
            if test -d "$partial"; then
              tar -czf "$RUNNER_TEMP/prd221-evidence/unqualified-partial-payload.tar.gz" -C "$partial" .
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prd221-owned-v8-${{ github.sha }}
          path: ${{ runner.temp }}/prd221-evidence
          if-no-files-found: warn
          retention-days: 2
