name: PRD-221 isolated candidate verification

# Temporary branch-only preparation; removed from the final diff.
on:
  push:
    branches: [codex/prd-221-android-v8-16kb]
    paths: [.github/workflows/prd-221-investigation.yml]
permissions:
  contents: read
jobs:
  apply-tested-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.commit.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Apply the exact guarded local candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/prd-221-android-v8-16kb
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded = ''''''
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'a329cff50eca21c039918364b2c8f1f3faa78218a6efbc972ef91983c9ea5ab2'
          payload = json.loads(data)
          allowed = {
              'packages/runtime-native/scripts/download-deps.mjs',
              'packages/runtime-native/android/app/build.gradle.kts',
              'packages/runtime-native/tests/android-16kb-alignment.test.mjs',
              'packages/runtime-native/scripts/build-android-v8.mjs',
              'docs/verification/prd-221-readiness-phase-1-2026-09-10.md',
          }
          assert set(payload['expected']) | set(payload['write']) == allowed
          for path, expected in payload['expected'].items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, f'Concurrent edit: {path}: {actual} != {expected}'
          for line in payload['patch'].splitlines():
              if line.startswith('+++ b/'):
                  assert line[6:] in allowed
          patch = payload['patch'].encode()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for path, content in payload['write'].items():
              destination = pathlib.Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(content)
          PY
          git diff --check
      - name: Install isolated test tools and rerun the affected suites
        env:
          CI: 'true'
          TERM: xterm
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-tools" "$RUNNER_TEMP/prd221-evidence"
          cd "$RUNNER_TEMP/prd221-tools"
          printf '%s\n' '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund vitest@4.1.10 esbuild@0.27.0 yaml@2.8.1
          ln -s "$RUNNER_TEMP/prd221-tools/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE/packages/runtime-native"
          node "$RUNNER_TEMP/prd221-tools/node_modules/vitest/vitest.mjs" run --config vitest.config.ts tests/android-16kb-alignment.test.mjs tests/android-packaging.integration.test.mjs tests/native-platform-workflow.test.mjs tests/android-webp-provisioning.test.mjs tests/js-engine-version-skew.test.mjs tests/dawn-android-option.test.mjs tests/download-retry.test.mjs tests/wgpu-version-matrix.test.mjs tests/workflow-dependency-names.test.mjs 2>&1 | tee "$RUNNER_TEMP/prd221-evidence/focused.log"
      - id: commit
        name: Commit only the five tested candidate files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/runtime-native/scripts/download-deps.mjs packages/runtime-native/scripts/build-android-v8.mjs packages/runtime-native/android/app/build.gradle.kts packages/runtime-native/tests/android-16kb-alignment.test.mjs docs/verification/prd-221-readiness-phase-1-2026-09-10.md
          git diff --cached --check
          git commit -m 'fix(android): provision pinned 16 KB V8 source candidates and validate staging' -m 'PRD-221 phase 1 preparation. Observed red controls and 80 passing focused tests are retained in the evidence record. Native qualification, final APK gates and 16 KB gameplay remain pending.'
          git push origin HEAD:refs/heads/codex/prd-221-android-v8-16kb
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/prd221-evidence/source-sha.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prd221-candidate-tests-${{ github.sha }}
          path: ${{ runner.temp }}/prd221-evidence
          if-no-files-found: warn
          retention-days: 2
  source-probe:
    needs: apply-tested-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply-tested-candidate.outputs.candidate }}
          persist-credentials: false
      - name: Retry through the existing dependency provisioner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          node packages/runtime-native/scripts/download-deps.mjs --android --only v8-android 2>&1 | tee "$RUNNER_TEMP/prd221-evidence/build.log"
      - name: Retain exact candidate identity and any verified payload
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prd221-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/prd221-evidence/source-sha.txt"
          if test -d packages/runtime-native/third_party/v8-android; then
            tar -czf "$RUNNER_TEMP/prd221-evidence/v8-android.tar.gz" -C packages/runtime-native/third_party v8-android
          fi
          for partial in packages/runtime-native/third_party/.v8-source-*/payload; do
            if test -d "$partial"; then
              tar -czf "$RUNNER_TEMP/prd221-evidence/unqualified-partial-payload.tar.gz" -C "$partial" .
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prd221-owned-v8-${{ needs.apply-tested-candidate.outputs.candidate }}
          path: ${{ runner.temp }}/prd221-evidence
          if-no-files-found: error
          retention-days: 2
