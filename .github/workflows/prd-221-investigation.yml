name: PRD-221 review snapshot
# Temporary read-only export for local review; removed in the consolidation commit.
on:
  push:
    branches: [codex/prd-221-android-v8-16kb]
    paths: [.github/workflows/prd-221-investigation.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 128
          persist-credentials: false
      - name: Export tracked candidate, main delta, and ancestry
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/prd221-review
        run: |
          set -euo pipefail
          mkdir -p "$SNAPSHOT_DIR"
          git archive --format=tar.gz -o "$SNAPSHOT_DIR/source.tar.gz" HEAD
          git rev-parse HEAD > "$SNAPSHOT_DIR/head.txt"
          git fetch --no-tags --depth=128 origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse origin/main > "$SNAPSHOT_DIR/main.txt"
          git merge-base HEAD origin/main > "$SNAPSHOT_DIR/merge-base.txt"
          git diff --binary --full-index HEAD origin/main > "$SNAPSHOT_DIR/head-to-main.patch"
          git diff --binary --full-index "$(git merge-base HEAD origin/main)" HEAD > "$SNAPSHOT_DIR/pr.patch"
          for sha in c52da662c293f5b84bda1ae161a76d01b84e1cee 183e54a9e9963a99de87710c9044ff9cfac421a8 7cf10bd4ebe5d36cbbfead6d43d818ab9b4e3b7f; do
            git merge-base --is-ancestor "$sha" HEAD
            echo "$sha included" >> "$SNAPSHOT_DIR/slices.txt"
          done
          git log -40 --format='%H %s' > "$SNAPSHOT_DIR/history.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prd221-review-${{ github.sha }}
          path: ${{ runner.temp }}/prd221-review
          if-no-files-found: error
          retention-days: 2
