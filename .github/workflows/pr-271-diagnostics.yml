name: PR 271 bounded verification
on:
  push:
    branches: [codex/prd-375-macos-icon-content]
    paths:
      - .github/workflows/pr-271-diagnostics.yml
      - packages/runtime-native/scripts/inspect-macos-icon.mjs
      - packages/runtime-native/tests/macos-icon-content.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record real decoder and verifier results
        shell: bash
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/pr271-verification"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          if [ "$RUNNER_OS" = Linux ]; then
            cp "$(command -v pnpm)" "$out/pnpm"
            sha256sum "$out/pnpm" > "$out/pnpm.sha256"
            pnpm exec biome check . --diagnostic-level=error --max-diagnostics=100 > "$out/biome.log" 2>&1
            echo "$?" > "$out/biome.status"
            pnpm quality > "$out/quality.log" 2>&1
            echo "$?" > "$out/quality.status"
          fi
          pnpm --filter @threenative/runtime-native exec vitest run --config vitest.config.ts tests/macos-icon-content.test.mjs tests/starter-brand.test.mjs tests/starter-desktop.test.mjs > "$out/focused.log" 2>&1
          echo "$?" > "$out/focused.status"
          cat "$out/focused.log"
          test "$(cat "$out/focused.status")" = 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr271-verification-${{ runner.os }}
          path: ${{ runner.temp }}/pr271-verification
          retention-days: 3
          if-no-files-found: error
