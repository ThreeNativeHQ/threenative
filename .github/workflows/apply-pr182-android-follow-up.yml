name: Apply PR182 Android follow-up

on:
  push:
    branches:
      - fix/pr182-consumer-runtime-regressions

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pr182-android-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pr182-consumer-runtime-regressions
          fetch-depth: 0
      - name: Apply and verify exact reviewed Android patch
        run: |
          set -euo pipefail
          git apply --check .github/pr182-android-follow-up.patch
          git apply .github/pr182-android-follow-up.patch
          test "$(git hash-object packages/runtime-native/scripts/package-android.mjs)" = "2cb663f2b114d039bc3ebaa90407abd127ed5088"
          rm .github/pr182-android-follow-up.patch .github/workflows/apply-pr182-android-follow-up.yml
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime-native): harden Android source checkout routing [pr182-android-applied]"
          git push origin HEAD:fix/pr182-consumer-runtime-regressions
