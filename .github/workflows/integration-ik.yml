name: Integration ik
on:
  pull_request:
    # `ready_for_review` is what makes the draft guard below safe: without it the workflow never
    # fires on the event that un-skips the job, and the lane goes quiet instead of cheap.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'examples/integrations/ik/**'
      - '.github/workflows/integration-ik.yml'
permissions:
  contents: read
jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/integrations/ik
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
