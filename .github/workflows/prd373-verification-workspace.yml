name: PRD-373 verification workspace

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prd373-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'prd373/status-from-main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture the exact verification source
        run: |
          mkdir -p /tmp/prd373-evidence
          git rev-parse HEAD > /tmp/prd373-evidence/candidate.txt
          git archive --format=tar HEAD | gzip -1 > /tmp/prd373-evidence/source.tar.gz
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the existing CI safety suite
        run: |
          set -o pipefail
          pnpm exec vitest run scripts/__tests__/ci-structure.spec.ts scripts/__tests__/ci-needs.spec.ts scripts/__tests__/ci-efficiency.spec.ts scripts/__tests__/ci-local.spec.ts scripts/__tests__/ci-fast.spec.ts | tee /tmp/prd373-evidence/ci-tests.txt
      - name: Regenerate and check the retention index
        if: always()
        run: |
          set -o pipefail
          pnpm exec tsx scripts/generate-retention-index.ts | tee /tmp/prd373-evidence/retention-generate.txt
          pnpm exec tsx scripts/generate-retention-index.ts --check | tee /tmp/prd373-evidence/retention-check.txt
          git diff -- docs/benchmark/SCREENSHOT-RETENTION.md > /tmp/prd373-evidence/retention.patch
          cp docs/benchmark/SCREENSHOT-RETENTION.md /tmp/prd373-evidence/SCREENSHOT-RETENTION.md
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd373-verification-${{ github.event.pull_request.head.sha }}
          path: /tmp/prd373-evidence/
          retention-days: 3
          if-no-files-found: error
