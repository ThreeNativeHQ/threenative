name: Integration temporal AA
on:
  pull_request:
    paths:
      - 'packages/core/src/render/chain.ts'
      - 'packages/core/src/render/velocity.ts'
      - 'packages/core/__tests__/temporal-chain.spec.ts'
      - 'packages/create-threenative/templates/starter/src/render/temporalAA.ts'
      - 'packages/create-threenative/__tests__/temporal-aa.spec.ts'
      - 'packages/runtime-native/conformance/scenes/shared/temporal-aa*.js'
      - 'examples/abyss-framework/temporal*'
      - 'examples/abyss-framework/playtests/temporal-aa.playtest.json'
      - 'scripts/verify-temporal-aa.ts'
      - 'scripts/temporal-aa-evidence.ts'
      - 'scripts/__tests__/temporal-aa-evidence.spec.ts'
      - '.github/workflows/integration-temporal.yml'
permissions:
  contents: read
jobs:
  temporal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @threenative/playtest build
      - uses: ./.github/actions/playwright-chromium
      - name: Validate actual TRAANode and history lifecycle contracts
        run: pnpm exec vitest run packages/core/__tests__/temporal-chain.spec.ts packages/core/__tests__/render-chain.spec.ts packages/core/__tests__/render-velocity.spec.ts packages/create-threenative/__tests__/temporal-aa.spec.ts scripts/__tests__/temporal-aa-evidence.spec.ts --maxWorkers=2
      - name: Render temporal motion and reset variants
        run: node --import tsx scripts/verify-temporal-aa.ts
      - name: Retain actual runtime screenshots and adapter evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: temporal-aa-${{ github.event.pull_request.head.sha }}
          path: artifacts/temporal-aa
          if-no-files-found: error
