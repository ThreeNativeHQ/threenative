name: Pipeline cache source delivery (temporary, not a correctness gate)
on:
  push:
    branches: [feat/prd-368-persistent-pipeline-cache]
    paths:
      - .github/workflows/pipeline-cache.yml
      - .github/prd-368.patch
      - .github/prd-368-clock.patch
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Apply source-only changes to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/prd-368-persistent-pipeline-cache
          git apply --check .github/prd-368.patch .github/prd-368-clock.patch
          git apply --index .github/prd-368.patch .github/prd-368-clock.patch
          git rm .github/prd-368.patch .github/prd-368-clock.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(prd-368): qualify native first-playable clocks and close review gaps'
          git push origin HEAD:feat/prd-368-persistent-pipeline-cache
          mkdir -p artifacts/pipeline-cache-source
          git rev-parse HEAD > artifacts/pipeline-cache-source/revision.txt
          git archive --format=tar.gz HEAD > artifacts/pipeline-cache-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-cache-reviewed-source
          path: artifacts/pipeline-cache-source
          retention-days: 7
          if-no-files-found: error
