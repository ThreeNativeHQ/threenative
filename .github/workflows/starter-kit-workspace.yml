name: Starter kit isolated verification workspace

on:
  push:
    branches: [codex/astracraft-midway-starter-kits]
    paths: [.github/workflows/starter-kit-workspace.yml]

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - name: Export the checksum-verified package manager, without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/starter-kit-toolchain"
          cp "$(command -v pnpm)" "$RUNNER_TEMP/starter-kit-toolchain/pnpm"
          pnpm --version > "$RUNNER_TEMP/starter-kit-toolchain/version.txt"
          sha256sum "$RUNNER_TEMP/starter-kit-toolchain/pnpm" > "$RUNNER_TEMP/starter-kit-toolchain/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: starter-kit-toolchain
          path: ${{ runner.temp }}/starter-kit-toolchain
          retention-days: 1
          compression-level: 6
