name: PRD-264 verification
on:
  push:
    branches: [codex/prd-264-doctor-readiness]
permissions:
  contents: write
concurrency:
  group: prd-264-verification
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply the reviewed candidate
        env:
          EXPECTED_PATCH_SHA256: d4d4ca3d277fdc44f0abd4108dc88fde7ddcef1b3888898b26bde49a982718bf
        run: |
          test "$GITHUB_REF" = refs/heads/codex/prd-264-doctor-readiness
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          encoded = '''
          
          
          
          
          '''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == os.environ['EXPECTED_PATCH_SHA256']
          location = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate.patch'
          location.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(location)], check=True)
          subprocess.run(['git', 'apply', str(location)], check=True)
          PY
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-threenative... --filter threenative-engine-mcp run build
      - name: Verify CLI types and diagnostic regressions
        run: |
          pnpm exec tsc --noEmit -p packages/create-threenative/tsconfig.json
          pnpm exec vitest run packages/create-threenative/__tests__/doctor.spec.ts packages/create-threenative/__tests__/cli.spec.ts packages/create-threenative/__tests__/scaffold-mcp.spec.ts packages/core/__tests__/mcp-install.spec.ts
          git diff --check
      - name: Commit only the candidate and remove this temporary workflow
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/prd-264-doctor-readiness
          git rm .github/workflows/prd-264-verify.yml
          git add packages/create-threenative/src/doctor.ts packages/create-threenative/src/threenative.ts packages/create-threenative/__tests__/doctor.spec.ts packages/create-threenative/__tests__/cli.spec.ts packages/create-threenative/README.md packages/core/mcp/install.d.mts packages/core/__tests__/mcp-install.spec.ts packages/create-threenative/__tests__/scaffold-mcp.spec.ts scripts/sync-mcp-configs.ts docs/PRDs/production-readiness/PRD-264-doctor-answers-all-three-questions-a-game-author-has.md
          git diff --cached --check
          git -c user.name='João Paulo Furtado' -c user.email='30300459+jonit-dev@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'feat(doctor): diagnose scoped build prerequisites and authoring evidence (PRD-264)'
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/codex/prd-264-doctor-readiness
