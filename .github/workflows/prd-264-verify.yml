name: PRD-264 verification
on:
  push:
    branches: [codex/prd-264-doctor-readiness]
permissions:
  contents: read
concurrency:
  group: prd-264-verification
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-threenative... --filter threenative-engine-mcp run build
      - name: Baseline doctor and CLI regressions
        run: pnpm exec vitest run packages/create-threenative/__tests__/doctor.spec.ts packages/create-threenative/__tests__/cli.spec.ts
      - name: Export offline test environment
        if: always()
        run: |
          tar -czf doctor-tools.tar.gz node_modules packages/*/node_modules packages/*/dist packages/create-threenative/template-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd-264-tools
          path: doctor-tools.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
