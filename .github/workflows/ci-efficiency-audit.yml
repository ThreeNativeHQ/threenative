name: CI efficiency audit

on:
  push:
    branches: [codex/ci-efficiency-2026-09-10]
    paths: [.github/workflows/ci-efficiency-audit.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Collect recent timing histories and representative raw logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections, concurrent.futures, datetime, json, os, pathlib, statistics, urllib.request, urllib.parse
          out = pathlib.Path('ci-audit')
          (out / 'logs').mkdir(parents=True, exist_ok=True)
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, hdrs, newurl)
                  if redirected is not None and urllib.parse.urlparse(req.full_url).netloc != urllib.parse.urlparse(newurl).netloc:
                      redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(Redirect())
          def get(path, raw=False):
              with opener.open(urllib.request.Request(root + path, headers=headers), timeout=90) as response:
                  body = response.read()
              return body if raw else json.loads(body)
          runs = [r for r in get('/actions/runs?per_page=100')['workflow_runs'] if r['name'] != 'CI efficiency audit']
          errors = []
          def jobs_for(run):
              jobs, page = [], 1
              try:
                  while True:
                      chunk = get(f"/actions/runs/{run['id']}/jobs?filter=latest&per_page=100&page={page}")['jobs']
                      jobs.extend(chunk)
                      if len(chunk) < 100: break
                      page += 1
                  return jobs
              except Exception as exc:
                  errors.append({'run': run['id'], 'error': str(exc)})
                  return []
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              jobs = [j for batch in pool.map(jobs_for, runs) for j in batch]
          def duration(item):
              a, b = item.get('started_at'), item.get('completed_at')
              return (datetime.datetime.fromisoformat(b.replace('Z', '+00:00')) - datetime.datetime.fromisoformat(a.replace('Z', '+00:00'))).total_seconds() if a and b else None
          groups = collections.defaultdict(list)
          for job in jobs:
              if job['conclusion'] == 'success' and duration(job) is not None:
                  groups[job['name']].append(job)
          selected = {}
          for entries in groups.values():
              job = sorted(entries, key=duration)[len(entries)//2]
              if duration(job) >= 60:
                  selected[job['id']] = job
          for job in sorted(jobs, key=lambda j: j['id'], reverse=True):
              if job['conclusion'] in ('failure', 'timed_out') and not any(j['name'] == job['name'] and j['conclusion'] in ('failure', 'timed_out') for j in selected.values()):
                  selected[job['id']] = job
          selected = dict(list(selected.items())[:60])
          def log_for(job):
              try:
                  (out / 'logs' / f"{job['id']}.txt").write_bytes(get(f"/actions/jobs/{job['id']}/logs", raw=True))
              except Exception as exc:
                  errors.append({'job': job['id'], 'error': str(exc)})
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(log_for, selected.values()))
          (out / 'data.json').write_text(json.dumps({'runs': runs, 'jobs': jobs, 'selected_logs': list(selected.values()), 'errors': errors}, indent=2))
          lines = [f"Runs: {len(runs)}; jobs: {len(jobs)}; raw logs: {len(list((out / 'logs').glob('*.txt')))}; fetch errors: {len(errors)}", '', '| Job | Successful samples | Median seconds |', '| --- | ---: | ---: |']
          for name, entries in sorted(groups.items(), key=lambda pair: statistics.median(duration(j) for j in pair[1]), reverse=True):
              lines.append(f"| {name} | {len(entries)} | {statistics.median(duration(j) for j in entries):.0f} |")
          text = '\n'.join(lines) + '\n'
          (out / 'summary.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle: handle.write(text)
          print(text)
          print('Fetch errors:', json.dumps(errors))
          PY
      - name: Retain tracked source without git metadata or credentials
        run: git archive --format=tar.gz HEAD > ci-audit/sources.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ci-efficiency-audit
          path: ci-audit
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
