name: CI efficiency validation

on:
  push:
    branches: [codex/ci-efficiency-2026-09-10]
    paths: [.github/workflows/ci-efficiency-audit.yml]

# Temporary, branch-scoped validation. Writes only immutable Git blob objects after tests;
# it never updates a branch, opens a PR, publishes a package, or changes a workflow ref.
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply the exact locally tested candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-efficiency"
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          patch = pathlib.Path('.ci-efficiency.patch').read_text().replace('\n diff --git', '\ndiff --git')
          assert hashlib.sha256(patch.encode()).hexdigest() == 'baea3136086a332d1a317c12e6474683d68b3dcb25f1bfc9a958a273fd70dde2', 'Candidate patch differs from locally verified bytes'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, text=True, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, text=True, check=True)
          pathlib.Path('.ci-efficiency.patch').unlink()
          pathlib.Path('.github/workflows/ci-efficiency-audit.yml').unlink()
          PY
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
      - name: CI structure, dependency, package-list, and fail-closed regression tests
        run: |
          set -euo pipefail
          pnpm exec vitest run scripts/__tests__/ci-structure.spec.ts scripts/__tests__/ci-needs.spec.ts scripts/__tests__/ci-efficiency.spec.ts scripts/__tests__/package-list-drift.spec.ts 2>&1 | tee "$RUNNER_TEMP/ci-efficiency/workflow-tests.log"
      - name: Native conformance-runner regression suite
        run: |
          set -euo pipefail
          pnpm --filter @threenative/runtime-native exec vitest run tests/conformance-runner.test.mjs --maxWorkers 2 2>&1 | tee "$RUNNER_TEMP/ci-efficiency/conformance-tests.log"
      - name: Check edited tests with the repository-pinned formatter
        run: |
          set -euo pipefail
          pnpm exec biome check scripts/__tests__/ci-efficiency.spec.ts scripts/__tests__/ci-structure.spec.ts packages/runtime-native/tests/conformance-runner.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-efficiency/lint.log"
          git diff --check
      - name: Retain verified immutable candidate blobs without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          expected = {
              '.github/workflows/ci.yml': '112b572621871e9469838ff32d7b65fd124bef47',
              '.github/workflows/native-platforms.yml': '50ef4c7f426f0ca66e49e5f71976790d47f6c48a',
              'scripts/__tests__/ci-structure.spec.ts': '62d5f00ed0e920011bebaa958e54e9513dba2df4',
              'packages/runtime-native/tests/conformance-runner.test.mjs': '77b14e4224bb88da195b31d599d43f7bdbdbb514',
              'scripts/__tests__/ci-efficiency.spec.ts': '48cc279e9f920c9f6ec6c3b5480169a286566e5b',
          }
          elements = []
          for name, expected_sha in expected.items():
              content = pathlib.Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              assert actual == expected_sha, f'{name} changed during verification'
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=json.dumps({'content': content.decode(), 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              assert blob['sha'] == expected_sha, f'{name} upload mismatch'
              elements.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          for name in ['.ci-efficiency.patch', '.github/workflows/ci-efficiency-audit.yml']:
              elements.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
          result = {'base_commit': os.environ['GITHUB_SHA'], 'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'tree_elements': elements, 'patch_sha256': 'baea3136086a332d1a317c12e6474683d68b3dcb25f1bfc9a958a273fd70dde2'}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-efficiency' / 'candidate.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-efficiency-validation
          path: ${{ runner.temp }}/ci-efficiency
          if-no-files-found: error
          retention-days: 7
