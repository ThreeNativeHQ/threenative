name: PRD-312 validate final research diff
on:
  push:
    branches: [spike/prd-312-aot-2026-09-16]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Validate the tree with the temporary workflow removed
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aot312-docs"
          mkdir -p "$OUT"
          npm install --global pnpm@10.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts --prod=false
          rm -- .github/workflows/prd-312-aot-spike.yml
          git add -u -- .github/workflows/prd-312-aot-spike.yml
          git write-tree | tee "$OUT/final-tree.txt"
          git diff --check d292da4225186e6ec395be551d49c7a26a1770be
          git diff --name-only d292da4225186e6ec395be551d49c7a26a1770be | tee "$OUT/changed-paths.txt"
          test "$(cat "$OUT/changed-paths.txt")" = docs/PRDs/architecture/PRD-312-the-shermes-spike-is-timeboxed-and-closed.md
          set +e
          timeout 180s pnpm check:docs > "$OUT/check-docs.log" 2>&1
          DOCS=$?
          timeout 180s pnpm exec vitest run scripts/__tests__/check-doc-links.spec.ts scripts/__tests__/evidence-budget.spec.ts scripts/__tests__/evidence-citations.spec.ts scripts/__tests__/sync-agent-docs.spec.ts scripts/__tests__/ci-structure.spec.ts scripts/__tests__/ci-needs.spec.ts > "$OUT/docs-tests.log" 2>&1
          TESTS=$?
          set -e
          pnpm prd:progress docs/PRDs/architecture/PRD-312-the-shermes-spike-is-timeboxed-and-closed.md | tee "$OUT/prd-progress.txt"
          printf 'check-docs\t%s\ndocs-tests\t%s\n' "$DOCS" "$TESTS" | tee "$OUT/status.tsv"
          tail -100 "$OUT/check-docs.log"
          tail -100 "$OUT/docs-tests.log"
          test "$DOCS" = 0 && test "$TESTS" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd-312-final-docs-checks
          path: ${{ runner.temp }}/aot312-docs/*
          retention-days: 7
