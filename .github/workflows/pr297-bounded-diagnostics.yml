name: PR297 bounded diagnostics
on:
  push:
    branches: [feat/prd-443-compact]
    paths: [.github/workflows/pr297-bounded-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'ThreeNativeHQ/threenative' && github.ref == 'refs/heads/feat/prd-443-compact'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Require the inspected candidate
        run: test "$(git rev-parse HEAD^)" = 0f6429b3454a7d1cf9009591669b3d425f55fcd7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the actual workspace used by scaffold verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr297-diagnostics"
          git rev-parse HEAD > "$RUNNER_TEMP/pr297-diagnostics/revision.txt"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/pr297-diagnostics/build.log"
      - name: Correct only the observed formatter error
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome format --write packages/assets/src/passes/compact.ts
          pnpm exec biome check . --diagnostic-level=error --max-diagnostics=100 2>&1 | tee "$RUNNER_TEMP/pr297-diagnostics/lint-after.log"
          git diff -- packages/assets/src/passes/compact.ts > "$RUNNER_TEMP/pr297-diagnostics/format.patch"
      - name: Measure the actual clean-checkout scaffold hashes without changing assertions
        shell: bash
        run: |
          set -euo pipefail
          cp packages/create-threenative/__tests__/scaffold.spec.ts "$RUNNER_TEMP/pr297-original-scaffold.ts"
          python3 <<'PY'
          from pathlib import Path
          p = Path('packages/create-threenative/__tests__/scaffold.spec.ts')
          s = p.read_text()
          needle = 'expect(actual).toEqual(PRD_201_PARENT_SCAFFOLD_HASHES);'
          assert s.count(needle) == 1
          observation = 'await writeFile(path.join(process.env.RUNNER_TEMP ?? "/tmp", "pr297-measured-hashes.json"), JSON.stringify(actual, null, 2));\n      '
          p.write_text(s.replace(needle, observation + needle))
          PY
          set +e
          pnpm exec vitest run packages/create-threenative/__tests__/scaffold.spec.ts > "$RUNNER_TEMP/pr297-diagnostics/scaffold-before.log" 2>&1
          result=$?
          set -e
          cp "$RUNNER_TEMP/pr297-original-scaffold.ts" packages/create-threenative/__tests__/scaffold.spec.ts
          echo "$result" > "$RUNNER_TEMP/pr297-diagnostics/scaffold-before.status"
          test -s "$RUNNER_TEMP/pr297-measured-hashes.json"
          cp "$RUNNER_TEMP/pr297-measured-hashes.json" "$RUNNER_TEMP/pr297-diagnostics/measured-hashes.json"
      - name: Repin exactly the existing ten generated expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re
          from pathlib import Path
          p = Path('packages/create-threenative/__tests__/scaffold.spec.ts')
          s = p.read_text()
          values = json.loads(Path(os.environ['RUNNER_TEMP'], 'pr297-measured-hashes.json').read_text())
          assert len(values) == 10
          assert all(isinstance(v, str) and re.fullmatch('[a-f0-9]{64}', v) for v in values.values())
          begin = s.index('const PRD_201_PARENT_SCAFFOLD_HASHES:')
          end = s.index('\n};', begin) + 3
          table = s[begin:end]
          for name, value in values.items():
            pattern = r'(^\s*(?:"' + re.escape(name) + r'"|' + re.escape(name) + r'):\s*)"[a-f0-9]{64}"'
            table, count = re.subn(pattern, lambda m: m[1] + '"' + value + '"', table, flags=re.M)
            assert count == 1, (name, count)
          p.write_text(s[:begin] + table + s[end:])
          PY
          pnpm exec biome format --write packages/create-threenative/__tests__/scaffold.spec.ts
          pnpm exec vitest run packages/create-threenative/__tests__/scaffold.spec.ts 2>&1 | tee "$RUNNER_TEMP/pr297-diagnostics/scaffold-after.log"
          pnpm exec vitest run packages/assets/__tests__/compact.spec.ts packages/create-threenative/__tests__/config.spec.ts 2>&1 | tee "$RUNNER_TEMP/pr297-diagnostics/focused.log"
          pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/pr297-diagnostics/typecheck.log"
          pnpm quality 2>&1 | tee "$RUNNER_TEMP/pr297-diagnostics/quality.log"
          pnpm exec biome check . --diagnostic-level=error --max-diagnostics=100 2>&1 | tee "$RUNNER_TEMP/pr297-diagnostics/lint-final.log"
          git diff --check
      - name: Commit only the two verified corrections without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/prd-443-compact | cut -f1)" = "$GITHUB_SHA"
          git add packages/assets/src/passes/compact.ts packages/create-threenative/__tests__/scaffold.spec.ts
          git diff --cached --stat
          git diff --cached > "$RUNNER_TEMP/pr297-diagnostics/correction.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(prd-443): format typed matrices and regenerate verified scaffold hashes' -m 'Use the pinned formatter and ten hashes measured by createProject from this built clean checkout. Scaffold and focused regression tests, typecheck, quality and final formatting passed. No acceptance criteria or test gates weakened. PRD-443 remains partial.'
          git push origin HEAD:refs/heads/feat/prd-443-compact
          git rev-parse HEAD > "$RUNNER_TEMP/pr297-diagnostics/correction-commit.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr297-bounded-diagnostics
          path: ${{ runner.temp }}/pr297-diagnostics
          retention-days: 3
          if-no-files-found: error
