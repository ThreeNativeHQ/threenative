name: Integration csg
on:
  pull_request:
    paths:
      - 'examples/integrations/csg/**'
      - '.github/workflows/integration-csg.yml'
  push:
    paths:
      - 'examples/integrations/csg/**'
      - '.github/workflows/integration-csg.yml'
permissions:
  contents: read
concurrency:
  group: integration-csg-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/integrations/csg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - id: build
        run: npm run build
      - run: npm run test:contracts
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:integration
