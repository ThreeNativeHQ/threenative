name: Integration csg
on:
  pull_request:
    # `ready_for_review` is what makes the draft guard below safe: without it the workflow never
    # fires on the event that un-skips the job, and the lane goes quiet instead of cheap.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'examples/integrations/csg/**'
      - '.github/workflows/integration-csg.yml'
permissions:
  contents: read
concurrency:
  group: integration-csg-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # `pull_request` alone, never `pull_request` plus `push`: one commit pushed to a branch reaches
  # both triggers, so the pair ran the identical proof twice for the same tree. A draft spends no
  # runner until it is marked ready.
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/integrations/csg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - id: build
        run: npm run build
      - run: npm run test:contracts
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:integration
