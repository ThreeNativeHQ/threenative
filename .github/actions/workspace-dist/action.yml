name: Build the workspace, or restore the last build of the same sources
description: >-
  Six jobs need packages/*/dist and each compiled it from scratch, ~50-65s every time. tsup keeps
  no incremental state to cache, but its output is a pure function of the sources, so the output is
  what gets cached.

inputs:
  pack-archives:
    description: Pack and validate current published files; false only for bundle-only consumers.
    required: false
    default: "true"
  key-suffix:
    description: Extra text to vary the cache key when a caller needs its own entry.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Record the workspace toolchain
      id: toolchain
      shell: bash
      run: |
        echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
        echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
    # The key names everything the bundles are built from and nothing else. `src/**`, the package
    # manifests, the tsup configs, the per-package generators that write files into the bundle, and
    # the script that decides which packages get built at all. Templates are deliberately absent:
    # they ship as files and no bundle embeds their bytes, so keying on them would miss on every
    # template edit and buy nothing. Shared build helpers/configuration intentionally remain broad.
    #
    # A key that names too little serves a stale bundle, which is the one failure this must not
    # have — so when in doubt an input belongs in the list. A key that names too much only costs a
    # rebuild nobody needed.
    - name: Restore the compiled workspace
      id: dist
      uses: actions/cache@v4
      with:
        # Only compiled bundles are cacheable. Shipped templates and mirrors are repacked below.
        path: |
          packages/*/dist
        key: workspace-dist-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.node }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.json', 'tsconfig.base.json', 'patches/**', 'packages/*/src/**', 'packages/*/package.json', 'packages/*/tsup.config.ts', 'packages/*/*.json', 'packages/*/*.ts', 'packages/*/scripts/**', 'packages/*/mcp/**', 'scripts/workspace-packages.ts', 'scripts/**', '.github/actions/workspace-dist/**') }}${{ inputs.key-suffix }}
    # Core's capability server lives outside dist. Restore it from the cached engine-mcp bundle
    # BEFORE every repack, or a warm-cache core tarball silently loses its offline MCP server.
    - name: Restore generated files outside dist
      if: steps.dist.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "workspace dist restored for these sources; skipping the build"
        node packages/core/scripts/bundle-engine-mcp.mjs
    - name: Build missing workspace bundles
      if: steps.dist.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        pnpm tsx scripts/workspace-packages.ts build
    - name: Pack current workspace files
      if: inputs.pack-archives != 'false'
      shell: bash
      run: |
        set -euo pipefail
        # Templates, mirrors and other published non-dist files are never restored from cache.
        rm -rf artifacts/workspace-packages
        mkdir -p artifacts/workspace-packages
        pnpm tsx scripts/workspace-packages.ts --archives > artifacts/workspace-packages/specs
        while IFS=$'\t' read -r package_name _; do
          [ -n "$package_name" ] || continue
          pnpm --filter "$package_name" pack --pack-destination artifacts/workspace-packages
        done < artifacts/workspace-packages/specs
    # Fail closed rather than hand the caller a partial restore. An entry saved from a run that
    # died mid-build would otherwise be indistinguishable from a good one, and every consumer of
    # this action imports from these files. The set is derived, not listed: a package builds a
    # bundle exactly when it has a tsup config, which is true of all nine today and stays true for
    # the tenth without anyone remembering to edit this.
    - name: Check every bundling package has its bundle
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for config in packages/*/tsup.config.ts; do
          directory="$(dirname "$config")"
          [ -d "$directory/dist" ] || missing+=("$directory/dist")
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "TN_WORKSPACE_DIST_INCOMPLETE: ${missing[*]}" >&2
          exit 1
        fi
        echo "workspace compiled bundles validated"
    - name: Validate current archive payloads
      if: inputs.pack-archives != 'false'
      shell: bash
      run: |
        set -euo pipefail
        # Archives belong only to lanes that scaffold rather than import.
        archives="$(ls artifacts/workspace-packages/*.tgz 2>/dev/null | wc -l)"
        bundles="$(ls -d packages/*/dist | wc -l)"
        expected="$(pnpm tsx scripts/workspace-packages.ts --archives | grep -c .)"
        if [ "$archives" -ne "$expected" ]; then
          echo "TN_WORKSPACE_ARCHIVES_INCOMPLETE: $archives of $expected tarballs" >&2
          exit 1
        fi
        # Counting tarballs proved nothing about what is inside one. The count was right — 10 of
        # 10 — on the run whose core tarball had no capability server in it, because the file that
        # went missing lives outside `dist` and outside the count. A package's tarball is what ten
        # downstream jobs actually install, so at least one of them gets looked into.
        core_archive="$(ls artifacts/workspace-packages/threenative-core-*.tgz 2>/dev/null | head -1)"
        if [ -z "$core_archive" ]; then
          echo "TN_WORKSPACE_ARCHIVES_INCOMPLETE: no @threenative/core tarball" >&2
          exit 1
        fi
        # Listed to a file, and nothing is piped into `grep -q`. `grep -q` exits at its first
        # match and closes the pipe under it; whatever is still writing takes SIGPIPE, and
        # `set -o pipefail` makes that dead producer the step's status. `tar` printed
        # `tar: stdout: write error` and the job failed with the archive perfectly valid — it
        # took out typecheck, build, test-native and all three test-unit legs of one run while
        # the same check passed on the commit before, because whether it fires depends on how
        # far through the listing the match falls. Same shape as the `xvfb-run` trap this
        # repository already refuses, where a cleanup's status replaces the real one.
        #
        # Piping a variable instead of `tar` does not fix it: `printf` is then the producer that
        # dies. The pipe has to go.
        core_listing="$(mktemp)"
        tar -tzf "$core_archive" > "$core_listing"
        for required in package/mcp/engine-server.mjs package/mcp/engine.mjs package/capabilities.json; do
          if ! grep -qxF "$required" "$core_listing"; then
            echo "TN_WORKSPACE_ARCHIVE_MISSING: $core_archive has no $required" >&2
            exit 1
          fi
        done
        rm -f "$core_listing"
        echo "workspace dist complete: $bundles bundles, $archives tarballs, core archive carries its MCP server"
    - name: Report workspace product reuse and elapsed time
      if: always()
      shell: bash
      env:
        DIST_CACHE_HIT: ${{ steps.dist.outputs.cache-hit }}
        DIST_STARTED: ${{ steps.toolchain.outputs.started }}
      run: |
        printf 'Workspace bundle cache hit: `%s`; restore/build/repack/validation execution: `%ss`. This is product reuse, not a test verdict.\n' \
          "${DIST_CACHE_HIT:-unavailable}" "$(( $(date +%s) - ${DIST_STARTED:-$(date +%s)} ))" >> "$GITHUB_STEP_SUMMARY"
