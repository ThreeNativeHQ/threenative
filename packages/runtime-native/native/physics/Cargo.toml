[package]
name = "threenative-native-physics"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bincode = "=1.3.3"
rapier3d = { version = "=0.30.0", features = ["serde-serialize"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
panic = "abort"
strip = "symbols"
