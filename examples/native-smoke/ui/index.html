<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>native-smoke UI layer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font: 16px/1.3 system-ui, sans-serif;
        color: #e8eef7;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      /* A HUD-shaped plate that is deliberately NOT interactive: every touch on it belongs to
         the game beneath, which is the rule `pointer-events: none` cannot deliver. */
      .plate {
        position: absolute;
        left: 4%;
        top: 6%;
        width: 34%;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(12, 20, 34, 0.55);
      }
      .plate b {
        font-size: 28px;
        font-variant-numeric: tabular-nums;
      }
      button {
        position: absolute;
        border: 0;
        border-radius: 14px;
        background: #7fffd4;
        color: #06202b;
        font: inherit;
        font-weight: 700;
      }
      /* The static island. Centred on (0.85, 0.50) of the viewport. */
      #tap {
        left: 75%;
        top: 40%;
        width: 20%;
        height: 20%;
      }
      /* The moving island. Rests over (0.30, 0.75) and travels right over three seconds when
         the game publishes `slide`. Its rect is a frame behind wherever it is drawn unless the
         registry republishes while the transition is live. */
      #slider {
        left: 20%;
        top: 65%;
        width: 20%;
        height: 20%;
        transition: transform 4000ms linear;
        transform: translateX(0);
      }
      body.sliding #slider {
        transform: translateX(200%);
      }
      /* The page-local clock: an animation the page owns, driven by its own rAF, that no game
         state touches. PRD-398's AC-2 needs a page that keeps changing with no game post, so the
         snapshot loop has to find it on its own rather than being woken by the bridge. `body.idle`
         pauses it, which is how a run measures the backoff and the resume from it. */
      #pulse {
        position: absolute;
        left: 60%;
        top: 8%;
        width: 6%;
        height: 10%;
        border-radius: 50%;
        background: #ff3d00;
        animation: tn-pulse 1000ms linear infinite alternate;
      }
      @keyframes tn-pulse {
        from {
          transform: translateX(0) scale(1);
        }
        to {
          transform: translateX(220%) scale(0.6);
        }
      }
      body.idle #pulse {
        animation-play-state: paused;
      }
      /* Only the cadence gate turns this on (`window.__tnPageAnimation`), so the UI-frame gate keeps
         the static page it was written against and its 2 ms ui-phase budget still means what it did. */
      body:not(.animating) #pulse {
        animation-play-state: paused;
      }
      #tick {
        font-variant-numeric: tabular-nums;
        color: #ff3d00;
      }
    </style>
  </head>
  <body>
    <div class="plate">
      <div>POINTER DOWNS</div>
      <b id="downs">0</b>
      <div>PAGE TICKS <span id="tick">0</span></div>
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="15" fill="none" stroke="#7fffd4" stroke-width="3" />
      </svg>
    </div>
    <div id="pulse"></div>
    <button id="tap" data-tn-interactive type="button">SLIDE</button>
    <button id="slider" data-tn-interactive type="button">MOVING</button>
    <script type="module" src="./main.js"></script>
  </body>
</html>
