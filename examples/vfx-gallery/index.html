<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>ThreeNative VFX Gallery</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #eef3f8; color-scheme: dark; }
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070a; }
      canvas { display: block; width: 100%; height: 100%; }
      .topbar, .footer, .labels { position: fixed; pointer-events: none; }
      .topbar { left: 32px; right: 32px; top: 24px; display: flex; justify-content: space-between; align-items: flex-start; text-shadow: 0 2px 16px #000; }
      .eyebrow { color: #91a0af; font-size: 11px; font-weight: 700; letter-spacing: .2em; }
      h1 { margin: 5px 0 0; font-size: 28px; letter-spacing: -.035em; font-weight: 660; }
      .stats, .footer { display: flex; gap: 8px; flex-wrap: wrap; }
      .stats span, .footer span { padding: 7px 11px; border: 1px solid rgba(255,255,255,.1); border-radius: 999px; background: rgba(7,10,14,.74); color: #b8c4ce; font-size: 11px; backdrop-filter: blur(12px); }
      .labels { inset: 0; display: grid; grid-template-columns: repeat(3, 190px); grid-template-rows: repeat(3, 1fr); place-content: start center; gap: 0 50px; padding-top: 398px; }
      .cell { display: flex; justify-content: center; align-items: flex-start; }
      .label { min-width: 145px; max-width: 92%; padding: 7px 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: linear-gradient(180deg, rgba(7,10,14,.3), rgba(7,10,14,.86)); box-shadow: 0 8px 24px rgba(0,0,0,.24); text-align: center; }
      .label strong { display: block; overflow: hidden; font-size: 12px; line-height: 1.15; text-overflow: ellipsis; white-space: nowrap; }
      .label small { display: block; margin-top: 3px; color: #75d7c1; font-size: 8px; letter-spacing: .1em; text-transform: uppercase; }
      .label[data-group="Effekseer"] small, .label[data-group="extras"] small { color: #e6c66d; }
      .footer { left: 30px; right: 30px; bottom: 22px; align-items: center; }
      .footer span:nth-child(2) { margin-right: auto; }
      button { pointer-events: auto; padding: 8px 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: rgba(11,15,20,.82); color: #edf3f8; font: 600 11px inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <header class="topbar">
      <div><div class="eyebrow">THREENATIVE VFX / NIAGARA PORTABILITY LAB</div><h1>Donor Effect Gallery</h1></div>
      <div class="stats"><span id="page-label">Page 1/6</span><span id="capacity">46 authored effects</span><span id="frame-time">TSL / WebGPU</span></div>
    </header>
    <div id="labels" class="labels" aria-hidden="true"></div>
    <footer class="footer"><span>webgpu-vfx · Effekseer · Kenney · PixiJS · Godot</span><span>46 donor-guided render sources</span><button id="retrigger" type="button">Retrigger bursts</button></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
